name: Build COC Members APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true

          rm -rf www/.git
          rm -rf www/.github
          rm -rf www/node_modules
          rm -rf www/www

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "lk.cocmembers.app",
            "appName": "COC Members",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      # ==================================================
      # GET THE CURRENT COC MEMBERS LOGO FROM SUPABASE
      # ==================================================

      - name: Get app logo URL
        env:
          SUPABASE_URL: https://djxpqggcpaofkpvcqgvd.supabase.co
          SUPABASE_KEY: sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c
        run: |

          echo "Getting COC Members logo URL..."

          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/app_settings?select=logo_url&limit=1")

          echo "Supabase response:"
          echo "$RESPONSE"

          LOGO_URL=$(python3 -c '
          import json
          import sys

          try:
              data = json.loads(sys.argv[1])

              if isinstance(data, list) and len(data) > 0:
                  value = data[0].get("logo_url")

                  if value:
                      print(value)

          except Exception as e:
              print("", end="")
          ' "$RESPONSE")

          if [ -z "$LOGO_URL" ]; then
            echo "ERROR: Could not find logo_url in Supabase."
            exit 1
          fi

          echo "Logo URL found successfully."

          echo "LOGO_URL=$LOGO_URL" >> "$GITHUB_ENV"

      # ==================================================
      # DOWNLOAD LOGO
      # ==================================================

      - name: Download logo
        run: |

          mkdir -p android/app/src/main/res/drawable

          curl -L \
            --fail \
            "$LOGO_URL" \
            -o /tmp/coc_members_logo

          echo "Downloaded logo file:"
          file /tmp/coc_members_logo

      # ==================================================
      # CONVERT LOGO TO PNG
      # ==================================================

      - name: Convert logo to PNG
        run: |

          sudo apt-get update

          sudo apt-get install -y imagemagick

          magick /tmp/coc_members_logo \
            -background none \
            -resize 512x512 \
            -gravity center \
            -extent 512x512 \
            android/app/src/main/res/drawable/coc_members_icon.png

          echo "PNG logo created successfully."

          file android/app/src/main/res/drawable/coc_members_icon.png

      # ==================================================
      # CREATE ANDROID LAUNCHER ICONS
      # ==================================================

      - name: Create launcher icons
        run: |

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          magick android/app/src/main/res/drawable/coc_members_icon.png \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          magick android/app/src/main/res/drawable/coc_members_icon.png \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          magick android/app/src/main/res/drawable/coc_members_icon.png \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          magick android/app/src/main/res/drawable/coc_members_icon.png \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          magick android/app/src/main/res/drawable/coc_members_icon.png \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Launcher icons created."

      # ==================================================
      # FORCE ANDROID TO USE COC MEMBERS LOGO
      # ==================================================

      - name: Configure Android launcher
        run: |

          python3 - <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/coc_members_icon"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/coc_members_icon"'
          )

          manifest.write_text(text)

          print("COC Members logo configured as Android app icon.")

          PY

      # ==================================================
      # BUILD APK
      # ==================================================

      - name: Build APK
        run: |

          cd android

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug

      # ==================================================
      # UPLOAD APK
      # ==================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-Members-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
