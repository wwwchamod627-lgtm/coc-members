name: Build COC Members APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          rm -rf www/.git
          rm -rf www/.github
          rm -rf www/node_modules
          rm -rf www/www

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "lk.cocmembers.app",
            "appName": "COC Members",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Find existing logo
        run: |
          echo "Searching for logo files..."
          find www -type f \( \
            -iname "*.png" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" \
          \) | head -50

      - name: Prepare Android app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          LOGO=$(find www -type f \( \
            -iname "*.png" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" \
          \) | grep -Ei 'logo|coc|check' | head -1)

          if [ -z "$LOGO" ]; then
            LOGO=$(find www -type f \( \
              -iname "*.png" -o \
              -iname "*.jpg" -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" \
            \) | head -1)
          fi

          if [ -n "$LOGO" ]; then
            echo "Using logo: $LOGO"

            cp "$LOGO" android/app/src/main/res/drawable/coc_members_icon.png

            cp "$LOGO" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$LOGO" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$LOGO" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$LOGO" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$LOGO" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp "$LOGO" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp "$LOGO" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp "$LOGO" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp "$LOGO" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp "$LOGO" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

            echo "App icon prepared successfully."
          else
            echo "No logo image found. Using default icon."
          fi

      - name: Configure Android launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/coc_members_icon"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/coc_members_icon"'
          )

          manifest.write_text(text)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-Members-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
