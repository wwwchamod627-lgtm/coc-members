name: Build COC Members APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true

          rm -rf www/.git
          rm -rf www/.github
          rm -rf www/node_modules
          rm -rf www/www

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "lk.cocmembers.app",
            "appName": "COC Members",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      # ----------------------------------------------------
      # GET THE EXACT APP LOGO FROM SUPABASE
      # ----------------------------------------------------

      - name: Get COC Members logo
        env:
          SUPABASE_URL: https://djxpqggcpaofkpvcqgvd.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          echo "Getting logo URL from Supabase..."

          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/app_settings?select=logo_url&limit=1")

          echo "Supabase response:"
          echo "$RESPONSE"

          LOGO_URL=$(echo "$RESPONSE" | python3 -c '
          import sys,json
          try:
              data=json.load(sys.stdin)
              if data and data[0].get("logo_url"):
                  print(data[0]["logo_url"])
          except:
              pass
          ')

          if [ -z "$LOGO_URL" ]; then
            echo "ERROR: Logo URL was not found."
            exit 1
          fi

          echo "Logo URL found:"
          echo "$LOGO_URL"

          echo "LOGO_URL=$LOGO_URL" >> $GITHUB_ENV

      # ----------------------------------------------------
      # DOWNLOAD LOGO
      # ----------------------------------------------------

      - name: Download app logo
        run: |

          mkdir -p android/app/src/main/res/drawable

          curl -L \
            "$LOGO_URL" \
            -o android/app/src/main/res/drawable/coc_members_icon.png

          echo "Downloaded logo:"
          file android/app/src/main/res/drawable/coc_members_icon.png

      # ----------------------------------------------------
      # PREPARE ANDROID ICON
      # ----------------------------------------------------

      - name: Prepare launcher icons
        run: |

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/drawable/coc_members_icon.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      # ----------------------------------------------------
      # FORCE ANDROID TO USE OUR LOGO
      # ----------------------------------------------------

      - name: Configure Android launcher icon
        run: |

          python3 - <<'PY'

          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/coc_members_icon"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/coc_members_icon"'
          )

          manifest.write_text(text)

          print("Android launcher icon configured.")

          PY

      # ----------------------------------------------------
      # BUILD APK
      # ----------------------------------------------------

      - name: Build APK
        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      # ----------------------------------------------------
      # UPLOAD APK
      # ----------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-Members-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
