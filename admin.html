<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Settings - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f3e7;
      font-family: Arial, sans-serif;
      color: #4b3515;
    }

    .header {
      background: linear-gradient(
        135deg,
        #7a5415,
        #b8860b,
        #d4af37,
        #f1d77a
      );
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .header .icon {
      font-size: 42px;
    }

    .header h1 {
      margin: 6px 0;
      font-size: 26px;
    }

    .header p {
      margin: 4px 0;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 22px 18px 40px;
    }

    .card {
      background: #fffdf8;
      border: 1px solid #dfc46b;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 22px rgba(91, 65, 20, 0.10);
    }

    .card h2 {
      margin-top: 0;
      color: #7a5818;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #5a411b;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8bd69;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      color: #3e2d14;
      outline: none;
    }

    input:focus {
      border-color: #b88a24;
      box-shadow: 0 0 0 2px rgba(184,138,36,0.15);
    }

    .logo-area {
      text-align: center;
    }

    .choose-logo {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #9a701e, #d4af37);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(128,91,18,0.20);
    }

    #logoFile {
      display: none;
    }

    .logo-preview {
      width: 100%;
      min-height: 150px;
      margin-top: 15px;
      border: 2px dashed #d3b85e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: #faf6eb;
      text-align: center;
      color: #806c4b;
    }

    .logo-preview img {
      max-width: 100%;
      max-height: 180px;
      object-fit: contain;
    }

    .save {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #9a701e, #d4af37);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(128,91,18,0.25);
    }

    .save:disabled {
      opacity: 0.6;
    }

    .back {
      width: 100%;
      padding: 14px;
      border: 1px solid #b99745;
      border-radius: 12px;
      background: white;
      color: #705016;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      min-height: 20px;
      line-height: 1.5;
    }

    .note {
      font-size: 13px;
      color: #776b59;
      line-height: 1.5;
      margin-top: 12px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #806c4b;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="icon">⚙️</div>
    <h1>Admin Settings</h1>
    <p>COC Members</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>App Information</h2>

      <label>App Name</label>
      <input
        type="text"
        id="app_name"
        placeholder="Enter App Name"
      >

      <label>Church Name</label>
      <input
        type="text"
        id="church_name"
        placeholder="Enter Church Name"
      >

      <label>Subtitle</label>
      <input
        type="text"
        id="subtitle"
        placeholder="Enter Subtitle"
      >

      <label>Welcome Text</label>
      <input
        type="text"
        id="welcome_text"
        placeholder="Enter Welcome Text"
      >
    </div>


    <div class="card">
      <h2>Home Screen Buttons</h2>

      <label>Register Button</label>
      <input
        type="text"
        id="register_button_text"
        placeholder="Register New Member"
      >

      <label>Members List Button</label>
      <input
        type="text"
        id="members_button_text"
        placeholder="Members List"
      >

      <label>Search Button</label>
      <input
        type="text"
        id="search_button_text"
        placeholder="Search Members"
      >
    </div>


    <div class="card">
      <h2>Home Screen Logo</h2>

      <div class="logo-area">

        <label class="choose-logo" for="logoFile">
          📷 CHOOSE LOGO FROM GALLERY
        </label>

        <input
          type="file"
          id="logoFile"
          accept="image/png,image/jpeg,image/webp"
        >

        <div class="logo-preview" id="logoPreview">
          No logo selected
        </div>

        <p class="note">
          Select a PNG, JPG or WEBP logo from your phone gallery.
        </p>

      </div>
    </div>


    <div id="message"></div>

    <button
      class="save"
      id="saveButton"
      onclick="saveSettings()"
    >
      💾 SAVE SETTINGS
    </button>

    <button
      class="back"
      onclick="goBack()"
    >
      ← BACK TO HOME
    </button>

  </div>


<script>

const SUPABASE_URL =
  "https://djxpqggcpaofkpvcqgvd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let selectedLogoFile = null;
let settingsId = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, isError = false) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.style.color =
    isError ? "#a32626" : "#6d5518";
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

  try {

    showMessage("Checking administrator access...");


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !sessionData ||
      !sessionData.session
    ) {

      window.location.href = "index.html";

      return;
    }


    const {
      data: isAdmin,
      error: adminError
    } =
      await supabaseClient.rpc("is_admin");


    if (adminError) {

      console.error(
        "Admin check error:",
        adminError
      );

      showMessage(
        "Admin check failed: " +
        adminError.message,
        true
      );

      return;
    }


    if (isAdmin !== true) {

      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          padding:30px;
          font-family:Arial;
          background:#f8f3e7;
          color:#5a411b;
        ">

          <div>

            <h2>Access Denied</h2>

            <p>
              Only administrators can access this page.
            </p>

            <button
              onclick="window.location.href='home.html'"
              style="
                padding:12px 20px;
                border:none;
                border-radius:10px;
                background:#b88a24;
                color:white;
                font-weight:bold;
              "
            >
              Back to Home
            </button>

          </div>

        </div>
      `;

      return;
    }


    await loadSettings();

  } catch (error) {

    console.error(error);

    showMessage(
      "System error: " + error.message,
      true
    );
  }
}


/* =========================
   LOAD SETTINGS
========================= */

async function loadSettings() {

  showMessage("Loading settings...");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("app_settings")
      .select("*")
      .order("id", {
        ascending: true
      })
      .limit(1);


  if (error) {

    console.error(
      "Load settings error:",
      error
    );

    showMessage(
      "Failed to load settings: " +
      error.message,
      true
    );

    return;
  }


  if (!data || data.length === 0) {

    showMessage(
      "No app settings found.",
      true
    );

    return;
  }


  const settings = data[0];

  settingsId = settings.id;


  document.getElementById("app_name").value =
    settings.app_name || "";

  document.getElementById("church_name").value =
    settings.church_name || "";

  document.getElementById("subtitle").value =
    settings.subtitle || "";

  document.getElementById("welcome_text").value =
    settings.welcome_text || "";

  document.getElementById("register_button_text").value =
    settings.register_button_text || "";

  document.getElementById("members_button_text").value =
    settings.members_button_text || "";

  document.getElementById("search_button_text").value =
    settings.search_button_text || "";


  if (settings.logo_url) {

    showLogoPreview(
      settings.logo_url
    );

  } else {

    document.getElementById(
      "logoPreview"
    ).textContent =
      "No logo selected";
  }


  showMessage(
    "Settings loaded successfully.",
    false
  );
}


/* =========================
   LOGO SELECT
========================= */

document
  .getElementById("logoFile")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      if (!file.type.startsWith("image/")) {

        showMessage(
          "Please select an image file.",
          true
        );

        return;
      }


      selectedLogoFile = file;


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          showLogoPreview(
            e.target.result
          );

          showMessage(
            "Logo selected. Press SAVE SETTINGS.",
            false
          );
        };


      reader.readAsDataURL(file);
    }
  );


/* =========================
   LOGO PREVIEW
========================= */

function showLogoPreview(source) {

  const preview =
    document.getElementById(
      "logoPreview"
    );


  preview.innerHTML = "";


  const img =
    document.createElement("img");


  img.src = source;

  img.alt =
    "Home Screen Logo";


  img.onerror =
    function() {

      preview.innerHTML =
        "Unable to display logo.";

    };


  preview.appendChild(img);
}


/* =========================
   UPLOAD LOGO
========================= */

async function uploadLogo() {

  if (!selectedLogoFile) {
    return null;
  }


  const extension =
    selectedLogoFile.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    "home-logo-" +
    Date.now() +
    "." +
    extension;


  const {
    error: uploadError
  } =
    await supabaseClient.storage
      .from("app-assets")
      .upload(
        filePath,
        selectedLogoFile,
        {
          cacheControl: "3600",
          upsert: true
        }
      );


  if (uploadError) {

    console.error(
      "Logo upload error:",
      uploadError
    );

    throw uploadError;
  }


  const {
    data
  } =
    supabaseClient.storage
      .from("app-assets")
      .getPublicUrl(
        filePath
      );


  if (!data || !data.publicUrl) {

    throw new Error(
      "Could not create logo URL."
    );
  }


  return (
    data.publicUrl +
    "?v=" +
    Date.now()
  );
}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings() {

  const saveButton =
    document.getElementById(
      "saveButton"
    );


  try {

    saveButton.disabled = true;

    showMessage(
      "Saving settings..."
    );


    if (!settingsId) {

      showMessage(
        "Settings record was not loaded.",
        true
      );

      return;
    }


    let logoUrl = null;


    if (selectedLogoFile) {

      showMessage(
        "Uploading logo..."
      );

      logoUrl =
        await uploadLogo();
    }


    const values = {

      app_name:
        document
          .getElementById("app_name")
          .value
          .trim(),

      church_name:
        document
          .getElementById("church_name")
          .value
          .trim(),

      subtitle:
        document
          .getElementById("subtitle")
          .value
          .trim(),

      welcome_text:
        document
          .getElementById("welcome_text")
          .value
          .trim(),

      register_button_text:
        document
          .getElementById("register_button_text")
          .value
          .trim(),

      members_button_text:
        document
          .getElementById("members_button_text")
          .value
          .trim(),

      search_button_text:
        document
          .getElementById("search_button_text")
          .value
          .trim()
    };


    if (
      !values.app_name ||
      !values.church_name ||
      !values.subtitle
    ) {

      showMessage(
        "Please fill in App Name, Church Name and Subtitle.",
        true
      );

      return;
    }


    if (logoUrl) {

      values.logo_url =
        logoUrl;
    }


    const {
      error
    } =
      await supabaseClient
        .from("app_settings")
        .update(values)
        .eq("id", settingsId);


    if (error) {

      console.error(
        "Save settings error:",
        error
      );

      showMessage(
        "Failed to save settings: " +
        error.message,
        true
      );

      return;
    }


    selectedLogoFile = null;

    document.getElementById(
      "logoFile"
    ).value = "";


    showMessage(
      "✅ Settings saved successfully.",
      false
    );


    await loadSettings();


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ Error: " +
      error.message,
      true
    );

  } finally {

    saveButton.disabled = false;
  }
}


/* =========================
   BACK
========================= */

function goBack() {

  window.location.href =
    "home.html";
}


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>
</html>
