<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Settings - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #174d3c;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #174d3c;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #174d3c;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #8b6b2e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .save-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .back-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .message {
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    .success {
      background: #dff2e5;
      color: #176b36;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    @media (max-width: 600px) {

      .container {
        padding: 10px;
      }

      .card {
        padding: 18px;
      }

    }

  </style>
</head>

<body>

  <div class="header">

    <h1>COC Members</h1>

    <p>Church Of Christ Sri Lanka</p>

    <p>Admin Settings</p>

  </div>


  <div class="container">

    <button
      class="back-btn"
      onclick="window.location.href='home.html'"
    >
      ← Back to Dashboard
    </button>


    <div class="card">

      <h2>⚙️ Admin Settings</h2>

      <div class="description">
        Update the application information below.
      </div>


      <div
        id="message"
        class="message"
      ></div>


      <div
        id="loading"
        class="loading"
      >
        Loading settings...
      </div>


      <div
        id="settingsForm"
        style="display:none;"
      >

        <!-- APP NAME -->

        <div class="form-group">

          <label for="appName">
            App Name
          </label>

          <input
            type="text"
            id="appName"
            placeholder="Enter App Name"
          >

        </div>


        <!-- CHURCH NAME -->

        <div class="form-group">

          <label for="churchName">
            Church Name
          </label>

          <input
            type="text"
            id="churchName"
            placeholder="Enter Church Name"
          >

        </div>


        <!-- SUBTITLE -->

        <div class="form-group">

          <label for="subtitle">
            Subtitle
          </label>

          <input
            type="text"
            id="subtitle"
            placeholder="Enter Subtitle"
          >

        </div>


        <!-- WELCOME TEXT -->

        <div class="form-group">

          <label for="welcomeText">
            Welcome Text
          </label>

          <textarea
            id="welcomeText"
            placeholder="Enter Welcome Text"
          ></textarea>

        </div>


        <button
          id="saveButton"
          class="save-btn"
        >
          💾 Save Settings
        </button>

      </div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const loading =
    document.getElementById(
      "loading"
    );


  const settingsForm =
    document.getElementById(
      "settingsForm"
    );


  const message =
    document.getElementById(
      "message"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const appName =
    document.getElementById(
      "appName"
    );


  const churchName =
    document.getElementById(
      "churchName"
    );


  const subtitle =
    document.getElementById(
      "subtitle"
    );


  const welcomeText =
    document.getElementById(
      "welcomeText"
    );


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " +
      type;

    message.style.display =
      "block";

  }


  /* =========================================================
     CHECK USER
  ========================================================= */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    return data.user;

  }


  /* =========================================================
     LOAD SETTINGS
  ========================================================= */

  async function loadSettings() {

    const user =
      await checkUser();


    if (!user) {
      return;
    }


    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("app_settings")
        .select("*")
        .limit(1)
        .maybeSingle();


      if (error) {

        console.error(error);

        showMessage(
          "Failed to load settings: " +
          error.message,
          "error"
        );

        loading.style.display =
          "none";

        return;

      }


      if (data) {

        appName.value =
          data.app_name || "";

        churchName.value =
          data.church_name || "";

        subtitle.value =
          data.subtitle || "";

        welcomeText.value =
          data.welcome_text || "";

      }


      loading.style.display =
        "none";


      settingsForm.style.display =
        "block";


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      showMessage(
        "Failed to load settings.",
        "error"
      );

    }

  }


  /* =========================================================
     SAVE SETTINGS
  ========================================================= */

  async function saveSettings() {

    saveButton.disabled =
      true;

    saveButton.textContent =
      "⏳ Saving...";


    message.style.display =
      "none";


    try {

      const {
        data: existing,
        error: existingError
      } =
      await supabaseClient
        .from("app_settings")
        .select("id")
        .limit(1)
        .maybeSingle();


      if (existingError) {

        throw existingError;

      }


      const settingsData = {

        app_name:
          appName.value.trim(),

        church_name:
          churchName.value.trim(),

        subtitle:
          subtitle.value.trim(),

        welcome_text:
          welcomeText.value.trim()

      };


      let result;


      if (existing) {

        result =
          await supabaseClient
            .from("app_settings")
            .update(
              settingsData
            )
            .eq(
              "id",
              existing.id
            );

      } else {

        result =
          await supabaseClient
            .from("app_settings")
            .insert(
              settingsData
            );

      }


      if (result.error) {

        throw result.error;

      }


      showMessage(
        "Settings saved successfully! ✅",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "Failed to save settings: " +
        error.message,
        "error"
      );

    }


    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Save Settings";

  }


  /* =========================================================
     SAVE EVENT
  ========================================================= */

  saveButton.addEventListener(
    "click",
    saveSettings
  );


  /* =========================================================
     START
  ========================================================= */

  loadSettings();

</script>

</body>
</html>
