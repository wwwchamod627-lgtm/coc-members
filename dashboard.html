<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6f0;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #b8860b, #d4af37);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .status {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0001;
      text-align: center;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      color: #18753c;
    }

    .error {
      color: #b42318;
    }

    .info {
      color: #555;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 10px #0001;
    }

    .card h3 {
      margin: 0 0 15px;
      color: #555;
    }

    .number {
      font-size: 40px;
      font-weight: bold;
      color: #c9a227;
    }

    .button-area {
      text-align: center;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 8px;
      background: #c9a227;
      color: white;
      padding: 13px 28px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #a98416;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      margin-top: 20px;
      background: #fff5f5;
      border: 1px solid #f0b4b4;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      display: none;
    }

    .error-title {
      font-weight: bold;
      color: #b42318;
      margin-bottom: 12px;
      font-size: 17px;
    }

    .error-row {
      margin: 9px 0;
      line-height: 1.5;
      word-break: break-word;
    }

    .error-label {
      font-weight: bold;
      color: #555;
    }

    .test-result {
      margin-top: 20px;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px #0001;
      display: none;
      text-align: left;
    }

    .test-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #555;
    }

    @media (max-width: 600px) {

      .cards {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 24px;
      }

      .container {
        padding: 15px;
      }

      .error-box {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">

    <h1>COC Members</h1>

    <p>Members Dashboard</p>

  </div>


  <!-- MAIN -->
  <div class="container">


    <!-- STATUS -->
    <div id="status" class="status info">

      Connecting to COC Members database...

    </div>


    <!-- DASHBOARD CARDS -->
    <div class="cards">


      <div class="card">

        <h3>Total Members</h3>

        <div
          id="totalMembers"
          class="number"
        >
          —
        </div>

      </div>


      <div class="card">

        <h3>Registered Today</h3>

        <div
          id="todayMembers"
          class="number"
        >
          —
        </div>

      </div>


    </div>


    <!-- BUTTON -->
    <div class="button-area">

      <button
        id="testButton"
        onclick="testConnection()"
      >
        Test Connection
      </button>

    </div>


    <!-- ERROR DETAILS -->
    <div
      id="errorBox"
      class="error-box"
    >

      <div class="error-title">
        Database Error Details
      </div>


      <div class="error-row">

        <span class="error-label">
          Message:
        </span>

        <span id="errorMessage">
          -
        </span>

      </div>


      <div class="error-row">

        <span class="error-label">
          Code:
        </span>

        <span id="errorCode">
          -
        </span>

      </div>


      <div class="error-row">

        <span class="error-label">
          Details:
        </span>

        <span id="errorDetails">
          -
        </span>

      </div>


      <div class="error-row">

        <span class="error-label">
          Hint:
        </span>

        <span id="errorHint">
          -
        </span>

      </div>


      <div class="error-row">

        <span class="error-label">
          HTTP Status:
        </span>

        <span id="errorStatus">
          -
        </span>

      </div>


    </div>


    <!-- TEST RESULT -->
    <div
      id="testResult"
      class="test-result"
    >

      <div class="test-title">
        Connection Test
      </div>

      <div id="testResultText">
        -
      </div>

    </div>


  </div>


  <script>

    // =====================================================
    // COC MEMBERS SUPABASE CONNECTION
    // =====================================================

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


    // Create Supabase client
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const statusElement =
      document.getElementById("status");

    const totalElement =
      document.getElementById("totalMembers");

    const todayElement =
      document.getElementById("todayMembers");

    const testButton =
      document.getElementById("testButton");

    const errorBox =
      document.getElementById("errorBox");

    const errorMessage =
      document.getElementById("errorMessage");

    const errorCode =
      document.getElementById("errorCode");

    const errorDetails =
      document.getElementById("errorDetails");

    const errorHint =
      document.getElementById("errorHint");

    const errorStatus =
      document.getElementById("errorStatus");

    const testResult =
      document.getElementById("testResult");

    const testResultText =
      document.getElementById("testResultText");


    // =====================================================
    // CLEAR ERROR
    // =====================================================

    function clearError() {

      errorBox.style.display = "none";

      errorMessage.textContent = "-";

      errorCode.textContent = "-";

      errorDetails.textContent = "-";

      errorHint.textContent = "-";

      errorStatus.textContent = "-";

    }


    // =====================================================
    // SHOW ERROR
    // =====================================================

    function showError(error, extraStatus = null) {

      console.error(
        "FULL SUPABASE ERROR:",
        error
      );


      errorBox.style.display = "block";


      errorMessage.textContent =
        error?.message ||
        "No error message returned";


      errorCode.textContent =
        error?.code ||
        "No code returned";


      errorDetails.textContent =
        error?.details ||
        "No details returned";


      errorHint.textContent =
        error?.hint ||
        "No hint returned";


      errorStatus.textContent =
        error?.status ||
        extraStatus ||
        "No HTTP status returned";


      statusElement.className =
        "status error";


      statusElement.textContent =
        "Database connection/query failed.";

    }


    // =====================================================
    // TEST SUPABASE CONNECTION
    // =====================================================

    async function testConnection() {

      clearError();

      testResult.style.display = "none";

      testButton.disabled = true;

      totalElement.textContent = "—";

      todayElement.textContent = "—";


      statusElement.className =
        "status info";


      statusElement.textContent =
        "Testing COC Members database...";


      try {

        // =================================================
        // STEP 1 - TEST MEMBERS TABLE
        // =================================================

        const response =
          await supabaseClient
            .from("members")
            .select("id", {
              count: "exact",
              head: true
            });


        console.log(
          "MEMBERS RESPONSE:",
          response
        );


        // =================================================
        // CHECK ERROR
        // =================================================

        if (response.error) {

          showError(
            response.error,
            response.status
          );

          testResult.style.display =
            "block";

          testResultText.textContent =
            "The Supabase request reached the database, but the members table request failed.";

          return;

        }


        // =================================================
        // TOTAL MEMBERS
        // =================================================

        const totalCount =
          response.count ?? 0;


        totalElement.textContent =
          totalCount;


        // =================================================
        // TODAY START
        // =================================================

        const now =
          new Date();


        const year =
          now.getFullYear();


        const month =
          String(
            now.getMonth() + 1
          ).padStart(2, "0");


        const day =
          String(
            now.getDate()
          ).padStart(2, "0");


        const todayStart =
          `${year}-${month}-${day}T00:00:00`;


        // =================================================
        // STEP 2 - TODAY'S MEMBERS
        // =================================================

        const todayResponse =
          await supabaseClient
            .from("members")
            .select("id", {
              count: "exact",
              head: true
            })
            .gte(
              "created_at",
              todayStart
            );


        console.log(
          "TODAY RESPONSE:",
          todayResponse
        );


        // =================================================
        // CHECK TODAY ERROR
        // =================================================

        if (todayResponse.error) {

          showError(
            todayResponse.error,
            todayResponse.status
          );

          testResult.style.display =
            "block";

          testResultText.textContent =
            "Total members query worked, but the Registered Today query failed.";

          return;

        }


        // =================================================
        // TODAY COUNT
        // =================================================

        todayElement.textContent =
          todayResponse.count ?? 0;


        // =================================================
        // SUCCESS
        // =================================================

        statusElement.className =
          "status success";


        statusElement.textContent =
          "✓ COC Members database connected successfully.";


        testResult.style.display =
          "block";


        testResultText.textContent =
          "Connection successful. The members table can be accessed.";

      }


      catch (error) {

        // =================================================
        // JAVASCRIPT / NETWORK ERROR
        // =================================================

        console.error(
          "UNEXPECTED ERROR:",
          error
        );


        showError(
          error
        );


        testResult.style.display =
          "block";


        testResultText.textContent =
          "The request could not be completed. Check the error details above.";

      }


      finally {

        testButton.disabled = false;

      }

    }


    // =====================================================
    // AUTOMATIC TEST ON PAGE LOAD
    // =====================================================

    window.addEventListener(
      "load",
      function() {

        testConnection();

      }
    );

  </script>

</body>
</html>
