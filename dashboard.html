<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6f0;
      color: #333;
    }

    .header {
      background: #c9a227;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .status {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0001;
      text-align: center;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 10px #0001;
    }

    .card h3 {
      margin: 0 0 15px;
      color: #555;
    }

    .number {
      font-size: 40px;
      font-weight: bold;
      color: #c9a227;
    }

    button {
      display: block;
      margin: 25px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #c9a227;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .success {
      color: #18753c;
    }

    .error {
      color: #b42318;
    }

    .info {
      color: #555;
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Members Dashboard</p>
  </div>

  <div class="container">

    <div id="status" class="status info">
      Connecting to COC Members database...
    </div>

    <div class="cards">

      <div class="card">
        <h3>Total Members</h3>
        <div id="totalMembers" class="number">—</div>
      </div>

      <div class="card">
        <h3>Registered Today</h3>
        <div id="todayMembers" class="number">—</div>
      </div>

    </div>

    <button onclick="testConnection()">
      Test Connection
    </button>

  </div>


  <script>

    // ============================================
    // COC MEMBERS SUPABASE
    // ============================================

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    let client = null;


    // ============================================
    // START
    // ============================================

    window.addEventListener("load", function () {

      const status = document.getElementById("status");

      try {

        if (!window.supabase) {
          throw new Error(
            "Supabase library did not load."
          );
        }

        client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        status.className = "status success";

        status.textContent =
          "✓ Supabase connection initialized.";

      } catch (error) {

        status.className = "status error";

        status.textContent =
          "Connection Error: " +
          error.message;

        console.error(error);
      }

    });


    // ============================================
    // TEST CONNECTION
    // ============================================

    async function testConnection() {

      const status =
        document.getElementById("status");

      const totalElement =
        document.getElementById("totalMembers");

      const todayElement =
        document.getElementById("todayMembers");


      if (!client) {

        status.className = "status error";

        status.textContent =
          "Supabase client is not initialized.";

        return;
      }


      status.className = "status info";

      status.textContent =
        "Testing connection to COC Members database...";


      totalElement.textContent = "—";
      todayElement.textContent = "—";


      try {

        // ========================================
        // TEST MEMBERS TABLE
        // ========================================

        const result = await client
          .from("members")
          .select("id", {
            count: "exact",
            head: true
          });


        console.log(
          "Supabase result:",
          result
        );


        if (result.error) {

          throw result.error;

        }


        // ========================================
        // TOTAL MEMBERS
        // ========================================

        totalElement.textContent =
          result.count ?? 0;


        // ========================================
        // TODAY
        // ========================================

        const now = new Date();

        const year =
          now.getFullYear();

        const month =
          String(
            now.getMonth() + 1
          ).padStart(2, "0");

        const day =
          String(
            now.getDate()
          ).padStart(2, "0");


        const todayStart =
          `${year}-${month}-${day}T00:00:00`;


        const todayResult = await client
          .from("members")
          .select("id", {
            count: "exact",
            head: true
          })
          .gte(
            "created_at",
            todayStart
          );


        console.log(
          "Today's result:",
          todayResult
        );


        if (todayResult.error) {

          throw todayResult.error;

        }


        todayElement.textContent =
          todayResult.count ?? 0;


        status.className =
          "status success";

        status.textContent =
          "✓ COC Members database connected successfully.";


      } catch (error) {

        console.error(
          "COC Members Dashboard Error:",
          error
        );


        status.className =
          "status error";


        status.textContent =
          "ERROR: " +
          (error.message ||
           "Unknown database error");


        totalElement.textContent =
          "ERROR";

        todayElement.textContent =
          "ERROR";

      }

    }

  </script>

</body>
</html>
