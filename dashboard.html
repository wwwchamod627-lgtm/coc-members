<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - COC Members</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6f0;
    }

    .header {
      background: #c9a227;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      color: #c9a227;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Dashboard</p>
  </div>

  <div class="container">

    <div class="card">
      <h3>Total Members</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Registered Today</h3>
      <div class="number">0</div>
    </div>

  </div>

</body>
</html>
