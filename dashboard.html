<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>COC Members - Dashboard</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ec;
      color: #333;
    }

    .header {
      background: #c9a227;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 15px;
    }

    .login-container {
      max-width: 420px;
      margin: 60px auto;
      padding: 20px;
    }

    .login-card,
    .dashboard-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .login-card h2 {
      text-align: center;
      margin-top: 0;
      color: #9d7a0c;
    }

    .login-card p {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c9a227;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #c9a227;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ad8918;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==========================================
       BACK TO HOME BUTTON
    ========================================== */

    .back-home-btn {
      margin-top: 12px;
      background: white;
      color: #9d7a0c;
      border: 1px solid #c9a227;
    }

    .back-home-btn:hover {
      background: #fff8df;
      color: #8e6d08;
    }

    .logout-btn {
      width: auto;
      padding: 10px 18px;
      font-size: 14px;
      background: white;
      color: #a27d08;
      border: 1px solid #c9a227;
    }

    .logout-btn:hover {
      background: #fff8df;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      background: #fff0f0;
      color: #b00020;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .success {
      margin-top: 15px;
      padding: 12px;
      background: #eef9f0;
      color: #237a35;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .dashboard-container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .welcome h2 {
      margin: 0;
      color: #8e6d08;
    }

    .welcome p {
      margin: 5px 0 0;
      color: #777;
      font-size: 14px;
    }

    .role-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #fff8df;
      color: #8e6d08;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #ead58a;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
      text-align: center;
    }

    .stat-card h3 {
      margin-top: 0;
      color: #666;
      font-size: 16px;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
      color: #c9a227;
    }

    .status {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      color: #777;
      font-size: 14px;
      text-align: center;
    }

    .access-denied {
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
    }

    .access-denied-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .access-denied-card h2 {
      color: #b00020;
      margin-top: 0;
    }

    .access-denied-card p {
      color: #666;
      line-height: 1.6;
    }

    .access-denied-card button {
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-container {
        margin: 15px auto;
      }

      .welcome {
        align-items: flex-start;
      }
    }
  </style></head><body>  <!-- HEADER -->  <div class="header">
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
  </div>  <!-- LOGIN -->  <div id="loginSection" class="login-container"><div class="login-card">

  <h2>Dashboard Login</h2>

  <p>
    Please sign in to access the members dashboard.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button
      type="submit"
      id="loginButton"
    >
      Login
    </button>

  </form>

  <!-- BACK TO HOME -->

  <button
    type="button"
    id="backHomeButton"
    class="back-home-btn"
    onclick="goHome()"
  >
    ← Back to Home
  </button>

  <div id="loginError" class="error"></div>

</div>

  </div>  <!-- ACCESS DENIED -->  <div
    id="accessDeniedSection"
    class="access-denied hidden"
  ><div class="access-denied-card">

  <h2>Access Denied</h2>

  <p>
    Your account does not have permission to access
    the COC Members Dashboard.
  </p>

  <p id="accessDeniedEmail"></p>

  <button id="accessDeniedLogoutButton">
    Logout
  </button>

  <!-- BACK TO HOME -->

  <button
    type="button"
    class="back-home-btn"
    onclick="goHome()"
  >
    ← Back to Home
  </button>

</div>

  </div>  <!-- DASHBOARD -->  <div
    id="dashboardSection"
    class="dashboard-container hidden"
  ><div class="welcome">

  <div>

    <h2>Members Dashboard</h2>

    <p id="userEmail"></p>

    <div
      id="userRole"
      class="role-badge"
    >
      —
    </div>

  </div>

  <button
    id="logoutButton"
    class="logout-btn"
  >
    Logout
  </button>

</div>


<!-- DASHBOARD STATISTICS -->

<div class="stats">

  <div class="stat-card">

    <h3>Total Members</h3>

    <div
      id="totalMembers"
      class="number"
    >
      —
    </div>

  </div>


  <div class="stat-card">

    <h3>Registered Today</h3>

    <div
      id="todayMembers"
      class="number"
    >
      —
    </div>

  </div>

</div>


<div
  id="dashboardStatus"
  class="status"
>
  Loading dashboard...
</div>

  </div><script>

  /* ==========================================
     SUPABASE CONFIGURATION
  ========================================== */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ==========================================
     PAGE ELEMENTS
  ========================================== */

  const loginSection =
    document.getElementById("loginSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const accessDeniedSection =
    document.getElementById("accessDeniedSection");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginError =
    document.getElementById("loginError");

  const logoutButton =
    document.getElementById("logoutButton");

  const accessDeniedLogoutButton =
    document.getElementById(
      "accessDeniedLogoutButton"
    );

  const accessDeniedEmail =
    document.getElementById(
      "accessDeniedEmail"
    );

  const userEmail =
    document.getElementById("userEmail");

  const userRole =
    document.getElementById("userRole");

  const totalMembers =
    document.getElementById("totalMembers");

  const todayMembers =
    document.getElementById("todayMembers");

  const dashboardStatus =
    document.getElementById("dashboardStatus");


  /* ==========================================
     BACK TO HOME
  ========================================== */

  function goHome() {

    window.location.href =
      "home.html";

  }


  /* ==========================================
     SHOW LOGIN
  ========================================== */

  function showLogin() {

    loginSection.classList.remove("hidden");

    dashboardSection.classList.add("hidden");

    accessDeniedSection.classList.add("hidden");

    loginError.style.display = "none";

  }


  /* ==========================================
     SHOW ACCESS DENIED
  ========================================== */

  function showAccessDenied(user) {

    loginSection.classList.add("hidden");

    dashboardSection.classList.add("hidden");

    accessDeniedSection.classList.remove("hidden");

    accessDeniedEmail.textContent =
      user && user.email
        ? user.email
        : "";

  }


  /* ==========================================
     CHECK DASHBOARD ACCESS
  ========================================== */

  async function checkDashboardAccess(user) {

    if (!user || !user.id) {

      return {
        allowed: false,
        role: null
      };

    }


    const { data, error } =
      await supabaseClient
        .from("dashboard_access")
        .select(
          "user_id, role, is_active"
        )
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Dashboard access error:",
        error
      );

      return {
        allowed: false,
        role: null,
        error: error
      };

    }


    if (!data) {

      return {
        allowed: false,
        role: null
      };

    }


    if (data.is_active !== true) {

      return {
        allowed: false,
        role: data.role
      };

    }


    if (
      data.role !== "main_admin" &&
      data.role !== "dashboard_staff"
    ) {

      return {
        allowed: false,
        role: data.role
      };

    }


    return {
      allowed: true,
      role: data.role
    };

  }


  /* ==========================================
     LOGIN
  ========================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      loginError.style.display = "none";

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      loginButton.disabled = true;

      loginButton.textContent =
        "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;

      }


      if (data && data.user) {

        await showDashboard(
          data.user
        );

      }


      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }
  );


  /* ==========================================
     SHOW DASHBOARD
  ========================================== */

  async function showDashboard(user) {

    const access =
      await checkDashboardAccess(user);


    /*
      Permission verification failed
    */

    if (access.error) {

      loginSection.classList.add(
        "hidden"
      );

      dashboardSection.classList.add(
        "hidden"
      );

      accessDeniedSection.classList.remove(
        "hidden"
      );

      accessDeniedEmail.textContent =
        "Unable to verify dashboard permission.";

      return;

    }


    /*
      No permission
    */

    if (!access.allowed) {

      showAccessDenied(user);

      return;

    }


    /*
      Permission granted
    */

    loginSection.classList.add(
      "hidden"
    );

    accessDeniedSection.classList.add(
      "hidden"
    );

    dashboardSection.classList.remove(
      "hidden"
    );


    userEmail.textContent =
      user.email ||
      "Logged in user";


    /*
      ROLE DISPLAY
    */

    if (access.role === "main_admin") {

      userRole.textContent =
        "Main Admin";

    }

    else if (
      access.role === "dashboard_staff"
    ) {

      userRole.textContent =
        "Dashboard Staff";

    }

    else {

      userRole.textContent =
        "Dashboard User";

    }


    /*
      Apply role permissions
    */

    applyRolePermissions(
      access.role
    );


    /*
      Load dashboard
    */

    await loadDashboard();

  }


  /* ==========================================
     ROLE PERMISSIONS
  ========================================== */

  function applyRolePermissions(role) {

    /*
      Main Admin
      ------------------------------------------
      Full dashboard permission.
    */

    if (role === "main_admin") {

      console.log(
        "Main Admin permissions enabled."
      );

      return;

    }


    /*
      Dashboard Staff
      ------------------------------------------
      Dashboard viewing permission only.
      Future admin-only controls should
      remain hidden for this role.
    */

    if (
      role === "dashboard_staff"
    ) {

      console.log(
        "Dashboard Staff permissions enabled."
      );

      return;

    }

  }


  /* ==========================================
     LOAD DASHBOARD DATA
  ========================================== */

  async function loadDashboard() {

    dashboardStatus.textContent =
      "Loading dashboard...";


    /*
      TOTAL MEMBERS
    */

    const totalResult =
      await supabaseClient
        .from("members")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        );


    if (totalResult.error) {

      dashboardStatus.textContent =
        "Database error: " +
        totalResult.error.message;

      totalMembers.textContent =
        "—";

      todayMembers.textContent =
        "—";

      console.error(
        "Total members error:",
        totalResult.error
      );

      return;

    }


    totalMembers.textContent =
      totalResult.count ?? 0;


    /*
      TODAY
    */

    const now =
      new Date();


    const startOfToday =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        0,
        0,
        0
      );


    const startOfTomorrow =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + 1,
        0,
        0,
        0
      );


    /*
      REGISTERED TODAY
    */

    const todayResult =
      await supabaseClient
        .from("members")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .gte(
          "created_at",
          startOfToday.toISOString()
        )
        .lt(
          "created_at",
          startOfTomorrow.toISOString()
        );


    if (todayResult.error) {

      dashboardStatus.textContent =
        "Total members loaded, but today's count failed: " +
        todayResult.error.message;

      todayMembers.textContent =
        "—";

      console.error(
        "Today members error:",
        todayResult.error
      );

      return;

    }


    todayMembers.textContent =
      todayResult.count ?? 0;


    dashboardStatus.textContent =
      "Dashboard connected successfully.";

  }


  /* ==========================================
     LOGOUT
  ========================================== */

  async function logoutUser() {

    await supabaseClient.auth.signOut();

    showLogin();

    document.getElementById(
      "password"
    ).value = "";

    document.getElementById(
      "email"
    ).value = "";

  }


  logoutButton.addEventListener(
    "click",
    logoutUser
  );


  accessDeniedLogoutButton.addEventListener(
    "click",
    logoutUser
  );


  /* ==========================================
     CHECK EXISTING SESSION
  ========================================== */

  async function checkSession() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (
      session &&
      session.user
    ) {

      await showDashboard(
        session.user
      );

    }

    else {

      showLogin();

    }

  }


  /* ==========================================
     AUTH STATE LISTENER
  ========================================== */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

      if (
        event === "SIGNED_IN" &&
        session &&
        session.user
      ) {

        await showDashboard(
          session.user
        );

      }


      if (
        event === "SIGNED_OUT"
      ) {

        showLogin();

      }

    }
  );


  /* ==========================================
     START APPLICATION
  ========================================== */

  checkSession();

</script></body>
</html>
