<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Member - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[readonly] {
      background: #eee;
    }

    .date-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 8px;
    }

    .date-inputs input {
      text-align: center;
    }

    .date-inputs input::placeholder {
      color: #888;
    }

    .date-help {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
    }

    .photo-current {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #ccc;
      display: none;
      margin-bottom: 12px;
    }

    .no-photo {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #777;
      margin-bottom: 12px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .photo-buttons button {
      flex: 1;
      width: auto;
      background: #174d3c;
    }

    .hidden-file {
      display: none;
    }

    .new-photo-preview {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ccc;
      display: none;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #174d3c;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      background: #777;
      margin-bottom: 15px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: bold;
      white-space: pre-line;
    }

    .success {
      background: #dff3e7;
      color: #176b3a;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
    }

    .section-title {
      margin-top: 25px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    .hidden-field {
      display: none !important;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .date-inputs {
        grid-template-columns: 1fr 1fr 1.4fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <h1 id="appName">
      COC Members
    </h1>

    <p id="churchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="subtitle">
      Members Registration
    </p>

  </div>


  <div class="container">

    <button
      class="back-btn"
      onclick="goBack()"
    >
      ← Back to Profile
    </button>


    <div class="card">

      <h2 id="editTitle">
        Edit Member
      </h2>


      <form id="editForm">

        <!-- MEMBER ID -->

        <div
          class="field"
          id="field_member_id"
        >

          <label id="label_member_id">
            Member ID
          </label>

          <input
            type="text"
            id="memberId"
            readonly
          >

        </div>


        <!-- MEMBER TYPE -->

        <div
          class="field"
          id="field_member_type"
        >

          <label id="label_member_type">
            Member Type
          </label>

          <select
            id="memberType"
          ></select>

        </div>


        <!-- FULL NAME -->

        <div
          class="field"
          id="field_full_name"
        >

          <label id="label_full_name">
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
          >

        </div>


        <!-- NIC -->

        <div
          class="field"
          id="field_nic_number"
        >

          <label id="label_nic_number">
            NIC Number
          </label>

          <input
            type="text"
            id="nicNumber"
            placeholder="Optional"
          >

        </div>


        <!-- DATE OF BIRTH -->

        <div
          class="field"
          id="field_date_of_birth"
        >

          <label id="label_date_of_birth">
            Date of Birth
          </label>

          <div class="date-inputs">

            <input
              type="text"
              id="dobDay"
              placeholder="DD"
              inputmode="numeric"
              maxlength="2"
            >

            <input
              type="text"
              id="dobMonth"
              placeholder="MM"
              inputmode="numeric"
              maxlength="2"
            >

            <input
              type="text"
              id="dobYear"
              placeholder="YYYY"
              inputmode="numeric"
              maxlength="4"
            >

          </div>

          <div class="date-help">
            Enter as DD / MM / YYYY
          </div>

        </div>


        <!-- GENDER -->

        <div
          class="field"
          id="field_gender"
        >

          <label id="label_gender">
            Gender
          </label>

          <select
            id="gender"
          ></select>

        </div>


        <!-- PHONE -->

        <div
          class="field"
          id="field_phone_whatsapp"
        >

          <label id="label_phone_whatsapp">
            Phone / WhatsApp
          </label>

          <input
            type="tel"
            id="phoneWhatsapp"
          >

        </div>


        <!-- ADDRESS -->

        <div
          class="field"
          id="field_address"
        >

          <label id="label_address">
            Address
          </label>

          <textarea
            id="address"
          ></textarea>

        </div>


        <!-- MARITAL STATUS -->

        <div
          class="field"
          id="field_marital_status"
        >

          <label id="label_marital_status">
            Marital Status
          </label>

          <select
            id="maritalStatus"
          ></select>

        </div>


        <!-- DATE OF SALVATION -->

        <div
          class="field"
          id="field_date_of_salvation"
        >

          <label id="label_date_of_salvation">
            Date of Salvation
          </label>

          <div class="date-inputs">

            <input
              type="text"
              id="salvationDay"
              placeholder="DD"
              inputmode="numeric"
              maxlength="2"
            >

            <input
              type="text"
              id="salvationMonth"
              placeholder="MM"
              inputmode="numeric"
              maxlength="2"
            >

            <input
              type="text"
              id="salvationYear"
              placeholder="YYYY"
              inputmode="numeric"
              maxlength="4"
            >

          </div>

          <div class="date-help">
            Enter as DD / MM / YYYY
          </div>

        </div>


        <!-- PHOTO -->

        <div
          class="field"
          id="field_member_photo"
        >

          <h3 class="section-title">
            <span id="label_member_photo">
              Member Photo
            </span>
          </h3>


          <div class="field">

            <label>
              Current Photo
            </label>

            <img
              id="currentPhoto"
              class="photo-current"
              alt="Current Member Photo"
            >

            <div
              id="noPhoto"
              class="no-photo"
            >
              No Photo
            </div>

          </div>


          <div class="field">

            <label>
              Change Photo
            </label>

            <div class="photo-buttons">

              <button
                type="button"
                onclick="openCamera()"
              >
                📷 Take Photo
              </button>

              <button
                type="button"
                onclick="openGallery()"
              >
                🖼️ Gallery
              </button>

            </div>


            <input
              type="file"
              id="cameraInput"
              class="hidden-file"
              accept="image/*"
              capture="environment"
            >


            <input
              type="file"
              id="galleryInput"
              class="hidden-file"
              accept="image/*"
            >


            <img
              id="newPhotoPreview"
              class="new-photo-preview"
              alt="New Photo Preview"
            >

          </div>

        </div>


        <!-- NOTES -->

        <div
          class="field"
          id="field_additional_notes"
        >

          <label id="label_additional_notes">
            Additional Notes
          </label>

          <textarea
            id="additionalNotes"
          ></textarea>

        </div>


        <button
          type="submit"
          id="updateButton"
        >
          UPDATE MEMBER
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const editForm =
    document.getElementById(
      "editForm"
    );


  const updateButton =
    document.getElementById(
      "updateButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  const cameraInput =
    document.getElementById(
      "cameraInput"
    );


  const galleryInput =
    document.getElementById(
      "galleryInput"
    );


  const currentPhoto =
    document.getElementById(
      "currentPhoto"
    );


  const noPhoto =
    document.getElementById(
      "noPhoto"
    );


  const newPhotoPreview =
    document.getElementById(
      "newPhotoPreview"
    );


  /* =========================================================
     GLOBAL DATA
  ========================================================= */

  let selectedPhotoFile =
    null;


  let currentMember =
    null;


  let formFields =
    [];


  let appSettings =
    {};


  const memberUuid =
    new URLSearchParams(
      window.location.search
    ).get("id");


  /* =========================================================
     FIELD DATABASE MAP
  ========================================================= */

  const fieldDatabaseMap = {

    member_id:
      "member_id",

    member_type:
      "member_type",

    full_name:
      "full_name",

    nic_number:
      "nic_number",

    date_of_birth:
      "date_of_birth",

    gender:
      "gender",

    phone_whatsapp:
      "phone_whatsapp",

    address:
      "address",

    marital_status:
      "marital_status",

    date_of_salvation:
      "date_of_salvation",

    member_photo:
      "photo_url",

    additional_notes:
      "additional_notes"

  };


  /* =========================================================
     FIELD ELEMENT MAP
  ========================================================= */

  const fieldElementMap = {

    member_id:
      "memberId",

    member_type:
      "memberType",

    full_name:
      "fullName",

    nic_number:
      "nicNumber",

    gender:
      "gender",

    phone_whatsapp:
      "phoneWhatsapp",

    address:
      "address",

    marital_status:
      "maritalStatus",

    additional_notes:
      "additionalNotes"

  };


  /* =========================================================
     GO BACK
  ========================================================= */

  function goBack() {

    if (memberUuid) {

      window.location.href =
        "member.html?id=" +
        encodeURIComponent(
          memberUuid
        );

    } else {

      window.location.href =
        "members.html";

    }

  }


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }


  function clearMessage() {

    message.textContent =
      "";

    message.style.display =
      "none";

  }


  /* =========================================================
     CURRENT USER
  ========================================================= */

  async function getCurrentUser() {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    return data.user;

  }


  /* =========================================================
     LOAD APP SETTINGS
  ========================================================= */

  async function loadAppSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_settings")
        .select(`
          app_name,
          church_name,
          subtitle
        `)
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(
        "App settings error:",
        error
      );

      return;

    }


    appSettings =
      data || {};


    document.getElementById(
      "appName"
    ).textContent =
      appSettings.app_name ||
      "COC Members";


    document.getElementById(
      "churchName"
    ).textContent =
      appSettings.church_name ||
      "Church Of Christ Sri Lanka";


    document.getElementById(
      "subtitle"
    ).textContent =
      appSettings.subtitle ||
      "Members Registration";

  }


  /* =========================================================
     LOAD FORM FIELDS
  ========================================================= */

  async function loadFormFields() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("form_fields")
        .select(`
          id,
          field_key,
          field_label,
          field_type,
          is_visible,
          is_required,
          display_order,
          options
        `)
        .order(
          "display_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Form fields error:",
        error
      );

      throw error;

    }


    formFields =
      data || [];

  }


  /* =========================================================
     GET FIELD
  ========================================================= */

  function getField(
    fieldKey
  ) {

    return formFields.find(
      function(field) {

        return (
          field.field_key ===
          fieldKey
        );

      }
    );

  }


  /* =========================================================
     GET OPTIONS
  ========================================================= */

  function getOptions(
    field
  ) {

    if (
      !field ||
      !field.options
    ) {

      return [];

    }


    if (
      Array.isArray(
        field.options
      )
    ) {

      return field.options;

    }


    return [];

  }


  /* =========================================================
     SET SELECT OPTIONS
  ========================================================= */

  function setSelectOptions(
    selectId,
    field
  ) {

    const select =
      document.getElementById(
        selectId
      );


    if (!select) return;


    const currentValue =
      select.getAttribute(
        "data-current-value"
      ) ||
      select.value;


    select.innerHTML =
      "";


    const placeholder =
      document.createElement(
        "option"
      );

    placeholder.value =
      "";

    placeholder.textContent =
      "Select...";


    select.appendChild(
      placeholder
    );


    const options =
      getOptions(field);


    options.forEach(
      function(optionValue) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          optionValue;

        option.textContent =
          optionValue;

        select.appendChild(
          option
        );

      }
    );


    if (
      currentValue
    ) {

      select.value =
        currentValue;

    }

  }


  /* =========================================================
     APPLY FORM FIELD SETTINGS
  ========================================================= */

  function applyFormFieldSettings() {

    formFields.forEach(
      function(field) {

        const wrapper =
          document.getElementById(
            "field_" +
            field.field_key
          );


        if (!wrapper) return;


        /* LABEL */

        const label =
          document.getElementById(
            "label_" +
            field.field_key
          );


        if (label) {

          label.textContent =
            field.field_label ||
            field.field_key;

        }


        /* VISIBILITY */

        if (
          field.is_visible === true
        ) {

          wrapper.classList.remove(
            "hidden-field"
          );

        } else {

          wrapper.classList.add(
            "hidden-field"
          );

        }


        /* REQUIRED */

        const elementId =
          fieldElementMap[
            field.field_key
          ];


        if (elementId) {

          const element =
            document.getElementById(
              elementId
            );


          if (element) {

            if (
              field.is_required === true
            ) {

              element.required =
                true;

            } else {

              element.required =
                false;

            }

          }

        }


        /* DROPDOWN OPTIONS */

        if (
          field.field_type ===
            "select"
        ) {

          if (
            field.field_key ===
            "member_type"
          ) {

            setSelectOptions(
              "memberType",
              field
            );

          }


          if (
            field.field_key ===
            "gender"
          ) {

            setSelectOptions(
              "gender",
              field
            );

          }


          if (
            field.field_key ===
            "marital_status"
          ) {

            setSelectOptions(
              "maritalStatus",
              field
            );

          }

        }

      }
    );


    /* =====================================================
       PHOTO FIELD
    ===================================================== */

    const photoField =
      getField(
        "member_photo"
      );


    const photoWrapper =
      document.getElementById(
        "field_member_photo"
      );


    if (
      photoWrapper &&
      photoField
    ) {

      if (
        photoField.is_visible === true
      ) {

        photoWrapper.classList.remove(
          "hidden-field"
        );

      } else {

        photoWrapper.classList.add(
          "hidden-field"
        );

      }

    }


    /* =====================================================
       MEMBER ID
    ===================================================== */

    const memberIdField =
      getField(
        "member_id"
      );


    if (
      memberIdField
    ) {

      const memberIdWrapper =
        document.getElementById(
          "field_member_id"
        );


      if (
        memberIdField.is_visible ===
        true
      ) {

        memberIdWrapper.classList.remove(
          "hidden-field"
        );

      } else {

        memberIdWrapper.classList.add(
          "hidden-field"
        );

      }

    }

  }


  /* =========================================================
     DATE INPUTS
  ========================================================= */

  function setDateInputs(
    dateValue,
    dayId,
    monthId,
    yearId
  ) {

    if (!dateValue) {

      document.getElementById(
        dayId
      ).value = "";

      document.getElementById(
        monthId
      ).value = "";

      document.getElementById(
        yearId
      ).value = "";

      return;

    }


    const parts =
      String(dateValue).split("-");


    if (
      parts.length !== 3
    ) return;


    document.getElementById(
      dayId
    ).value =
      parts[2];


    document.getElementById(
      monthId
    ).value =
      parts[1];


    document.getElementById(
      yearId
    ).value =
      parts[0];

  }


  /* =========================================================
     GET DATE
  ========================================================= */

  function getDateFromInputs(
    dayId,
    monthId,
    yearId,
    fieldName
  ) {

    const day =
      document.getElementById(
        dayId
      ).value.trim();


    const month =
      document.getElementById(
        monthId
      ).value.trim();


    const year =
      document.getElementById(
        yearId
      ).value.trim();


    if (
      day === "" &&
      month === "" &&
      year === ""
    ) {

      return null;

    }


    if (
      day === "" ||
      month === "" ||
      year === ""
    ) {

      throw new Error(
        fieldName +
        ": Please enter DD, MM and YYYY."
      );

    }


    if (
      !/^\d+$/.test(day) ||
      !/^\d+$/.test(month) ||
      !/^\d+$/.test(year)
    ) {

      throw new Error(
        fieldName +
        ": Please enter numbers only."
      );

    }


    const dayNumber =
      Number(day);


    const monthNumber =
      Number(month);


    const yearNumber =
      Number(year);


    if (
      monthNumber < 1 ||
      monthNumber > 12
    ) {

      throw new Error(
        fieldName +
        ": Month must be between 01 and 12."
      );

    }


    if (
      dayNumber < 1 ||
      dayNumber > 31
    ) {

      throw new Error(
        fieldName +
        ": Day must be between 01 and 31."
      );

    }


    if (
      year.length !== 4 ||
      yearNumber < 1000 ||
      yearNumber > 9999
    ) {

      throw new Error(
        fieldName +
        ": Please enter a valid 4-digit year."
      );

    }


    const testDate =
      new Date(
        yearNumber,
        monthNumber - 1,
        dayNumber
      );


    if (
      testDate.getFullYear() !==
        yearNumber ||
      testDate.getMonth() !==
        monthNumber - 1 ||
      testDate.getDate() !==
        dayNumber
    ) {

      throw new Error(
        fieldName +
        ": Invalid date."
      );

    }


    return (
      year +
      "-" +
      String(monthNumber)
        .padStart(2, "0") +
      "-" +
      String(dayNumber)
        .padStart(2, "0")
    );

  }


  /* =========================================================
     PHOTO
  ========================================================= */

  function showNewPhoto(file) {

    if (!file) return;


    selectedPhotoFile =
      file;


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        newPhotoPreview.src =
          event.target.result;

        newPhotoPreview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }


  function openCamera() {

    cameraInput.click();

  }


  function openGallery() {

    galleryInput.click();

  }


  cameraInput.addEventListener(
    "change",
    function() {

      if (
        this.files &&
        this.files[0]
      ) {

        showNewPhoto(
          this.files[0]
        );

      }

    }
  );


  galleryInput.addEventListener(
    "change",
    function() {

      if (
        this.files &&
        this.files[0]
      ) {

        showNewPhoto(
          this.files[0]
        );

      }

    }
  );


  /* =========================================================
     LOAD MEMBER
  ========================================================= */

  async function loadMember() {

    const user =
      await getCurrentUser();


    if (!user) return;


    if (!memberUuid) {

      showMessage(
        "Member ID not found.",
        "error"
      );

      return;

    }


    try {

      await loadAppSettings();

      await loadFormFields();


      /* APPLY SETTINGS BEFORE DATA */

      applyFormFieldSettings();


      const {
        data,
        error
      } =
      await supabaseClient
        .from("members")
        .select(`
          id,
          member_id,
          member_type,
          full_name,
          nic_number,
          date_of_birth,
          gender,
          phone_whatsapp,
          address,
          marital_status,
          date_of_salvation,
          photo_url,
          additional_notes
        `)
        .eq(
          "id",
          memberUuid
        )
        .single();


      if (error) {

        console.error(
          error
        );


        showMessage(
          "Failed to load member: " +
          error.message,
          "error"
        );

        return;

      }


      currentMember =
        data;


      /* =====================================================
         MEMBER ID
      ===================================================== */

      document.getElementById(
        "memberId"
      ).value =
        data.member_id || "";


      /* =====================================================
         MEMBER TYPE
      ===================================================== */

      document.getElementById(
        "memberType"
      ).value =
        data.member_type || "";


      /* =====================================================
         FULL NAME
      ===================================================== */

      document.getElementById(
        "fullName"
      ).value =
        data.full_name || "";


      /* =====================================================
         NIC
      ===================================================== */

      document.getElementById(
        "nicNumber"
      ).value =
        data.nic_number || "";


      /* =====================================================
         DOB
      ===================================================== */

      setDateInputs(
        data.date_of_birth,
        "dobDay",
        "dobMonth",
        "dobYear"
      );


      /* =====================================================
         GENDER
      ===================================================== */

      document.getElementById(
        "gender"
      ).value =
        data.gender || "";


      /* =====================================================
         PHONE
      ===================================================== */

      document.getElementById(
        "phoneWhatsapp"
      ).value =
        data.phone_whatsapp || "";


      /* =====================================================
         ADDRESS
      ===================================================== */

      document.getElementById(
        "address"
      ).value =
        data.address || "";


      /* =====================================================
         MARITAL STATUS
      ===================================================== */

      document.getElementById(
        "maritalStatus"
      ).value =
        data.marital_status || "";


      /* =====================================================
         SALVATION DATE
      ===================================================== */

      setDateInputs(
        data.date_of_salvation,
        "salvationDay",
        "salvationMonth",
        "salvationYear"
      );


      /* =====================================================
         NOTES
      ===================================================== */

      document.getElementById(
        "additionalNotes"
      ).value =
        data.additional_notes || "";


      /* =====================================================
         CURRENT PHOTO
      ===================================================== */

      if (data.photo_url) {

        currentPhoto.src =
          data.photo_url;

        currentPhoto.style.display =
          "block";

        noPhoto.style.display =
          "none";

      } else {

        currentPhoto.style.display =
          "none";

        noPhoto.style.display =
          "flex";

      }

    } catch (error) {

      console.error(
        "Load error:",
        error
      );


      showMessage(
        "Failed to load Edit Member settings: " +
        error.message,
        "error"
      );

    }

  }


  /* =========================================================
     UPLOAD NEW PHOTO
  ========================================================= */

  async function uploadNewPhoto(
    user,
    file
  ) {

    if (!file) return null;


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      throw new Error(
        "Please select an image file."
      );

    }


    if (
      file.size >
      5 * 1024 * 1024
    ) {

      throw new Error(
        "Photo is too large. Please select a photo smaller than 5 MB."
      );

    }


    let extension =
      "jpg";


    if (
      file.type ===
      "image/png"
    ) {

      extension =
        "png";

    } else if (
      file.type ===
      "image/webp"
    ) {

      extension =
        "webp";

    }


    const filePath =
      user.id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      error
    } =
    await supabaseClient
      .storage
      .from("member-photos")
      .upload(
        filePath,
        file,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            file.type

        }
      );


    if (error) {

      console.error(
        "Photo Upload Error:",
        error
      );


      throw new Error(
        "Photo upload failed: " +
        error.message
      );

    }


    const {
      data
    } =
    supabaseClient
      .storage
      .from("member-photos")
      .getPublicUrl(
        filePath
      );


    if (
      !data ||
      !data.publicUrl
    ) {

      throw new Error(
        "Could not create photo URL."
      );

    }


    return {
      path:
        filePath,

      url:
        data.publicUrl

    };

  }


  /* =========================================================
     STORAGE PATH
  ========================================================= */

  function getStoragePathFromUrl(
    photoUrl
  ) {

    if (!photoUrl) return null;


    const marker =
      "/storage/v1/object/public/member-photos/";


    const index =
      photoUrl.indexOf(
        marker
      );


    if (
      index === -1
    ) {

      return null;

    }


    return photoUrl.substring(
      index + marker.length
    );

  }


  /* =========================================================
     DELETE OLD PHOTO
  ========================================================= */

  async function deleteOldPhoto(
    photoUrl
  ) {

    const oldPath =
      getStoragePathFromUrl(
        photoUrl
      );


    if (!oldPath) return;


    const {
      error
    } =
    await supabaseClient
      .storage
      .from("member-photos")
      .remove([
        oldPath
      ]);


    if (error) {

      console.error(
        "Old Photo Delete Error:",
        error
      );

    }

  }


  /* =========================================================
     SUBMIT UPDATE
  ========================================================= */

  editForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      clearMessage();


      updateButton.disabled =
        true;


      updateButton.textContent =
        "UPDATING...";


      let uploadedNewPhoto =
        null;


      try {

        const user =
          await getCurrentUser();


        if (!user) return;


        if (!currentMember) {

          throw new Error(
            "Member data not loaded."
          );

        }


        /* ===================================================
           GET VALUES
        =================================================== */

        const memberType =
          document.getElementById(
            "memberType"
          ).value;


        const fullName =
          document.getElementById(
            "fullName"
          ).value.trim();


        const nicNumber =
          document.getElementById(
            "nicNumber"
          ).value.trim();


        const dateOfBirth =
          getDateFromInputs(
            "dobDay",
            "dobMonth",
            "dobYear",
            "Date of Birth"
          );


        const gender =
          document.getElementById(
            "gender"
          ).value;


        const phoneWhatsapp =
          document.getElementById(
            "phoneWhatsapp"
          ).value.trim();


        const address =
          document.getElementById(
            "address"
          ).value.trim();


        const maritalStatus =
          document.getElementById(
            "maritalStatus"
          ).value;


        const dateOfSalvation =
          getDateFromInputs(
            "salvationDay",
            "salvationMonth",
            "salvationYear",
            "Date of Salvation"
          );


        const additionalNotes =
          document.getElementById(
            "additionalNotes"
          ).value.trim();


        /* ===================================================
           REQUIRED CHECKS
        =================================================== */

        const requiredFields =
          formFields.filter(
            function(field) {

              return (
                field.is_required ===
                true &&
                field.is_visible ===
                true
              );

            }
          );


        for (
          const field of requiredFields
        ) {

          if (
            field.field_key ===
            "member_id"
          ) {

            continue;

          }


          if (
            field.field_key ===
            "member_photo"
          ) {

            continue;

          }


          if (
            field.field_key ===
            "date_of_birth"
          ) {

            if (
              !dateOfBirth
            ) {

              throw new Error(
                (
                  field.field_label ||
                  "Date of Birth"
                ) +
                ": This field is required."
              );

            }

            continue;

          }


          if (
            field.field_key ===
            "date_of_salvation"
          ) {

            if (
              !dateOfSalvation
            ) {

              throw new Error(
                (
                  field.field_label ||
                  "Date of Salvation"
                ) +
                ": This field is required."
              );

            }

            continue;

          }


          const elementId =
            fieldElementMap[
              field.field_key
            ];


          if (!elementId) {
            continue;
          }


          const element =
            document.getElementById(
              elementId
            );


          if (!element) {
            continue;
          }


          if (
            String(
              element.value || ""
            ).trim() === ""
          ) {

            throw new Error(
              (
                field.field_label ||
                field.field_key
              ) +
              ": This field is required."
            );

          }

        }


        /* ===================================================
           PHOTO
        =================================================== */

        let photoUrl =
          currentMember.photo_url ||
          null;


        if (selectedPhotoFile) {

          updateButton.textContent =
            "UPLOADING PHOTO...";


          uploadedNewPhoto =
            await uploadNewPhoto(
              user,
              selectedPhotoFile
            );


          photoUrl =
            uploadedNewPhoto.url;

        }


        /* ===================================================
           UPDATE DATA
        =================================================== */

        const updateData = {

          member_type:
            memberType,

          full_name:
            fullName,

          nic_number:
            nicNumber ||
            null,

          date_of_birth:
            dateOfBirth,

          gender:
            gender,

          phone_whatsapp:
            phoneWhatsapp,

          address:
            address,

          marital_status:
            maritalStatus,

          date_of_salvation:
            dateOfSalvation,

          photo_url:
            photoUrl,

          additional_notes:
            additionalNotes,

          updated_at:
            new Date().toISOString()

        };


        updateButton.textContent =
          "SAVING CHANGES...";


        const {
          error
        } =
        await supabaseClient
          .from("members")
          .update(
            updateData
          )
          .eq(
            "id",
            memberUuid
          );


        if (error) {

          if (
            uploadedNewPhoto
          ) {

            await supabaseClient
              .storage
              .from("member-photos")
              .remove([
                uploadedNewPhoto.path
              ]);

          }


          throw error;

        }


        /* ===================================================
           DELETE OLD PHOTO
        =================================================== */

        if (
          uploadedNewPhoto &&
          currentMember.photo_url
        ) {

          await deleteOldPhoto(
            currentMember.photo_url
          );

        }


        /* ===================================================
           SUCCESS
        =================================================== */

        showMessage(
          "Member Updated Successfully!",
          "success"
        );


        currentMember.photo_url =
          photoUrl;


        selectedPhotoFile =
          null;


        setTimeout(
          function() {

            window.location.href =
              "member.html?id=" +
              encodeURIComponent(
                memberUuid
              );

          },
          1200
        );


      } catch (error) {

        console.error(
          "Update Error:",
          error
        );


        showMessage(
          "Error: " +
          error.message,
          "error"
        );


      } finally {

        updateButton.disabled =
          false;

        updateButton.textContent =
          "UPDATE MEMBER";

      }

    }
  );


  /* =========================================================
     START
  ========================================================= */

  loadMember();

</script>
