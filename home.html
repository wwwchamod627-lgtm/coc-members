<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      color: #183b2b;
    }

    .header {
      background: #183b2b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 5px;
    }

    .logo img {
      max-width: 110px;
      max-height: 110px;
      object-fit: contain;
      display: none;
      margin: 0 auto 8px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 8px;
    }

    .welcome p {
      margin: 0;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    .menu button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #183b2b;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .menu button:hover {
      background: #eef2ec;
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #8b2f2f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #b00020;
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="logo" id="logoArea">
      <span id="defaultLogo">✔️</span>
      <img id="logoImage" alt="Logo">
    </div>

    <h1 id="appName">COC Members</h1>

    <p id="churchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="subtitle">
      Members Registration
    </p>

  </div>

  <div class="container">

    <div class="welcome">

      <h2>Welcome</h2>

      <p id="welcomeText">
        Welcome to Church Of Christ Sri Lanka Members Registration
      </p>

      <p id="userEmail" style="margin-top:10px;">
        Loading...
      </p>

    </div>

    <div class="menu">

      <button id="registerButton" onclick="registerMember()">
        ➕ Register New Member
      </button>

      <button id="membersButton" onclick="membersList()">
        👥 Members List
      </button>

      <button id="searchButton" onclick="searchMembers()">
        🔍 Search Members
      </button>

    </div>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

    <div id="message"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session error:", error);
        window.location.href = "index.html";
        return;
      }

      if (!data.session) {
        window.location.href = "index.html";
        return;
      }

      document.getElementById("userEmail").textContent =
        data.session.user.email;

      await loadSettings();
    }


    // ==========================================
    // LOAD ADMIN SETTINGS
    // ==========================================

    async function loadSettings() {

      const { data, error } =
        await supabaseClient
          .from("app_settings")
          .select(`
            app_name,
            church_name,
            subtitle,
            welcome_text,
            logo_url,
            register_button_text,
            members_button_text,
            search_button_text
          `)
          .limit(1)
          .maybeSingle();


      if (error) {

        console.error(
          "Failed to load settings:",
          error
        );

        return;
      }


      if (!data) {
        console.log("No app settings found.");
        return;
      }


      // ------------------------------------------
      // APP NAME
      // ------------------------------------------

      if (data.app_name) {

        document.getElementById("appName").textContent =
          data.app_name;

        document.title =
          data.app_name;

      }


      // ------------------------------------------
      // CHURCH NAME
      // ------------------------------------------

      if (data.church_name) {

        document.getElementById("churchName").textContent =
          data.church_name;

      }


      // ------------------------------------------
      // SUBTITLE
      // ------------------------------------------

      if (data.subtitle) {

        document.getElementById("subtitle").textContent =
          data.subtitle;

      }


      // ------------------------------------------
      // WELCOME TEXT
      // ------------------------------------------

      if (data.welcome_text) {

        document.getElementById("welcomeText").textContent =
          data.welcome_text;

      }


      // ------------------------------------------
      // REGISTER BUTTON
      // ------------------------------------------

      if (data.register_button_text) {

        document.getElementById("registerButton").textContent =
          data.register_button_text;

      }


      // ------------------------------------------
      // MEMBERS BUTTON
      // ------------------------------------------

      if (data.members_button_text) {

        document.getElementById("membersButton").textContent =
          data.members_button_text;

      }


      // ------------------------------------------
      // SEARCH BUTTON
      // ------------------------------------------

      if (data.search_button_text) {

        document.getElementById("searchButton").textContent =
          data.search_button_text;

      }


      // ------------------------------------------
      // LOGO
      // ------------------------------------------

      if (data.logo_url) {

        const logoImage =
          document.getElementById("logoImage");

        const defaultLogo =
          document.getElementById("defaultLogo");

        logoImage.src =
          data.logo_url;

        logoImage.style.display =
          "block";

        defaultLogo.style.display =
          "none";

      }

    }


    // ==========================================
    // NAVIGATION
    // ==========================================

    function registerMember() {

      window.location.href =
        "register.html";

    }


    function membersList() {

      window.location.href =
        "members.html";

    }


    function searchMembers() {

      window.location.href =
        "members.html";

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";

    }


    // ==========================================
    // START
    // ==========================================

    checkLogin();

  </script>

</body>
</html>
