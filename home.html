<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #c59b45;
      --secondary-color: #8b6f1d;
      --accent-color: #d4af37;
      --background-color: #f5f3ee;
      --card-color: #ffffff;
      --text-color: #222222;
      --button-text-color: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background-color);
      font-family: Arial, sans-serif;
      color: var(--text-color);
    }

    .header {
      background: var(--primary-color);
      color: var(--button-text-color);
      padding: 25px 20px;
      text-align: center;
    }

    .logo {
      min-height: 110px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #defaultLogo {
      font-size: 45px;
      display: block;
    }

    #logoImage {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: none;
      border-radius: 12px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      background: var(--card-color);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 8px;
      color: var(--text-color);
    }

    .welcome p {
      margin: 0;
      color: var(--secondary-color);
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    .menu button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: var(--card-color);
      color: var(--text-color);
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .menu button:hover {
      background: var(--accent-color);
      color: var(--button-text-color);
      transform: translateY(-1px);
    }

    /* =====================================================
       DASHBOARD BUTTON
    ====================================================== */

    #dashboardButton {
      display: none;
      border: 2px solid var(--primary-color);
      color: var(--secondary-color);
    }

    #dashboardButton:hover {
      background: var(--primary-color);
      color: var(--button-text-color);
    }

    /* =====================================================
       ADMIN PANEL BUTTON
    ====================================================== */

    #adminPanelButton {
      display: none;
    }

    .admin-panel-button {
      border: 2px solid var(--primary-color) !important;
      color: var(--secondary-color) !important;
    }

    .admin-panel-button:hover {
      background: var(--primary-color) !important;
      color: var(--button-text-color) !important;
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--secondary-color);
      color: var(--button-text-color);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout:hover {
      background: var(--accent-color);
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: var(--secondary-color);
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
    }

  </style>
</head>

<body>

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <div class="header">

    <div class="logo">

      <span id="defaultLogo">✔️</span>

      <img
        id="logoImage"
        alt="App Logo"
      >

    </div>

    <h1 id="appName">
      COC Members
    </h1>

    <p id="churchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="subtitle">
      Members Registration
    </p>

  </div>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <div class="container">

    <div class="welcome">

      <h2>
        Welcome
      </h2>

      <p id="welcomeText">
        Welcome to Church Of Christ Sri Lanka Members Registration
      </p>

      <p
        id="userEmail"
        style="margin-top:10px;"
      >
        Loading...
      </p>

    </div>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <div class="menu">

      <button
        id="registerButton"
        onclick="registerMember()"
      >
        ➕ Register New Member
      </button>


      <button
        id="membersButton"
        onclick="membersList()"
      >
        👥 Members List
      </button>


      <button
        id="searchButton"
        onclick="searchMembers()"
      >
        🔍 Search Members
      </button>


      <!-- =================================================
           DASHBOARD
           ONLY MAIN ADMIN + DASHBOARD STAFF
      ================================================== -->

      <button
        id="dashboardButton"
        onclick="openDashboard()"
      >
        📊 Dashboard
      </button>


      <!-- =================================================
           ADMIN PANEL
           ADMIN ONLY
      ================================================== -->

      <button
        id="adminPanelButton"
        class="admin-panel-button"
        onclick="adminPanel()"
      >
        ⚙️ Admin Panel
      </button>

    </div>


    <!-- =====================================================
         LOGOUT
    ====================================================== -->

    <button
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>


    <div id="message"></div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     DEFAULT SETTINGS
  ========================================================= */

  const DEFAULT_SETTINGS = {

    app_name:
      "COC Members",

    church_name:
      "Church Of Christ Sri Lanka",

    subtitle:
      "Members Registration",

    welcome_text:
      "Welcome to Church Of Christ Sri Lanka Members Registration",

    register_button_text:
      "➕ Register New Member",

    members_button_text:
      "👥 Members List",

    search_button_text:
      "🔍 Search Members",

    show_register_button:
      true,

    show_members_button:
      true,

    show_search_button:
      true

  };


  /* =========================================================
     DEFAULT THEME
  ========================================================= */

  const DEFAULT_THEME = {

    primary_color:
      "#c59b45",

    secondary_color:
      "#8b6f1d",

    accent_color:
      "#d4af37",

    background_color:
      "#f5f3ee",

    card_color:
      "#ffffff",

    text_color:
      "#222222",

    button_text_color:
      "#ffffff"

  };


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkLogin() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

        window.location.href =
          "index.html";

        return;

      }


      if (!data.session) {

        window.location.href =
          "index.html";

        return;

      }


      const user =
        data.session.user;


      /* ================================================
         SHOW LOGGED-IN USER EMAIL
      ================================================= */

      document.getElementById(
        "userEmail"
      ).textContent =
        user.email;


      /* ================================================
         ADMIN PANEL VISIBILITY

         Only users with:

         app_metadata.role = "admin"

         can see the Admin Panel button.
      ================================================= */

      const adminPanelButton =
        document.getElementById(
          "adminPanelButton"
        );


      const userRole =
        user.app_metadata?.role;


      if (
        userRole === "admin"
      ) {

        adminPanelButton.style.display =
          "block";

      }

      else {

        adminPanelButton.style.display =
          "none";

      }


      /* ================================================
         CHECK DASHBOARD ACCESS
      ================================================= */

      await checkDashboardAccess(
        user
      );


      await loadSettings();

    }

    catch (error) {

      console.error(
        "Login check error:",
        error
      );

      window.location.href =
        "index.html";

    }

  }


  /* =========================================================
     DASHBOARD ACCESS CONTROL

     Allowed users:

     1. main_admin
     2. dashboard_staff
  ========================================================= */

  async function checkDashboardAccess(user) {

    const dashboardButton =
      document.getElementById(
        "dashboardButton"
      );


    /* Default: hidden */

    dashboardButton.style.display =
      "none";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("dashboard_access")
          .select(
            "user_id, role, is_active"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Dashboard access check error:",
          error
        );

        return;

      }


      if (!data) {

        console.log(
          "Dashboard access: NO ACCESS"
        );

        return;

      }


      if (
        data.is_active !== true
      ) {

        console.log(
          "Dashboard access: INACTIVE"
        );

        return;

      }


      if (
        data.role !== "main_admin" &&
        data.role !== "dashboard_staff"
      ) {

        console.log(
          "Dashboard access: INVALID ROLE"
        );

        return;

      }


      /* ================================================
         USER HAS DASHBOARD ACCESS
      ================================================= */

      dashboardButton.style.display =
        "block";


      console.log(
        "Dashboard access granted:",
        data.role
      );

    }

    catch (error) {

      console.error(
        "Dashboard access exception:",
        error
      );

    }

  }


  /* =========================================================
     LOAD SETTINGS

     MAIN SOURCE:
     app_config

     THEME SOURCE:
     app_settings

     FALLBACK:
     DEFAULT SETTINGS / DEFAULT THEME
  ========================================================= */

  async function loadSettings() {

    let finalSettings = {
      ...DEFAULT_SETTINGS
    };


    let finalTheme = {
      ...DEFAULT_THEME
    };


    /* =====================================================
       STEP 1
       LOAD APP CONFIG
    ===================================================== */

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("app_config")
          .select(
            "setting_key, setting_value, setting_type, is_active"
          );


      if (error) {

        console.error(
          "APP_CONFIG ERROR:",
          error
        );


        showMessage(
          "APP_CONFIG ERROR: " +
          error.message +
          " | CODE: " +
          (error.code || "N/A") +
          " | DETAILS: " +
          (error.details || "N/A"),
          "error"
        );

      }


      if (
        !error &&
        data &&
        data.length > 0
      ) {

        console.log(
          "APP_CONFIG LOADED:",
          data
        );


        data.forEach(
          function(item) {

            /* Ignore inactive settings */

            if (
              item.is_active !== true
            ) {

              return;

            }


            const key =
              item.setting_key;

            const value =
              item.setting_value;


            /* Ignore empty values */

            if (
              value === null ||
              value === undefined
            ) {

              return;

            }


            /* =============================================
               BOOLEAN SETTINGS
            ============================================= */

            if (
              key === "show_register_button" ||
              key === "show_members_button" ||
              key === "show_search_button"
            ) {

              finalSettings[key] =
                String(value).toLowerCase() === "true";

              return;

            }


            /* =============================================
               TEXT SETTINGS
            ============================================= */

            const textValue =
              String(value).trim();


            if (
              textValue === ""
            ) {

              return;

            }


            if (
              key === "app_name"
            ) {

              finalSettings.app_name =
                textValue;

            }


            else if (
              key === "church_name"
            ) {

              finalSettings.church_name =
                textValue;

            }


            else if (
              key === "subtitle"
            ) {

              finalSettings.subtitle =
                textValue;

            }


            else if (
              key === "welcome_text"
            ) {

              finalSettings.welcome_text =
                textValue;

            }


            else if (
              key === "register_button_text"
            ) {

              finalSettings.register_button_text =
                "➕ " + textValue;

            }


            else if (
              key === "members_button_text"
            ) {

              finalSettings.members_button_text =
                "👥 " + textValue;

            }


            else if (
              key === "search_button_text"
            ) {

              finalSettings.search_button_text =
                "🔍 " + textValue;

            }

          }
        );

      }

    }

    catch (error) {

      console.error(
        "APP_CONFIG EXCEPTION:",
        error
      );


      showMessage(
        "APP_CONFIG EXCEPTION: " +
        error.message,
        "error"
      );

    }


    /* =====================================================
       STEP 2
       LOAD APP SETTINGS

       Logo + Theme
    ===================================================== */

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("app_settings")
          .select(
            `
              logo_url,
              primary_color,
              secondary_color,
              accent_color,
              background_color,
              card_color,
              text_color,
              button_text_color
            `
          )
          .limit(1)
          .maybeSingle();


      if (
        !error &&
        data
      ) {

        /* ===============================================
           LOAD LOGO
        =============================================== */

        loadLogo(
          data.logo_url
        );


        /* ===============================================
           LOAD THEME COLORS
        =============================================== */

        if (
          data.primary_color
        ) {

          finalTheme.primary_color =
            data.primary_color;

        }


        if (
          data.secondary_color
        ) {

          finalTheme.secondary_color =
            data.secondary_color;

        }


        if (
          data.accent_color
        ) {

          finalTheme.accent_color =
            data.accent_color;

        }


        if (
          data.background_color
        ) {

          finalTheme.background_color =
            data.background_color;

        }


        if (
          data.card_color
        ) {

          finalTheme.card_color =
            data.card_color;

        }


        if (
          data.text_color
        ) {

          finalTheme.text_color =
            data.text_color;

        }


        if (
          data.button_text_color
        ) {

          finalTheme.button_text_color =
            data.button_text_color;

        }


        console.log(
          "THEME LOADED:",
          finalTheme
        );

      }


      if (error) {

        console.error(
          "APP_SETTINGS ERROR:",
          error
        );

      }

    }

    catch (error) {

      console.error(
        "APP_SETTINGS EXCEPTION:",
        error
      );

    }


    /* =====================================================
       STEP 3
       APPLY THEME
    ===================================================== */

    applyTheme(
      finalTheme
    );


    /* =====================================================
       STEP 4
       APPLY APP SETTINGS
    ===================================================== */

    console.log(
      "FINAL HOME SETTINGS:",
      finalSettings
    );


    applySettings(
      finalSettings
    );

  }


  /* =========================================================
     APPLY THEME
  ========================================================= */

  function applyTheme(theme) {

    const root =
      document.documentElement;


    root.style.setProperty(
      "--primary-color",
      theme.primary_color
    );


    root.style.setProperty(
      "--secondary-color",
      theme.secondary_color
    );


    root.style.setProperty(
      "--accent-color",
      theme.accent_color
    );


    root.style.setProperty(
      "--background-color",
      theme.background_color
    );


    root.style.setProperty(
      "--card-color",
      theme.card_color
    );


    root.style.setProperty(
      "--text-color",
      theme.text_color
    );


    root.style.setProperty(
      "--button-text-color",
      theme.button_text_color
    );


    console.log(
      "HOME THEME APPLIED:",
      theme
    );

  }


  /* =========================================================
     APPLY SETTINGS
  ========================================================= */

  function applySettings(settings) {


    /* APP NAME */

    document.getElementById(
      "appName"
    ).textContent =
      settings.app_name;

    document.title =
      settings.app_name;


    /* CHURCH NAME */

    document.getElementById(
      "churchName"
    ).textContent =
      settings.church_name;


    /* SUBTITLE */

    document.getElementById(
      "subtitle"
    ).textContent =
      settings.subtitle;


    /* WELCOME TEXT */

    document.getElementById(
      "welcomeText"
    ).textContent =
      settings.welcome_text;


    /* REGISTER BUTTON */

    const registerButton =
      document.getElementById(
        "registerButton"
      );


    registerButton.textContent =
      settings.register_button_text;


    registerButton.style.display =
      settings.show_register_button
        ? "block"
        : "none";


    /* MEMBERS BUTTON */

    const membersButton =
      document.getElementById(
        "membersButton"
      );


    membersButton.textContent =
      settings.members_button_text;


    membersButton.style.display =
      settings.show_members_button
        ? "block"
        : "none";


    /* SEARCH BUTTON */

    const searchButton =
      document.getElementById(
        "searchButton"
      );


    searchButton.textContent =
      settings.search_button_text;


    searchButton.style.display =
      settings.show_search_button
        ? "block"
        : "none";

  }


  /* =========================================================
     LOAD LOGO
  ========================================================= */

  function loadLogo(url) {

    const logoImage =
      document.getElementById(
        "logoImage"
      );

    const defaultLogo =
      document.getElementById(
        "defaultLogo"
      );


    if (
      !url ||
      String(url).trim() === ""
    ) {

      logoImage.style.display =
        "none";

      defaultLogo.style.display =
        "block";

      return;

    }


    logoImage.onload =
      function() {

        console.log(
          "Home logo loaded successfully."
        );

        logoImage.style.display =
          "block";

        defaultLogo.style.display =
          "none";

      };


    logoImage.onerror =
      function() {

        console.error(
          "Home logo could not be loaded:",
          url
        );

        logoImage.style.display =
          "none";

        defaultLogo.style.display =
          "block";

      };


    const separator =
      url.includes("?")
        ? "&"
        : "?";


    logoImage.src =
      url +
      separator +
      "v=" +
      Date.now();

  }


  /* =========================================================
     SHOW MESSAGE
  ========================================================= */

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        "message"
      );


    message.textContent =
      text;


    if (
      type === "error"
    ) {

      message.style.color =
        "var(--secondary-color)";

    }

    else {

      message.style.color =
        "var(--primary-color)";

    }

  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  function registerMember() {

    window.location.href =
      "register.html";

  }


  function membersList() {

    window.location.href =
      "members.html";

  }


  function searchMembers() {

    window.location.href =
      "members.html";

  }


  /* =========================================================
     DASHBOARD NAVIGATION
  ========================================================= */

  function openDashboard() {

    window.location.href =
      "dashboard.html";

  }


  /* =========================================================
     ADMIN PANEL NAVIGATION
  ========================================================= */

  function adminPanel() {

    window.location.href =
      "admin.html";

  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  async function logout() {

    try {

      await supabaseClient.auth.signOut();

    }

    catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }


    window.location.href =
      "index.html";

  }


  /* =========================================================
     START APPLICATION
  ========================================================= */

  checkLogin();

</script>

</body>
</html>
