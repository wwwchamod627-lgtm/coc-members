<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      color: #183b2b;
    }

    .header {
      background: #183b2b;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      min-height: 110px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #defaultLogo {
      font-size: 45px;
      display: block;
    }

    #logoImage {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: none;
      border-radius: 12px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 8px;
    }

    .welcome p {
      margin: 0;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 15px;
    }

    .menu button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #183b2b;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .menu button:hover {
      background: #eef2ec;
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #8b2f2f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #b00020;
    }

  </style>
</head>

<body>

  <!-- ==========================================
       HEADER
  =========================================== -->

  <div class="header">

    <div class="logo">

      <span id="defaultLogo">✔️</span>

      <img
        id="logoImage"
        alt="App Logo"
      >

    </div>

    <h1 id="appName">
      COC Members
    </h1>

    <p id="churchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="subtitle">
      Members Registration
    </p>

  </div>


  <!-- ==========================================
       MAIN
  =========================================== -->

  <div class="container">

    <div class="welcome">

      <h2>
        Welcome
      </h2>

      <p id="welcomeText">
        Welcome to Church Of Christ Sri Lanka Members Registration
      </p>

      <p
        id="userEmail"
        style="margin-top:10px;"
      >
        Loading...
      </p>

    </div>


    <!-- ========================================
         MENU
    ========================================= -->

    <div class="menu">

      <button
        id="registerButton"
        onclick="registerMember()"
      >
        ➕ Register New Member
      </button>

      <button
        id="membersButton"
        onclick="membersList()"
      >
        👥 Members List
      </button>

      <button
        id="searchButton"
        onclick="searchMembers()"
      >
        🔍 Search Members
      </button>

    </div>


    <!-- ========================================
         LOGOUT
    ========================================= -->

    <button
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>


    <div id="message"></div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_LAsIvU_c";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     DEFAULT VALUES
     These are only used if database settings cannot be loaded.
  ========================================================= */

  const DEFAULT_SETTINGS = {

    app_name:
      "COC Members",

    church_name:
      "Church Of Christ Sri Lanka",

    subtitle:
      "Members Registration",

    welcome_text:
      "Welcome to Church Of Christ Sri Lanka Members Registration",

    register_button_text:
      "➕ Register New Member",

    members_button_text:
      "👥 Members List",

    search_button_text:
      "🔍 Search Members",

    show_register_button:
      true,

    show_members_button:
      true,

    show_search_button:
      true

  };


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkLogin() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      window.location.href =
        "index.html";

      return;

    }


    if (!data.session) {

      window.location.href =
        "index.html";

      return;

    }


    document.getElementById(
      "userEmail"
    ).textContent =
      data.session.user.email;


    await loadSettings();

  }


  /* =========================================================
     LOAD SETTINGS
     
     Priority:
     1. app_config
     2. app_settings fallback
     3. Default values
  ========================================================= */

  async function loadSettings() {

    let finalSettings = {
      ...DEFAULT_SETTINGS
    };


    /* =====================================================
       STEP 1
       LOAD OLD APP SETTINGS AS FALLBACK
    ===================================================== */

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("app_settings")
          .select(
            "app_name, church_name, subtitle, welcome_text, logo_url, register_button_text, members_button_text, search_button_text"
          )
          .limit(1)
          .maybeSingle();


      if (!error && data) {

        if (data.app_name) {

          finalSettings.app_name =
            data.app_name;

        }

        if (data.church_name) {

          finalSettings.church_name =
            data.church_name;

        }

        if (data.subtitle) {

          finalSettings.subtitle =
            data.subtitle;

        }

        if (data.welcome_text) {

          finalSettings.welcome_text =
            data.welcome_text;

        }

        if (data.register_button_text) {

          finalSettings.register_button_text =
            "➕ " + data.register_button_text;

        }

        if (data.members_button_text) {

          finalSettings.members_button_text =
            "👥 " + data.members_button_text;

        }

        if (data.search_button_text) {

          finalSettings.search_button_text =
            "🔍 " + data.search_button_text;

        }

        loadLogo(
          data.logo_url
        );

      }

    } catch (error) {

      console.error(
        "app_settings fallback error:",
        error
      );

    }


    /* =====================================================
       STEP 2
       LOAD APP CONFIG
    ===================================================== */

    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("app_config")
        .select(
          "setting_key, setting_value, setting_type, is_active"
        )
        .order(
          "id",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(
          "Failed to load app_config:",
          error
        );

      }
      else if (data) {

        data.forEach(
          function(item) {

            if (
              !item.is_active
            ) {

              return;

            }


            const key =
              item.setting_key;


            const value =
              item.setting_value;


            if (
              key === "show_register_button" ||
              key === "show_members_button" ||
              key === "show_search_button"
            ) {

              finalSettings[key] =
                String(value).toLowerCase() === "true";

              return;

            }


            if (
              value !== null &&
              value !== undefined &&
              String(value).trim() !== ""
            ) {

              if (
                key === "app_name"
              ) {

                finalSettings.app_name =
                  value;

              }

              else if (
                key === "church_name"
              ) {

                finalSettings.church_name =
                  value;

              }

              else if (
                key === "subtitle"
              ) {

                finalSettings.subtitle =
                  value;

              }

              else if (
                key === "welcome_text"
              ) {

                finalSettings.welcome_text =
                  value;

              }

              else if (
                key === "register_button_text"
              ) {

                finalSettings.register_button_text =
                  "➕ " + value;

              }

              else if (
                key === "members_button_text"
              ) {

                finalSettings.members_button_text =
                  "👥 " + value;

              }

              else if (
                key === "search_button_text"
              ) {

                finalSettings.search_button_text =
                  "🔍 " + value;

              }

            }

          }
        );

      }

    } catch (error) {

      console.error(
        "app_config error:",
        error
      );

    }


    /* =====================================================
       STEP 3
       APPLY SETTINGS TO HOME PAGE
    ===================================================== */

    applySettings(
      finalSettings
    );

  }


  /* =========================================================
     APPLY SETTINGS
  ========================================================= */

  function applySettings(settings) {


    /* =====================================================
       APP NAME
    ===================================================== */

    document.getElementById(
      "appName"
    ).textContent =
      settings.app_name;

    document.title =
      settings.app_name;


    /* =====================================================
       CHURCH NAME
    ===================================================== */

    document.getElementById(
      "churchName"
    ).textContent =
      settings.church_name;


    /* =====================================================
       SUBTITLE
    ===================================================== */

    document.getElementById(
      "subtitle"
    ).textContent =
      settings.subtitle;


    /* =====================================================
       WELCOME TEXT
    ===================================================== */

    document.getElementById(
      "welcomeText"
    ).textContent =
      settings.welcome_text;


    /* =====================================================
       REGISTER BUTTON
    ===================================================== */

    const registerButton =
      document.getElementById(
        "registerButton"
      );


    registerButton.textContent =
      settings.register_button_text;


    registerButton.style.display =
      settings.show_register_button
        ? "block"
        : "none";


    /* =====================================================
       MEMBERS BUTTON
    ===================================================== */

    const membersButton =
      document.getElementById(
        "membersButton"
      );


    membersButton.textContent =
      settings.members_button_text;


    membersButton.style.display =
      settings.show_members_button
        ? "block"
        : "none";


    /* =====================================================
       SEARCH BUTTON
    ===================================================== */

    const searchButton =
      document.getElementById(
        "searchButton"
      );


    searchButton.textContent =
      settings.search_button_text;


    searchButton.style.display =
      settings.show_search_button
        ? "block"
        : "none";

  }


  /* =========================================================
     LOAD LOGO
  ========================================================= */

  function loadLogo(url) {

    const logoImage =
      document.getElementById(
        "logoImage"
      );


    const defaultLogo =
      document.getElementById(
        "defaultLogo"
      );


    /* No URL */

    if (
      !url ||
      url.trim() === ""
    ) {

      logoImage.style.display =
        "none";

      defaultLogo.style.display =
        "block";

      return;

    }


    /* Prepare image */

    logoImage.onload =
      function() {

        console.log(
          "Logo loaded successfully."
        );

        logoImage.style.display =
          "block";

        defaultLogo.style.display =
          "none";

      };


    logoImage.onerror =
      function() {

        console.error(
          "Logo could not be loaded:",
          url
        );

        logoImage.style.display =
          "none";

        defaultLogo.style.display =
          "block";

      };


    /* Add cache-busting */

    const separator =
      url.includes("?")
        ? "&"
        : "?";


    logoImage.src =
      url +
      separator +
      "v=" +
      Date.now();

  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  function registerMember() {

    window.location.href =
      "register.html";

  }


  function membersList() {

    window.location.href =
      "members.html";

  }


  function searchMembers() {

    window.location.href =
      "members.html";

  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";

  }


  /* =========================================================
     START
  ========================================================= */

  checkLogin();

</script>

</body>
</html>
