<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #183b2b;
      font-size: 30px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 15px 0 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">✔️</div>

    <h1>COC Members</h1>

    <div class="subtitle">
      Church Of Christ Sri Lanka<br>
      Members Registration
    </div>

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button id="loginBtn">LOGIN</button>

    <div id="message"></div>

  </div>

  <script>
    const SUPABASE_URL = "https://djxpqggcpaofkpvcqgvd.supabase.co";

    /*
      IMPORTANT:
      Replace ONLY the text below with your Supabase
      Publishable key.

      Do NOT use the service_role / secret key.
    */
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    loginBtn.addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "";

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        message.style.color = "#b00020";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "LOGGING IN...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        message.style.color = "#b00020";

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";
        return;
      }

      message.textContent = "Login successful!";
      message.style.color = "#183b2b";

      setTimeout(() => {
        window.location.href = "home.html";
      }, 500);
    });
  </script>

</body>
</html>
