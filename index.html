<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    /* =========================
       LOGIN LOGO
    ========================= */

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #defaultLogo {
      font-size: 55px;
      display: block;
    }

    #loginLogoImage {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: none;
    }

    h1 {
      margin: 0;
      color: #183b2b;
      font-size: 30px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 15px 0 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #183b2b;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <!-- LOGIN LOGO -->

    <div class="logo">

      <span id="defaultLogo">
        ✔️
      </span>

      <img
        id="loginLogoImage"
        alt="Login Logo"
      >

    </div>


    <h1 id="appName">
      COC Members
    </h1>


    <div class="subtitle">

      <span id="churchName">
        Church Of Christ Sri Lanka
      </span>

      <br>

      <span id="subtitleText">
        Members Registration
      </span>

    </div>


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >


    <button id="loginBtn">
      LOGIN
    </button>


    <div id="message"></div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const loginLogoImage =
    document.getElementById("loginLogoImage");

  const defaultLogo =
    document.getElementById("defaultLogo");


  /* =========================================================
     LOAD LOGIN SETTINGS
  ========================================================= */

  async function loadLoginSettings() {

    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("app_settings")
        .select(
          "app_name, church_name, subtitle, login_logo_url"
        )
        .limit(1)
        .maybeSingle();


      if (error) {

        console.error(
          "Failed to load login settings:",
          error
        );

        return;

      }


      if (!data) {
        return;
      }


      /* APP NAME */

      if (data.app_name) {

        document.getElementById(
          "appName"
        ).textContent =
          data.app_name;

        document.title =
          data.app_name;

      }


      /* CHURCH NAME */

      if (data.church_name) {

        document.getElementById(
          "churchName"
        ).textContent =
          data.church_name;

      }


      /* SUBTITLE */

      if (data.subtitle) {

        document.getElementById(
          "subtitleText"
        ).textContent =
          data.subtitle;

      }


      /* LOGIN LOGO */

      loadLoginLogo(
        data.login_logo_url
      );

    } catch (error) {

      console.error(
        "Login settings error:",
        error
      );

    }

  }


  /* =========================================================
     LOAD LOGIN LOGO
  ========================================================= */

  function loadLoginLogo(url) {

    if (
      !url ||
      url.trim() === ""
    ) {

      loginLogoImage.style.display =
        "none";

      defaultLogo.style.display =
        "block";

      return;

    }


    loginLogoImage.onload =
      function() {

        console.log(
          "Login logo loaded successfully."
        );

        loginLogoImage.style.display =
          "block";

        defaultLogo.style.display =
          "none";

      };


    loginLogoImage.onerror =
      function() {

        console.error(
          "Login logo could not be loaded:",
          url
        );

        loginLogoImage.style.display =
          "none";

        defaultLogo.style.display =
          "block";

      };


    const separator =
      url.includes("?")
        ? "&"
        : "?";


    loginLogoImage.src =
      url +
      separator +
      "v=" +
      Date.now();

  }


  /* =========================================================
     LOGIN
  ========================================================= */

  loginBtn.addEventListener(
    "click",
    async function() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      message.textContent =
        "";


      if (
        !email ||
        !password
      ) {

        message.textContent =
          "Please enter your email and password.";

        message.style.color =
          "#b00020";

        return;

      }


      loginBtn.disabled =
        true;

      loginBtn.textContent =
        "LOGGING IN...";


      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


      if (error) {

        message.textContent =
          error.message;

        message.style.color =
          "#b00020";

        loginBtn.disabled =
          false;

        loginBtn.textContent =
          "LOGIN";

        return;

      }


      message.textContent =
        "Login successful!";

      message.style.color =
        "#183b2b";


      setTimeout(
        function() {

          window.location.href =
            "home.html";

        },
        500
      );

    }
  );


  /* =========================================================
     START
  ========================================================= */

  loadLoginSettings();

</script>

</body>
</html>
