<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #c59b45;
      --secondary-color: #8b6f1d;
      --accent-color: #d4af37;
      --background-color: #f5f3ee;
      --card-color: #ffffff;
      --text-color: #222222;
      --button-text-color: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background-color);
      font-family: Arial, sans-serif;
      padding: 20px;
      color: var(--text-color);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: var(--card-color);
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    /* =========================
       LOGIN LOGO
    ========================= */

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loginLogoImage {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: 30px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: var(--secondary-color);
      line-height: 1.5;
      font-size: 15px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 15px 0 7px;
      color: var(--text-color);
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: var(--card-color);
      color: var(--text-color);
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(197,155,69,0.15);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: var(--primary-color);
      color: var(--button-text-color);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--accent-color);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <!-- =====================================================
         LOGIN LOGO
         LOCAL GITHUB LOGO = PERMANENT FALLBACK
    ====================================================== -->

    <div class="logo">

      <img
        id="loginLogoImage"
        src="coc_members_icon.png"
        alt="COC Members Logo"
      >

    </div>


    <h1 id="appName">
      COC Members
    </h1>


    <div class="subtitle">

      <span id="churchName">
        Church Of Christ Sri Lanka
      </span>

      <br>

      <span id="subtitleText">
        Members Registration
      </span>

    </div>


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >


    <button id="loginBtn">
      LOGIN
    </button>


    <div id="message"></div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     DEFAULT THEME
  ========================================================= */

  const DEFAULT_THEME = {

    primary_color:
      "#c59b45",

    secondary_color:
      "#8b6f1d",

    accent_color:
      "#d4af37",

    background_color:
      "#f5f3ee",

    card_color:
      "#ffffff",

    text_color:
      "#222222",

    button_text_color:
      "#ffffff"

  };


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const loginLogoImage =
    document.getElementById("loginLogoImage");


  /* =========================================================
     APPLY THEME
  ========================================================= */

  function applyTheme(theme) {

    const root =
      document.documentElement;

    root.style.setProperty(
      "--primary-color",
      theme.primary_color
    );

    root.style.setProperty(
      "--secondary-color",
      theme.secondary_color
    );

    root.style.setProperty(
      "--accent-color",
      theme.accent_color
    );

    root.style.setProperty(
      "--background-color",
      theme.background_color
    );

    root.style.setProperty(
      "--card-color",
      theme.card_color
    );

    root.style.setProperty(
      "--text-color",
      theme.text_color
    );

    root.style.setProperty(
      "--button-text-color",
      theme.button_text_color
    );

  }


  /* =========================================================
     LOGO ERROR PROTECTION
     
     If any code later tries to replace the logo with a
     Supabase URL and that URL fails, automatically return
     to the local GitHub logo.
  ========================================================= */

  loginLogoImage.onerror =
    function() {

      console.warn(
        "Remote login logo failed. Using local COC Members logo."
      );

      loginLogoImage.onerror = null;

      loginLogoImage.src =
        "coc_members_icon.png";

    };


  /* =========================================================
     LOAD LOGIN SETTINGS
  ========================================================= */

  async function loadLoginSettings() {

    let finalTheme = {
      ...DEFAULT_THEME
    };


    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("app_settings")
        .select(
          `
            app_name,
            church_name,
            subtitle,
            primary_color,
            secondary_color,
            accent_color,
            background_color,
            card_color,
            text_color,
            button_text_color
          `
        )
        .limit(1)
        .maybeSingle();


      /* =====================================================
         DATABASE ERROR
         
         The local logo remains visible.
      ===================================================== */

      if (error) {

        console.error(
          "Failed to load login settings:",
          error
        );

        applyTheme(
          finalTheme
        );

        return;

      }


      if (!data) {

        applyTheme(
          finalTheme
        );

        return;

      }


      /* =====================================================
         APP NAME
      ===================================================== */

      if (data.app_name) {

        document.getElementById(
          "appName"
        ).textContent =
          data.app_name;

        document.title =
          data.app_name;

      }


      /* =====================================================
         CHURCH NAME
      ===================================================== */

      if (data.church_name) {

        document.getElementById(
          "churchName"
        ).textContent =
          data.church_name;

      }


      /* =====================================================
         SUBTITLE
      ===================================================== */

      if (data.subtitle) {

        document.getElementById(
          "subtitleText"
        ).textContent =
          data.subtitle;

      }


      /* =====================================================
         COLOUR SETTINGS
      ===================================================== */

      if (data.primary_color) {

        finalTheme.primary_color =
          data.primary_color;

      }

      if (data.secondary_color) {

        finalTheme.secondary_color =
          data.secondary_color;

      }

      if (data.accent_color) {

        finalTheme.accent_color =
          data.accent_color;

      }

      if (data.background_color) {

        finalTheme.background_color =
          data.background_color;

      }

      if (data.card_color) {

        finalTheme.card_color =
          data.card_color;

      }

      if (data.text_color) {

        finalTheme.text_color =
          data.text_color;

      }

      if (data.button_text_color) {

        finalTheme.button_text_color =
          data.button_text_color;

      }


      applyTheme(
        finalTheme
      );

    }

    catch (error) {

      console.error(
        "Login settings error:",
        error
      );

      applyTheme(
        finalTheme
      );

    }

  }


  /* =========================================================
     LOGIN
  ========================================================= */

  loginBtn.addEventListener(
    "click",
    async function() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      message.textContent =
        "";


      if (
        !email ||
        !password
      ) {

        message.textContent =
          "Please enter your email and password.";

        message.style.color =
          "var(--secondary-color)";

        return;

      }


      loginBtn.disabled =
        true;

      loginBtn.textContent =
        "LOGGING IN...";


      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


      if (error) {

        message.textContent =
          error.message;

        message.style.color =
          "var(--secondary-color)";

        loginBtn.disabled =
          false;

        loginBtn.textContent =
          "LOGIN";

        return;

      }


      message.textContent =
        "Login successful!";

      message.style.color =
        "var(--primary-color)";


      setTimeout(
        function() {

          window.location.href =
            "home.html";

        },
        500
      );

    }
  );


  /* =========================================================
     START
  ========================================================= */

  loadLoginSettings();

</script>

</body>
</html>
