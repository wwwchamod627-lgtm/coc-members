<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COC Members</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #183b2b;
      font-size: 30px;
    }

    .subtitle {
      margin: 10px 0 30px;
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin: 15px 0 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">✔️</div>

    <h1>COC Members</h1>

    <div class="subtitle">
      Church Of Christ Sri Lanka<br>
      Members Registration
    </div>

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Password</label>
    <input type="password" placeholder="Enter your password">

    <button>LOGIN</button>

  </div>

</body>
</html>
