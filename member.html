  </style></head><body>  <div class="header"><div class="header-content">

>

<div id="messageBox"></div>

<div id="profileArea">

  </div><script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     GLOBAL DATA
  ========================================================= */

  let currentMember = null;

  let memberListFields = [];

  let appSettings = {};

  let currentUser = null;

  let currentUserRole = "unknown";

  let canEditMember = false;

  let canDeleteMember = false;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const profileArea =
    document.getElementById("profileArea");

  const messageBox =
    document.getElementById("messageBox");


  /* =========================================================
     FIELD → DATABASE COLUMN
  ========================================================= */

  const fieldDatabaseMap = {

    member_id: "member_id",

    member_type: "member_type",

    full_name: "full_name",

    nic_number: "nic_number",

    date_of_birth: "date_of_birth",

    gender: "gender",

    phone_whatsapp: "phone_whatsapp",

    address: "address",

    marital_status: "marital_status",

    date_of_salvation: "date_of_salvation",

    member_photo: "photo_url",

    additional_notes: "additional_notes"

  };


  /* =========================================================
     APPLY THEME
  ========================================================= */

  function applyTheme() {

    const root =
      document.documentElement;


    if (appSettings.primary_color) {

      root.style.setProperty(
        "--primary-color",
        appSettings.primary_color
      );

    }

    if (appSettings.secondary_color) {

      root.style.setProperty(
        "--secondary-color",
        appSettings.secondary_color
      );

    }

    if (appSettings.accent_color) {

      root.style.setProperty(
        "--accent-color",
        appSettings.accent_color
      );

    }

    if (appSettings.background_color) {

      root.style.setProperty(
        "--background-color",
        appSettings.background_color
      );

    }

    if (appSettings.card_color) {

      root.style.setProperty(
        "--card-color",
        appSettings.card_color
      );

    }

    if (appSettings.text_color) {

      root.style.setProperty(
        "--text-color",
        appSettings.text_color
      );

    }

    if (appSettings.button_text_color) {

      root.style.setProperty(
        "--button-text-color",
        appSettings.button_text_color
      );

    }

  }


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    currentUser =
      data.user;


    return data.user;

  }


  /* =========================================================
     LOAD USER ROLE / PERMISSIONS
  ========================================================= */

  async function loadUserPermissions(user) {

    /*
      Main Admin
      ----------
      Main Admin is identified through dashboard_access
      with role = main_admin.

      Dashboard Staff
      ---------------
      Dashboard Staff is also identified through
      dashboard_access.

      Staff
      -----
      Staff is identified through staff_permissions.
    */


    currentUserRole =
      "unknown";

    canEditMember =
      false;

    canDeleteMember =
      false;


    /* =====================================================
       CHECK MAIN ADMIN / DASHBOARD STAFF
    ===================================================== */

    const {
      data: dashboardAccess,
      error: dashboardError
    } =
      await supabaseClient
        .from("dashboard_access")
        .select(`
          user_id,
          role,
          is_active
        `)
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        )
        .maybeSingle();


    if (
      dashboardError &&
      dashboardError.code !== "PGRST116"
    ) {

      console.error(
        "Dashboard access error:",
        dashboardError
      );

    }


    if (
      dashboardAccess &&
      dashboardAccess.role ===
      "main_admin"
    ) {

      currentUserRole =
        "main_admin";

      canEditMember =
        true;

      canDeleteMember =
        true;

      return;

    }


    if (
      dashboardAccess &&
      dashboardAccess.role ===
      "dashboard_staff"
    ) {

      currentUserRole =
        "dashboard_staff";

      /*
        Dashboard Staff is not included in the
        Staff editing permissions.
      */

      canEditMember =
        false;

      canDeleteMember =
        false;

      return;

    }


    /* =====================================================
       CHECK STAFF PERMISSIONS
    ===================================================== */

    const {
      data: staffPermission,
      error: staffError
    } =
      await supabaseClient
        .from("staff_permissions")
        .select(`
          user_id,
          role,
          can_register_member,
          can_add_photo,
          can_edit_own_member,
          can_view_members,
          is_active
        `)
        .eq(
          "user_id",
          user.id
        )
        .eq(
          "is_active",
          true
        )
        .maybeSingle();


    if (
      staffError &&
      staffError.code !== "PGRST116"
    ) {

      console.error(
        "Staff permission error:",
        staffError
      );

    }


    if (staffPermission) {

      currentUserRole =
        "staff";

      canEditMember =
        staffPermission.can_edit_own_member === true;

      /*
        Delete permission was NOT part of the
        agreed Staff permissions.

        Therefore Staff cannot delete members.
      */

      canDeleteMember =
        false;

      return;

    }


    /*
      Authenticated user without a known role.
    */

    currentUserRole =
      "unknown";

  }


  /* =========================================================
     LOAD APP SETTINGS
  ========================================================= */

  async function loadAppSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_settings")
        .select(`
          app_name,
          church_name,
          subtitle,
          logo_url,
          primary_color,
          secondary_color,
          accent_color,
          background_color,
          card_color,
          text_color,
          button_text_color
        `)
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(
        "App settings error:",
        error
      );

      return;

    }


    appSettings =
      data || {};


    applyTheme();


    document.getElementById(
      "appName"
    ).textContent =
      appSettings.app_name ||
      "COC Members";


    document.getElementById(
      "churchName"
    ).textContent =
      appSettings.church_name ||
      "Church Of Christ Sri Lanka";


    document.getElementById(
      "subtitle"
    ).textContent =
      appSettings.subtitle ||
      "Members Registration";


    /* =====================================================
       LOGO
    ===================================================== */

    if (appSettings.logo_url) {

      const logoWrapper =
        document.getElementById(
          "logoWrapper"
        );

      const logo =
        document.getElementById(
          "appLogo"
        );


      logo.src =
        appSettings.logo_url;


      logo.onload =
        function() {

          logoWrapper.style.display =
            "block";

        };


      logo.onerror =
        function() {

          logoWrapper.style.display =
            "none";

        };

    }

  }


  /* =========================================================
     LOAD MEMBER LIST SETTINGS
  ========================================================= */

  async function loadMemberListFields() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("member_list_fields")
        .select(`
          id,
          field_key,
          field_label,
          is_visible,
          is_searchable,
          display_order,
          show_in_pdf
        `)
        .order(
          "display_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Member list fields error:",
        error
      );

      throw error;

    }


    memberListFields =
      data || [];

  }


  /* =========================================================
     GET VISIBLE FIELDS
  ========================================================= */

  function getVisibleFields() {

    return memberListFields
      .filter(
        function(field) {

          return field.is_visible === true;

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(a.display_order || 0) -
            Number(b.display_order || 0)
          );

        }
      );

  }


  /* =========================================================
     GET PDF FIELDS
  ========================================================= */

  function getPdfFields() {

    return memberListFields
      .filter(
        function(field) {

          return field.show_in_pdf === true;

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(a.display_order || 0) -
            Number(b.display_order || 0)
          );

        }
      );

  }


  /* =========================================================
     SHOW VALUE
  ========================================================= */

  function showValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "Not provided";

    }


    return String(value);

  }


  /* =========================================================
     FORMAT DATE
  ========================================================= */

  function formatDate(date) {

    if (!date) {

      return "Not provided";

    }


    const parts =
      String(date).split("-");


    if (
      parts.length !== 3
    ) {

      return String(date);

    }


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  /* =========================================================
     GET FIELD VALUE
  ========================================================= */

  function getFieldValue(
    member,
    fieldKey
  ) {

    const column =
      fieldDatabaseMap[fieldKey];


    if (!column) {

      return "";

    }


    const value =
      member[column];


    if (
      fieldKey === "date_of_birth" ||
      fieldKey === "date_of_salvation"
    ) {

      return formatDate(value);

    }


    return showValue(value);

  }


  /* =========================================================
     GET FIELD
  ========================================================= */

  function getField(fieldKey) {

    return memberListFields.find(
      function(field) {

        return (
          field.field_key ===
          fieldKey
        );

      }
    );

  }


  /* =========================================================
     CREATE DETAIL
  ========================================================= */

  function createDetail(
    label,
    value
  ) {

    const row =
      document.createElement("div");

    row.className =
      "detail-row";


    const labelDiv =
      document.createElement("div");

    labelDiv.className =
      "detail-label";

    labelDiv.textContent =
      label;


    const valueDiv =
      document.createElement("div");

    valueDiv.className =
      "detail-value";

    valueDiv.textContent =
      value;


    row.appendChild(
      labelDiv
    );

    row.appendChild(
      valueDiv
    );


    return row;

  }


  /* =========================================================
     CREATE SECTION TITLE
  ========================================================= */

  function createSectionTitle(
    text
  ) {

    const title =
      document.createElement("div");

    title.className =
      "section-title";

    title.textContent =
      text;

    return title;

  }


  /* =========================================================
     DISPLAY MEMBER
  ========================================================= */

  function displayMember(member) {

    currentMember =
      member;


    /*
      Final ownership check for Staff.

      Main Admin:
      Can edit/delete every member.

      Staff:
      Can edit ONLY if created_by equals
      current authenticated user's ID.

      Staff cannot delete.
    */

    if (
      currentUserRole === "main_admin"
    ) {

      canEditMember =
        true;

      canDeleteMember =
        true;

    } else if (
      currentUserRole === "staff"
    ) {

      canEditMember =
        canEditMember === true &&
        member.created_by ===
        currentUser.id;

      canDeleteMember =
        false;

    } else {

      canEditMember =
        false;

      canDeleteMember =
        false;

    }


    profileArea.innerHTML =
      "";


    const card =
      document.createElement("div");

    card.className =
      "profile-card";


    /* =====================================================
       PROFILE HEADER
    ===================================================== */

    const header =
      document.createElement("div");

    header.className =
      "profile-header";


    /* PHOTO */

    const photoField =
      getField(
        "member_photo"
      );


    const showPhoto =
      photoField
        ? photoField.is_visible === true
        : true;


    if (showPhoto) {

      const photoFrame =
        document.createElement("div");

      photoFrame.className =
        "photo-frame";


      const photo =
        document.createElement("img");

      photo.className =
        "profile-photo";

      photo.alt =
        "Member Photo";


      if (member.photo_url) {

        photo.src =
          member.photo_url;

      } else {

        photo.src =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="200"
                 height="200">
              <rect width="100%"
                    height="100%"
                    fill="#f2eee3"/>
              <circle cx="100"
                      cy="78"
                      r="35"
                      fill="#c9b98f"/>
              <path d="M35 180
                       C42 135
                       158 135
                       165 180"
                    fill="#c9b98f"/>
              <text x="50%"
                    y="195"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-size="12"
                    fill="#8c6f2d">
                NO PHOTO
              </text>
            </svg>
          `);

      }


      photoFrame.appendChild(
        photo

      header.appendChild(

      );

    }


    /* MEMBER ID */

    const idField =
      getField(
        "member_id"
      );


    if (
      idField &&

    ) {

      const id =
        document.createElement("div");

      id.className =

      id.textContent =

          member,
          "member_id"
        );

      header.appendChild(
        id
      );

    }


    /* FULL NAME */

    const nameField =
      getField(
        "full_name"
      );


    if (
      nameField &&
      nameField.is_visible === true
    ) {

      const name =
        document.createElement("div");

      name.className =
        "member-name";

      name.textContent =
        getFieldValue(
          member,
          "full_name"
        );

      header.appendChild(
        name
      );

    }


    /* MEMBER TYPE */

    const typeField =
      getField(
        "member_type"
      );


    if (
      typeField &&
      typeField.is_visible === true
    ) {

      const type =
        document.createElement("div");

      type.className =
        "member-type";

      type.textContent =

    /* =====================================================

    const detailFields =

            field.field_key !== "member_id" &&
            field.field_key !== "full_name" &&
            field.field_key !== "member_type" &&
            field.field_key !== "additional_notes"

        }
      );


    if (
      detailFields.length > 0
    ) {

      card.appendChild(
        createSectionTitle(
          "Member Information"
        )
      );


      const details =
        document.createElement("div");

      details.className =
        "details";


      detailFields.forEach(
        function(field) {

          const value =
            getFieldValue(
              member,
              field.field_key
            );


          details.appendChild(
            createDetail(

              field.field_key,

            )
          );

      );


      card.appendChild(

    /* =====================================================
       ADDITIONAL NOTES
    ===================================================== */

    const notesField =
      getField(

    if (
      notesField &&
      notesField.is_visible === true
    ) {

      const notesTitle =
        document.createElement("div");

      const notesText =
        document.createElement("div");

      notesText.className =
        "notes-text";

      notesText.textContent =
        getFieldValue(
          member,
          "additional_notes"
        );


      notes.appendChild(
        notesTitle
      );

      notes.appendChild(
        notesText
      );


      card.appendChild(
        notes
      );

    }


    /* =====================================================
       ACTION SECTION
    ===================================================== */

    const actionSection =
      document.createElement("div");

    actionSection.className =
      "action-section";


    actionSection.appendChild(
      createSectionTitle(
        "Member Actions"
      )
    );


    const buttons =
      document.createElement("div");

    buttons.className =
      "buttons";


    /* =====================================================
       EDIT BUTTON
    ===================================================== */

    if (canEditMember) {

      const editButton =
        document.createElement("button");

      editButton.className =
        "edit-btn";

      editButton.textContent =

      editButton.onclick =
        function() {

          window.location.href =
            "edit-member.html?id=" +
            encodeURIComponent(
              member.id
            );

        };


      buttons.appendChild(
        editButton
      );

    }


    /* =====================================================
       PDF BUTTON
    ===================================================== */

    const pdfButton =
      document.createElement("button");

    pdfButton.className =
      "pdf-btn";

    pdfButton.textContent =
      "📄  Download PDF";


    pdfButton.onclick =
      function() {

        downloadMemberPDF();

      };


    buttons.appendChild(
      pdfButton
    );


    /* =====================================================
       DELETE BUTTON
    ===================================================== */

    if (canDeleteMember) {

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "🗑️  Delete Member";


      deleteButton.onclick =
        function() {

          deleteMember(
            member.id
          );

        };


      buttons.appendChild(
        deleteButton
      );

    }


    /*
      If only PDF is available, make it full width.
    */

    if (
      buttons.children.length === 1
    ) {

      buttons.style.gridTemplateColumns =
        "1fr";

    }


    actionSection.appendChild(
      buttons
    );


    card.appendChild(
      actionSection
    );


    profileArea.appendChild(
      card
    );

  }


  /* =========================================================
     LOAD MEMBER
  ========================================================= */

  async function loadMember() {

    const user =
      await checkUser();


    if (!user) {

      return;

    }


    try {

      await loadUserPermissions(
        user
      );

      await loadAppSettings();

      await loadMemberListFields();


      const params =
        new URLSearchParams(
          window.location.search
        );


      const memberId =
        params.get("id");


      if (!memberId) {

        profileArea.innerHTML =
          '<div class="profile-card">' +
          '<div class="error-card">' +
          '<div class="error">' +
          'Member ID not found.' +
          '</div>' +
          '</div>' +
          '</div>';

        return;

      }


      /*
        IMPORTANT:
        created_by is loaded here so that Staff
        ownership can be checked.
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("members")
          .select(`
            id,
            member_id,
            member_type,
            full_name,
            nic_number,
            date_of_birth,
            gender,
            phone_whatsapp,
            address,
            marital_status,
            date_of_salvation,
            photo_url,
            additional_notes,
            created_by
          `)
          .eq(
            "id",
            memberId
          )
          .single();


      if (error) {

        console.error(
          error
        );


        profileArea.innerHTML =
          '<div class="profile-card">' +
          '<div class="error-card">' +
          '<div class="error">' +
          'Error loading member: ' +
          escapeHtml(
            error.message
          ) +
          '</div>' +
          '</div>' +
          '</div>';

        return;

      }


      if (!data) {

        profileArea.innerHTML =
          '<div class="profile-card">' +
          '<div class="error-card">' +
          '<div class="error">' +
          'Member not found.' +
          '</div>' +
          '</div>' +
          '</div>';

        return;

      }


      displayMember(
        data
      );


    } catch (error) {

      console.error(
        "Initialization error:",
        error
      );


      profileArea.innerHTML =
        '<div class="profile-card">' +
        '<div class="error-card">' +
        '<div class="error">' +
        'Failed to load Member Profile settings: ' +
        escapeHtml(
          error.message
        ) +
        '</div>' +
        '</div>' +
        '</div>';

    }

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(
    value
  ) {

    const div =
      document.createElement("div");

    div.textContent =
      value === undefined ||
      value === null
        ? ""
        : String(value);

    return div.innerHTML;

  }


  /* =========================================================
     IMAGE → DATA URL
  ========================================================= */

  async function imageToDataURL(
    url
  ) {

    try {

      const response =
        await fetch(
          url,
          {
            mode: "cors"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Image loading failed"
        );

      }


      const blob =
        await response.blob();


      return await new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            blob
          );

        }
      );

    } catch (error) {

      console.error(
        "Photo conversion error:",
        error
      );

      return null;

    }

  }


  /* =========================================================
     GET IMAGE FORMAT
  ========================================================= */

  function getImageFormat(
    dataURL
  ) {

    if (!dataURL) {

      return "JPEG";

    }


    if (
      dataURL.startsWith(
        "data:image/png"
      )
    ) {

      return "PNG";

    }


    if (
      dataURL.startsWith(
        "data:image/webp"
      )
    ) {

      return "WEBP";

    }


    if (
      dataURL.startsWith(
        "data:image/gif"
      )
    ) {

      return "GIF";

    }


    return "JPEG";

  }


  /* =========================================================
     PDF FOOTER
  ========================================================= */

  function addPDFFooter(
    pdf
  ) {

    const pageWidth =
      pdf.internal.pageSize.getWidth();

    const pageHeight =
      pdf.internal.pageSize.getHeight();

    const margin = 18;


    pdf.setDrawColor(
      215,
      198,
      155
    );


    pdf.line(
      margin,
      pageHeight - 20,
      pageWidth - margin,
      pageHeight - 20
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.setFontSize(8);

    pdf.setTextColor(
      100,
      100,
      100
    );


    pdf.text(
      (
        appSettings.app_name ||
        "COC Members"
      ) +
      " - " +
      (
        appSettings.church_name ||
        "Church Of Christ Sri Lanka"
      ),
      pageWidth / 2,
      pageHeight - 14,
      {
        align: "center"
      }
    );


    pdf.text(
      "Member Profile",
      pageWidth / 2,
      pageHeight - 9,
      {
        align: "center"
      }
    );

  }


  /* =========================================================
     DOWNLOAD MEMBER PDF
  ========================================================= */

  async function downloadMemberPDF() {

    if (!currentMember) {

      alert(
        "Member information is not loaded yet."
      );

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Creating PDF...' +
      '</div>';


    try {

      const {
        jsPDF
      } =
        window.jspdf;


      if (!jsPDF) {

        throw new Error(
          "PDF library could not be loaded."
        );

      }


      const pdf =
        new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });


      const pageWidth =
        pdf.internal.pageSize.getWidth();

      const pageHeight =
        pdf.internal.pageSize.getHeight();

      const margin = 18;


      pdf.setFillColor(
        176,
        141,
        59
      );


      pdf.rect(
        0,
        0,
        pageWidth,
        35,
        "F"
      );


      pdf.setTextColor(
        255,
        255,
        255
      );


      pdf.setFont(
        "helvetica",
        "bold"
      );

      pdf.setFontSize(20);


      pdf.text(
        String(
          appSettings.app_name ||
          "COC MEMBERS"
        ).toUpperCase(),
        pageWidth / 2,
        14,
        {
          align: "center"
        }
      );


      pdf.setFont(
        "helvetica",
        "normal"
      );

      pdf.setFontSize(10);


      pdf.text(
        appSettings.church_name ||
        "Church Of Christ Sri Lanka",
        pageWidth / 2,
        21,
        {
          align: "center"
        }
      );


      pdf.text(
        appSettings.subtitle ||
        "Members Registration",
        pageWidth / 2,
        27,
        {
          align: "center"
        }
      );


      let currentY = 47;


      const photoField =
        getField(
          "member_photo"
        );


      const showPhotoInPdf =
        photoField
          ? photoField.show_in_pdf === true
          : true;


      if (
        showPhotoInPdf &&
        currentMember.photo_url
      ) {

        const photoData =
          await imageToDataURL(
            currentMember.photo_url
          );


        if (photoData) {

          try {

            pdf.addImage(
              photoData,
              getImageFormat(
                photoData
              ),
              pageWidth / 2 - 25,
              currentY,
              50,
              50
            );


            currentY += 58;

          } catch (photoError) {

            console.error(
              photoError
            );

          }

        }

      }


      const nameField =
        getField(
          "full_name"
        );


      const showNameInPdf =
        nameField
          ? nameField.show_in_pdf === true
          : true;


      if (showNameInPdf) {

        const name =
          getFieldValue(
            currentMember,
            "full_name"
          );


        pdf.setTextColor(
          140,
          111,
          45
        );

        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(18);


        const nameLines =
          pdf.splitTextToSize(
            name,
            pageWidth - margin * 2
          );


        pdf.text(
          nameLines,
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY +=
          nameLines.length * 6 + 2;

      }


      const idField =
        getField(
          "member_id"
        );


      if (
        idField &&
        idField.show_in_pdf === true
      ) {

        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setFontSize(11);

        pdf.setTextColor(
          90,
          90,
          90
        );


        pdf.text(
          getFieldValue(
            currentMember,
            "member_id"
          ),
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY += 6;

      }


      const typeField =
        getField(
          "member_type"
        );


      if (
        typeField &&
        typeField.show_in_pdf === true
      ) {

        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setFontSize(11);


        pdf.text(
          getFieldValue(
            currentMember,
            "member_type"
          ),
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY += 6;

      }


      currentY += 7;


      pdf.setFillColor(
        176,
        141,
        59
      );


      pdf.roundedRect(
        margin,
        currentY,
        pageWidth - margin * 2,
        9,
        2,
        2,
        "F"
      );


      pdf.setTextColor(
        255,
        255,
        255
      );

      pdf.setFont(
        "helvetica",
        "bold"
      );

      pdf.setFontSize(10);


      pdf.text(
        "MEMBER INFORMATION",
        margin + 5,
        currentY + 6
      );


      currentY += 13;


      const pdfFields =
        getPdfFields();


      for (
        const field of pdfFields
      ) {

        if (
          field.field_key === "member_photo" ||
          field.field_key === "full_name" ||
          field.field_key === "member_id" ||
          field.field_key === "member_type" ||
          field.field_key === "additional_notes"
        ) {

          continue;

        }


        const label =
          field.field_label ||
          field.field_key;


        const value =
          getFieldValue(
            currentMember,
            field.field_key
          );


        const valueX =
          margin + 53;


        const maxWidth =
          pageWidth -
          valueX -
          margin -
          5;


        const lines =
          pdf.splitTextToSize(
            value,
            maxWidth
          );


        const rowHeight =
          Math.max(
            11,
            lines.length * 4.8 + 6
          );


        if (
          currentY + rowHeight >
          pageHeight - 30
        ) {

          pdf.addPage();

          currentY = 25;

        }


        pdf.setFillColor(
          249,
          247,
          241
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          rowHeight,
          2,
          2,
          "F"
        );


        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(8.5);

        pdf.setTextColor(
          140,
          111,
          45
        );


        pdf.text(
          label,
          margin + 4,
          currentY + 7
        );


        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setTextColor(
          34,
          34,
          34
        );


        pdf.text(
          lines,
          valueX,
          currentY + 7
        );


        currentY +=
          rowHeight + 3;

      }


      const notesField =
        getField(
          "additional_notes"
        );


      if (
        notesField &&
        notesField.show_in_pdf === true
      ) {

        currentY += 3;


        if (
          currentY >
          pageHeight - 65
        ) {

          pdf.addPage();

          currentY = 25;

        }


        pdf.setFillColor(
          176,
          141,
          59
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          9,
          2,
          2,
          "F"
        );


        pdf.setTextColor(
          255,
          255,
          255
        );


        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(10);


        pdf.text(
          notesField.field_label ||
          "Additional Notes",
          margin + 5,
          currentY + 6
        );


        currentY += 14;


        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setTextColor(
          34,
          34,
          34
        );

        pdf.setFontSize(9);


        const notes =
          getFieldValue(
            currentMember,
            "additional_notes"
          );


        const noteLines =
          pdf.splitTextToSize(
            notes,
            pageWidth -
            margin * 2 -
            10
          );


        const noteHeight =
          Math.max(
            18,
            noteLines.length * 4.8 + 10
          );


        if (
          currentY + noteHeight >
          pageHeight - 30
        ) {

          pdf.addPage();

          currentY = 25;

        }


        pdf.setFillColor(
          250,
          249,
          246
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          noteHeight,
          2,
          2,
          "F"
        );


        pdf.text(
          noteLines,
          margin + 5,
          currentY + 7
        );

      }


      const totalPages =
        pdf.getNumberOfPages();


      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        pdf.setPage(i);

        addPDFFooter(
          pdf
        );

      }


      const safeName =
        (
          currentMember.member_id ||
          "member"
        )
        .replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        );


      pdf.save(
        safeName +
        "_Member_Profile.pdf"
      );


      messageBox.innerHTML =
        '<div class="success">' +
        'PDF downloaded successfully.' +
        '</div>';


      setTimeout(
        function() {

          messageBox.innerHTML =
            "";

        },
        2500
      );


    } catch (error) {

      console.error(
        "PDF error:",
        error
      );


      messageBox.innerHTML =
        '<div class="error">' +
        'PDF creation failed: ' +
        escapeHtml(
          error.message
        ) +
        '</div>';

    }

  }


  /* =========================================================
     DELETE MEMBER
  ========================================================= */

  async function deleteMember(
    id
  ) {

    /*
      Extra client-side safety check.
    */

    if (
      currentUserRole !==
      "main_admin"
    ) {

      messageBox.innerHTML =
        '<div class="error">' +
        'You do not have permission to delete members.' +
        '</div>';

      return;

    }


    const confirmed =
      confirm(
        "Are you sure you want to delete this member?\n\n" +
        "This action cannot be undone."
      );


    if (!confirmed) {

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Deleting member...' +
      '</div>';


    const {
      error
    } =
      await supabaseClient
        .from("members")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      console.error(
        error
      );


      messageBox.innerHTML =
        '<div class="error">' +
        'Delete failed: ' +
        escapeHtml(
          error.message
        ) +
        '</div>';

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Member deleted successfully.' +
      '</div>';


    setTimeout(
      function() {

        window.location.href =
          "members.html";

      },
      1200
    );

  }


  /* =========================================================

  ========================================================= */

  loadMember();
