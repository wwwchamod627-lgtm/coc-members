<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Profile - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .back-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .profile-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .profile-header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #174d3c;
      margin-bottom: 12px;
    }

    .member-id {
      color: #174d3c;
      font-size: 16px;
      font-weight: bold;
    }

    .member-name {
      font-size: 25px;
      font-weight: bold;
      margin: 7px 0;
    }

    .member-type {
      display: inline-block;
      background: #e7f0eb;
      color: #174d3c;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .details {
      display: grid;
      gap: 12px;
    }

    .detail-row {
      display: flex;
      padding: 13px;
      border-radius: 9px;
      background: #f8f7f3;
      border: 1px solid #eee;
    }

    .detail-label {
      width: 42%;
      font-weight: bold;
      color: #174d3c;
    }

    .detail-value {
      width: 58%;
      word-break: break-word;
    }

    .notes {
      margin-top: 15px;
      padding: 15px;
      background: #f8f7f3;
      border: 1px solid #eee;
      border-radius: 9px;
    }

    .notes-title {
      font-weight: bold;
      color: #174d3c;
      margin-bottom: 8px;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .edit-btn,
    .pdf-btn,
    .delete-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-btn {
      background: #174d3c;
    }

    .pdf-btn {
      background: #8b6b2e;
    }

    .delete-btn {
      background: #b3261e;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #555;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
    }

    .success {
      background: #dff2e5;
      color: #176b36;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .profile-card {
        padding: 18px;
      }

      .profile-photo {
        width: 120px;
        height: 120px;
      }

      .member-name {
        font-size: 21px;
      }

      .detail-row {
        display: block;
      }

      .detail-label,
      .detail-value {
        width: 100%;
      }

      .detail-label {
        margin-bottom: 5px;
      }

    }
  </style>
</head>

<body>

  <div class="header">

    <h1 id="appName">
      COC Members
    </h1>

    <p id="churchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="subtitle">
      Members Registration
    </p>

  </div>


  <div class="container">

    <button
      class="back-btn"
      onclick="window.location.href='members.html'"
    >
      ← Back to Members
    </button>


    <div id="messageBox"></div>


    <div id="profileArea">

      <div class="profile-card">

        <div class="loading">
          Loading member profile...
        </div>

      </div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     GLOBAL DATA
  ========================================================= */

  let currentMember = null;

  let memberListFields = [];

  let appSettings = {};


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const profileArea =
    document.getElementById("profileArea");

  const messageBox =
    document.getElementById("messageBox");


  /* =========================================================
     FIELD → DATABASE COLUMN
  ========================================================= */

  const fieldDatabaseMap = {

    member_id: "member_id",

    member_type: "member_type",

    full_name: "full_name",

    nic_number: "nic_number",

    date_of_birth: "date_of_birth",

    gender: "gender",

    phone_whatsapp: "phone_whatsapp",

    address: "address",

    marital_status: "marital_status",

    date_of_salvation: "date_of_salvation",

    member_photo: "photo_url",

    additional_notes: "additional_notes"

  };


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    return data.user;

  }


  /* =========================================================
     LOAD APP SETTINGS
  ========================================================= */

  async function loadAppSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_settings")
        .select(`
          app_name,
          church_name,
          subtitle
        `)
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(
        "App settings error:",
        error
      );

      return;

    }


    appSettings =
      data || {};


    document.getElementById(
      "appName"
    ).textContent =
      appSettings.app_name ||
      "COC Members";


    document.getElementById(
      "churchName"
    ).textContent =
      appSettings.church_name ||
      "Church Of Christ Sri Lanka";


    document.getElementById(
      "subtitle"
    ).textContent =
      appSettings.subtitle ||
      "Members Registration";

  }


  /* =========================================================
     LOAD MEMBER LIST SETTINGS
  ========================================================= */

  async function loadMemberListFields() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("member_list_fields")
        .select(`
          id,
          field_key,
          field_label,
          is_visible,
          is_searchable,
          display_order,
          show_in_pdf
        `)
        .order(
          "display_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Member list fields error:",
        error
      );

      throw error;

    }


    memberListFields =
      data || [];

  }


  /* =========================================================
     GET VISIBLE FIELDS
  ========================================================= */

  function getVisibleFields() {

    return memberListFields
      .filter(
        function(field) {

          return field.is_visible === true;

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(a.display_order || 0) -
            Number(b.display_order || 0)
          );

        }
      );

  }


  /* =========================================================
     GET PDF FIELDS
  ========================================================= */

  function getPdfFields() {

    return memberListFields
      .filter(
        function(field) {

          return field.show_in_pdf === true;

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(a.display_order || 0) -
            Number(b.display_order || 0)
          );

        }
      );

  }


  /* =========================================================
     SHOW VALUE
  ========================================================= */

  function showValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "Not provided";

    }


    return String(value);

  }


  /* =========================================================
     FORMAT DATE
  ========================================================= */

  function formatDate(date) {

    if (!date) {

      return "Not provided";

    }


    const parts =
      String(date).split("-");


    if (
      parts.length !== 3
    ) {

      return String(date);

    }


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  /* =========================================================
     GET FIELD VALUE
  ========================================================= */

  function getFieldValue(
    member,
    fieldKey
  ) {

    const column =
      fieldDatabaseMap[fieldKey];


    if (!column) {

      return "";

    }


    const value =
      member[column];


    if (
      fieldKey === "date_of_birth" ||
      fieldKey === "date_of_salvation"
    ) {

      return formatDate(value);

    }


    return showValue(value);

  }


  /* =========================================================
     GET FIELD
  ========================================================= */

  function getField(fieldKey) {

    return memberListFields.find(
      function(field) {

        return (
          field.field_key ===
          fieldKey
        );

      }
    );

  }


  /* =========================================================
     CREATE DETAIL
  ========================================================= */

  function createDetail(
    label,
    value
  ) {

    const row =
      document.createElement("div");

    row.className =
      "detail-row";


    const labelDiv =
      document.createElement("div");

    labelDiv.className =
      "detail-label";

    labelDiv.textContent =
      label;


    const valueDiv =
      document.createElement("div");

    valueDiv.className =
      "detail-value";

    valueDiv.textContent =
      value;


    row.appendChild(
      labelDiv
    );

    row.appendChild(
      valueDiv
    );


    return row;

  }


  /* =========================================================
     DISPLAY MEMBER
  ========================================================= */

  function displayMember(member) {

    currentMember =
      member;


    profileArea.innerHTML =
      "";


    const card =
      document.createElement("div");

    card.className =
      "profile-card";


    /* =====================================================
       PROFILE HEADER
    ===================================================== */

    const header =
      document.createElement("div");

    header.className =
      "profile-header";


    /* PHOTO */

    const photoField =
      getField("member_photo");


    const showPhoto =
      photoField
        ? photoField.is_visible === true
        : true;


    if (showPhoto) {

      const photo =
        document.createElement("img");

      photo.className =
        "profile-photo";

      photo.alt =
        "Member Photo";


      if (member.photo_url) {

        photo.src =
          member.photo_url;

      } else {

        photo.src =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="200"
                 height="200">
              <rect width="100%"
                    height="100%"
                    fill="#eeeeee"/>
              <text x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-size="18"
                    fill="#777">
                No Photo
              </text>
            </svg>
          `);

      }


      header.appendChild(
        photo
      );

    }


    /* MEMBER ID */

    const idField =
      getField("member_id");


    if (
      idField &&
      idField.is_visible === true
    ) {

      const id =
        document.createElement("div");

      id.className =
        "member-id";

      id.textContent =
        getFieldValue(
          member,
          "member_id"
        );

      header.appendChild(id);

    }


    /* FULL NAME */

    const nameField =
      getField("full_name");


    if (
      nameField &&
      nameField.is_visible === true
    ) {

      const name =
        document.createElement("div");

      name.className =
        "member-name";

      name.textContent =
        getFieldValue(
          member,
          "full_name"
        );

      header.appendChild(name);

    }


    /* MEMBER TYPE */

    const typeField =
      getField("member_type");


    if (
      typeField &&
      typeField.is_visible === true
    ) {

      const type =
        document.createElement("div");

      type.className =
        "member-type";

      type.textContent =
        getFieldValue(
          member,
          "member_type"
        );

      header.appendChild(type);

    }


    card.appendChild(
      header
    );


    /* =====================================================
       DETAILS
    ===================================================== */

    const details =
      document.createElement("div");

    details.className =
      "details";


    const visibleFields =
      getVisibleFields();


    visibleFields.forEach(
      function(field) {

        /*
         * These are already shown
         * in the profile header.
         */

        if (
          field.field_key ===
          "member_photo"
        ) {

          return;

        }


        if (
          field.field_key ===
          "member_id"
        ) {

          return;

        }


        if (
          field.field_key ===
          "full_name"
        ) {

          return;

        }


        if (
          field.field_key ===
          "member_type"
        ) {

          return;

        }


        const value =
          getFieldValue(
            member,
            field.field_key
          );


        details.appendChild(
          createDetail(
            field.field_label ||
            field.field_key,
            value
          )
        );

      }
    );


    if (
      details.children.length > 0
    ) {

      card.appendChild(
        details
      );

    }


    /* =====================================================
       ADDITIONAL NOTES
    ===================================================== */

    const notesField =
      getField(
        "additional_notes"
      );


    if (
      notesField &&
      notesField.is_visible === true
    ) {

      const notes =
        document.createElement("div");

      notes.className =
        "notes";


      const notesTitle =
        document.createElement("div");

      notesTitle.className =
        "notes-title";

      notesTitle.textContent =
        notesField.field_label ||
        "Additional Notes";


      const notesText =
        document.createElement("div");

      notesText.textContent =
        getFieldValue(
          member,
          "additional_notes"
        );


      notes.appendChild(
        notesTitle
      );

      notes.appendChild(
        notesText
      );


      card.appendChild(
        notes
      );

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    const buttons =
      document.createElement("div");

    buttons.className =
      "buttons";


    /* EDIT */

    const editButton =
      document.createElement("button");

    editButton.className =
      "edit-btn";

    editButton.textContent =
      "✏️ Edit Member";


    editButton.onclick =
      function() {

        window.location.href =
          "edit-member.html?id=" +
          member.id;

      };


    /* PDF */

    const pdfButton =
      document.createElement("button");

    pdfButton.className =
      "pdf-btn";

    pdfButton.textContent =
      "📄 Download PDF";


    pdfButton.onclick =
      function() {

        downloadMemberPDF();

      };


    /* DELETE */

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.textContent =
      "🗑️ Delete Member";


    deleteButton.onclick =
      function() {

        deleteMember(
          member.id
        );

      };


    buttons.appendChild(
      editButton
    );

    buttons.appendChild(
      pdfButton
    );

    buttons.appendChild(
      deleteButton
    );


    card.appendChild(
      buttons
    );


    profileArea.appendChild(
      card
    );

  }


  /* =========================================================
     LOAD MEMBER
  ========================================================= */

  async function loadMember() {

    const user =
      await checkUser();


    if (!user) {

      return;

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const memberId =
      params.get("id");


    if (!memberId) {

      profileArea.innerHTML =
        '<div class="profile-card">' +
        '<div class="error">' +
        'Member ID not found.' +
        '</div>' +
        '</div>';

      return;

    }


    try {

      await loadAppSettings();

      await loadMemberListFields();


      const {
        data,
        error
      } =
      await supabaseClient
        .from("members")
        .select(`
          id,
          member_id,
          member_type,
          full_name,
          nic_number,
          date_of_birth,
          gender,
          phone_whatsapp,
          address,
          marital_status,
          date_of_salvation,
          photo_url,
          additional_notes
        `)
        .eq(
          "id",
          memberId
        )
        .single();


      if (error) {

        console.error(
          error
        );


        profileArea.innerHTML =
          '<div class="profile-card">' +
          '<div class="error">' +
          'Error loading member: ' +
          error.message +
          '</div>' +
          '</div>';

        return;

      }


      displayMember(
        data
      );


    } catch (error) {

      console.error(
        "Initialization error:",
        error
      );


      profileArea.innerHTML =
        '<div class="profile-card">' +
        '<div class="error">' +
        'Failed to load Member Profile settings: ' +
        error.message +
        '</div>' +
        '</div>';

    }

  }


  /* =========================================================
     IMAGE → DATA URL
  ========================================================= */

  async function imageToDataURL(url) {

    try {

      const response =
        await fetch(
          url,
          {
            mode: "cors"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Image loading failed"
        );

      }


      const blob =
        await response.blob();


      return await new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            blob
          );

        }
      );

    } catch (error) {

      console.error(
        "Photo conversion error:",
        error
      );

      return null;

    }

  }


  /* =========================================================
     GET IMAGE FORMAT
  ========================================================= */

  function getImageFormat(dataURL) {

    if (!dataURL) {

      return "JPEG";

    }


    if (
      dataURL.startsWith(
        "data:image/png"
      )
    ) {

      return "PNG";

    }


    if (
      dataURL.startsWith(
        "data:image/webp"
      )
    ) {

      return "WEBP";

    }


    if (
      dataURL.startsWith(
        "data:image/gif"
      )
    ) {

      return "GIF";

    }


    return "JPEG";

  }


  /* =========================================================
     PDF FOOTER
  ========================================================= */

  function addPDFFooter(
    pdf
  ) {

    const pageWidth =
      pdf.internal.pageSize.getWidth();

    const pageHeight =
      pdf.internal.pageSize.getHeight();

    const margin = 18;


    pdf.setDrawColor(
      210,
      210,
      210
    );


    pdf.line(
      margin,
      pageHeight - 20,
      pageWidth - margin,
      pageHeight - 20
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.setFontSize(8);

    pdf.setTextColor(
      100,
      100,
      100
    );


    pdf.text(
      (
        appSettings.app_name ||
        "COC Members"
      ) +
      " - " +
      (
        appSettings.church_name ||
        "Church Of Christ Sri Lanka"
      ),
      pageWidth / 2,
      pageHeight - 14,
      {
        align: "center"
      }
    );


    pdf.text(
      "Member Profile",
      pageWidth / 2,
      pageHeight - 9,
      {
        align: "center"
      }
    );

  }


  /* =========================================================
     DOWNLOAD MEMBER PDF
  ========================================================= */

  async function downloadMemberPDF() {

    if (!currentMember) {

      alert(
        "Member information is not loaded yet."
      );

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Creating PDF...' +
      '</div>';


    try {

      const {
        jsPDF
      } =
      window.jspdf;


      if (!jsPDF) {

        throw new Error(
          "PDF library could not be loaded."
        );

      }


      const pdf =
        new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });


      const pageWidth =
        pdf.internal.pageSize.getWidth();

      const pageHeight =
        pdf.internal.pageSize.getHeight();

      const margin = 18;


      /* =====================================================
         HEADER
      ===================================================== */

      pdf.setFillColor(
        23,
        77,
        60
      );


      pdf.rect(
        0,
        0,
        pageWidth,
        35,
        "F"
      );


      pdf.setTextColor(
        255,
        255,
        255
      );


      pdf.setFont(
        "helvetica",
        "bold"
      );

      pdf.setFontSize(20);


      pdf.text(
        String(
          appSettings.app_name ||
          "COC MEMBERS"
        ).toUpperCase(),
        pageWidth / 2,
        14,
        {
          align: "center"
        }
      );


      pdf.setFont(
        "helvetica",
        "normal"
      );

      pdf.setFontSize(10);


      pdf.text(
        appSettings.church_name ||
        "Church Of Christ Sri Lanka",
        pageWidth / 2,
        21,
        {
          align: "center"
        }
      );


      pdf.text(
        appSettings.subtitle ||
        "Members Registration",
        pageWidth / 2,
        27,
        {
          align: "center"
        }
      );


      /* =====================================================
         PHOTO
      ===================================================== */

      let currentY = 47;


      const photoField =
        getField(
          "member_photo"
        );


      const showPhotoInPdf =
        photoField
          ? photoField.show_in_pdf === true
          : true;


      if (
        showPhotoInPdf &&
        currentMember.photo_url
      ) {

        const photoData =
          await imageToDataURL(
            currentMember.photo_url
          );


        if (photoData) {

          try {

            pdf.addImage(
              photoData,
              getImageFormat(
                photoData
              ),
              pageWidth / 2 - 25,
              currentY,
              50,
              50
            );


            currentY += 58;

          } catch (photoError) {

            console.error(
              photoError
            );

          }

        }

      }


      /* =====================================================
         NAME
      ===================================================== */

      const nameField =
        getField(
          "full_name"
        );


      const showNameInPdf =
        nameField
          ? nameField.show_in_pdf === true
          : true;


      if (showNameInPdf) {

        const name =
          getFieldValue(
            currentMember,
            "full_name"
          );


        pdf.setTextColor(
          23,
          77,
          60
        );

        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(18);


        const nameLines =
          pdf.splitTextToSize(
            name,
            pageWidth - margin * 2
          );


        pdf.text(
          nameLines,
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY +=
          nameLines.length * 6 + 2;

      }


      /* =====================================================
         MEMBER ID
      ===================================================== */

      const idField =
        getField(
          "member_id"
        );


      if (
        idField &&
        idField.show_in_pdf === true
      ) {

        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setFontSize(11);


        pdf.text(
          getFieldValue(
            currentMember,
            "member_id"
          ),
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY += 6;

      }


      /* =====================================================
         MEMBER TYPE
      ===================================================== */

      const typeField =
        getField(
          "member_type"
        );


      if (
        typeField &&
        typeField.show_in_pdf === true
      ) {

        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setFontSize(11);


        pdf.text(
          getFieldValue(
            currentMember,
            "member_type"
          ),
          pageWidth / 2,
          currentY,
          {
            align: "center"
          }
        );


        currentY += 6;

      }


      currentY += 7;


      /* =====================================================
         MEMBER INFORMATION TITLE
      ===================================================== */

      pdf.setFillColor(
        23,
        77,
        60
      );


      pdf.roundedRect(
        margin,
        currentY,
        pageWidth - margin * 2,
        9,
        2,
        2,
        "F"
      );


      pdf.setTextColor(
        255,
        255,
        255
      );

      pdf.setFont(
        "helvetica",
        "bold"
      );

      pdf.setFontSize(10);


      pdf.text(
        "MEMBER INFORMATION",
        margin + 5,
        currentY + 6
      );


      currentY += 13;


      /* =====================================================
         PDF FIELDS
      ===================================================== */

      const pdfFields =
        getPdfFields();


      for (
        const field of pdfFields
      ) {

        /*
         * Already shown above
         */

        if (
          field.field_key ===
          "member_photo"
        ) {

          continue;

        }


        if (
          field.field_key ===
          "full_name"
        ) {

          continue;

        }


        if (
          field.field_key ===
          "member_id"
        ) {

          continue;

        }


        if (
          field.field_key ===
          "member_type"
        ) {

          continue;

        }


        if (
          field.field_key ===
          "additional_notes"
        ) {

          continue;

        }


        const label =
          field.field_label ||
          field.field_key;


        const value =
          getFieldValue(
            currentMember,
            field.field_key
          );


        const valueX =
          margin + 53;


        const maxWidth =
          pageWidth -
          valueX -
          margin -
          5;


        const lines =
          pdf.splitTextToSize(
            value,
            maxWidth
          );


        const rowHeight =
          Math.max(
            11,
            lines.length * 4.8 + 6
          );


        /* Row background */

        pdf.setFillColor(
          248,
          247,
          243
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          rowHeight,
          2,
          2,
          "F"
        );


        /* Label */

        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(8.5);

        pdf.setTextColor(
          23,
          77,
          60
        );


        pdf.text(
          label,
          margin + 4,
          currentY + 7
        );


        /* Value */

        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setTextColor(
          34,
          34,
          34
        );


        pdf.text(
          lines,
          valueX,
          currentY + 7
        );


        currentY +=
          rowHeight + 3;


        /*
         * Prevent content from going
         * underneath footer.
         */

        if (
          currentY >
          pageHeight - 35
        ) {

          pdf.addPage();

          currentY = 25;

        }

      }


      /* =====================================================
         ADDITIONAL NOTES
      ===================================================== */

      const notesField =
        getField(
          "additional_notes"
        );


      if (
        notesField &&
        notesField.show_in_pdf === true
      ) {

        currentY += 3;


        if (
          currentY >
          pageHeight - 65
        ) {

          pdf.addPage();

          currentY = 25;

        }


        pdf.setFillColor(
          23,
          77,
          60
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          9,
          2,
          2,
          "F"
        );


        pdf.setTextColor(
          255,
          255,
          255
        );


        pdf.setFont(
          "helvetica",
          "bold"
        );

        pdf.setFontSize(10);


        pdf.text(
          notesField.field_label ||
          "Additional Notes",
          margin + 5,
          currentY + 6
        );


        currentY += 14;


        pdf.setFont(
          "helvetica",
          "normal"
        );

        pdf.setTextColor(
          34,
          34,
          34
        );

        pdf.setFontSize(9);


        const notes =
          getFieldValue(
            currentMember,
            "additional_notes"
          );


        const noteLines =
          pdf.splitTextToSize(
            notes,
            pageWidth -
            margin * 2 -
            10
          );


        const noteHeight =
          Math.max(
            18,
            noteLines.length * 4.8 + 10
          );


        pdf.setFillColor(
          250,
          249,
          246
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          noteHeight,
          2,
          2,
          "F"
        );


        pdf.text(
          noteLines,
          margin + 5,
          currentY + 7
        );

      }


      /* =====================================================
         FOOTER
      ===================================================== */

      const totalPages =
        pdf.getNumberOfPages();


      for (
        let i = 1;
        i <= totalPages;
        i++
      ) {

        pdf.setPage(i);

        addPDFFooter(
          pdf
        );

      }


      /* =====================================================
         DOWNLOAD
      ===================================================== */

      const safeName =
        (
          currentMember.member_id ||
          "member"
        )
        .replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        );


      pdf.save(
        safeName +
        "_Member_Profile.pdf"
      );


      messageBox.innerHTML =
        '<div class="success">' +
        'PDF downloaded successfully.' +
        '</div>';


      setTimeout(
        function() {

          messageBox.innerHTML =
            "";

        },
        2500
      );


    } catch (error) {

      console.error(
        "PDF error:",
        error
      );


      messageBox.innerHTML =
        '<div class="error">' +
        'PDF creation failed: ' +
        error.message +
        '</div>';

    }

  }


  /* =========================================================
     DELETE MEMBER
  ========================================================= */

  async function deleteMember(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this member?\n\n" +
        "This action cannot be undone."
      );


    if (!confirmed) {

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Deleting member...' +
      '</div>';


    const {
      error
    } =
      await supabaseClient
        .from("members")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      console.error(
        error
      );


      messageBox.innerHTML =
        '<div class="error">' +
        'Delete failed: ' +
        error.message +
        '</div>';

      return;

    }


    messageBox.innerHTML =
      '<div class="success">' +
      'Member deleted successfully.' +
      '</div>';


    setTimeout(
      function() {

        window.location.href =
          "members.html";

      },
      1200
    );

  }


  /* =========================================================
     START
  ========================================================= */

  loadMember();

</script>

</body>
</html>
