<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .back-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      background: #fff;
    }

    .member-card:hover {
      background: #f8f8f8;
    }

    .member-photo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #174d3c;
      flex-shrink: 0;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .member-id {
      font-size: 14px;
      color: #174d3c;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .member-type {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .member-phone {
      font-size: 14px;
      color: #555;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .member-card {
        gap: 12px;
      }

      .member-photo {
        width: 65px;
        height: 65px;
      }

      .member-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">

    <button
      class="back-btn"
      onclick="window.location.href='home.html'"
    >
      ← Back to Dashboard
    </button>

    <div class="card">

      <h2>Members</h2>

      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search by Name or Member ID"
      >

      <div id="errorBox"></div>

      <div id="membersList">
        <div class="loading">
          Loading members...
        </div>
      </div>

    </div>

  </div>

<script>

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const membersList =
    document.getElementById("membersList");

  const searchInput =
    document.getElementById("searchInput");

  const errorBox =
    document.getElementById("errorBox");


  let allMembers = [];


  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {

      window.location.href =
        "index.html";

      return null;

    }

    return data.user;

  }


  function displayMembers(members) {

    membersList.innerHTML = "";

    if (!members || members.length === 0) {

      membersList.innerHTML =
        '<div class="empty">No members found.</div>';

      return;

    }


    members.forEach(function(member) {

      const card =
        document.createElement("div");

      card.className =
        "member-card";


      card.onclick = function() {

        window.location.href =
          "member.html?id=" + member.id;

      };


      const photo =
        document.createElement("img");

      photo.className =
        "member-photo";

      photo.alt =
        "Member Photo";


      if (member.photo_url) {

        photo.src =
          member.photo_url;

      } else {

        photo.src =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="100"
                 height="100">
              <rect width="100%" height="100%"
                    fill="#eeeeee"/>
              <text x="50%" y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-size="12"
                    fill="#777">
                No Photo
              </text>
            </svg>
          `);

      }


      const info =
        document.createElement("div");

      info.className =
        "member-info";


      const id =
        document.createElement("div");

      id.className =
        "member-id";

      id.textContent =
        member.member_id || "";


      const name =
        document.createElement("div");

      name.className =
        "member-name";

      name.textContent =
        member.full_name || "";


      const type =
        document.createElement("div");

      type.className =
        "member-type";

      type.textContent =
        member.member_type || "";


      const phone =
        document.createElement("div");

      phone.className =
        "member-phone";

      phone.textContent =
        member.phone_whatsapp || "";


      info.appendChild(id);
      info.appendChild(name);
      info.appendChild(type);
      info.appendChild(phone);


      card.appendChild(photo);
      card.appendChild(info);


      membersList.appendChild(card);

    });

  }


  function filterMembers() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!search) {

      displayMembers(allMembers);

      return;

    }


    const filtered =
      allMembers.filter(function(member) {

        const name =
          (member.full_name || "")
            .toLowerCase();

        const memberId =
          (member.member_id || "")
            .toLowerCase();

        return (
          name.includes(search) ||
          memberId.includes(search)
        );

      });


    displayMembers(filtered);

  }


  async function loadMembers() {

    const user =
      await checkUser();

    if (!user) return;


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("members")
          .select(`
            id,
            member_id,
            member_type,
            full_name,
            phone_whatsapp,
            photo_url
          `)
          .order(
            "created_at",
            { ascending: false }
          );


      if (error) {

        console.error(error);

        errorBox.innerHTML =
          '<div class="error">Error: ' +
          error.message +
          '</div>';

        membersList.innerHTML = "";

        return;

      }


      allMembers =
        data || [];

      displayMembers(
        allMembers
      );


    } catch (error) {

      console.error(error);

      errorBox.innerHTML =
        '<div class="error">Error loading members.</div>';

    }

  }


  searchInput.addEventListener(
    "input",
    filterMembers
  );


  loadMembers();

</script>

</body>
</html>
