<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }

    .back-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .pdf-all-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #8b6b2e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .pdf-all-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      background: #fff;
    }

    .member-card:hover {
      background: #f8f8f8;
    }

    .member-photo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #174d3c;
      flex-shrink: 0;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .member-id {
      font-size: 14px;
      color: #174d3c;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .member-type {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .member-phone {
      font-size: 14px;
      color: #555;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      margin-bottom: 15px;
    }

    .success {
      background: #dff2e5;
      color: #176b36;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .member-card {
        gap: 12px;
      }

      .member-photo {
        width: 65px;
        height: 65px;
      }

      .member-name {
        font-size: 16px;
      }

    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">

    <button
      class="back-btn"
      onclick="window.location.href='home.html'"
    >
      ← Back to Dashboard
    </button>

    <div class="card">

      <h2>Members</h2>

      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search by Name or Member ID"
      >

      <button
        id="pdfAllButton"
        class="pdf-all-btn"
      >
        📚 Download All Members PDF
      </button>

      <div id="errorBox"></div>

      <div id="membersList">

        <div class="loading">
          Loading members...
        </div>

      </div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE CONFIGURATION
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     PAGE ELEMENTS
  ========================================================= */

  const membersList =
    document.getElementById(
      "membersList"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  const pdfAllButton =
    document.getElementById(
      "pdfAllButton"
    );


  let allMembers = [];


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    return data.user;

  }


  /* =========================================================
     SHOW VALUE
  ========================================================= */

  function showValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "Not provided";

    }


    return String(value);

  }


  /* =========================================================
     FORMAT DATE
  ========================================================= */

  function formatDate(date) {

    if (!date) {

      return "Not provided";

    }


    const parts =
      date.split("-");


    if (
      parts.length !== 3
    ) {

      return date;

    }


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  /* =========================================================
     DISPLAY MEMBERS
  ========================================================= */

  function displayMembers(members) {

    membersList.innerHTML = "";


    if (
      !members ||
      members.length === 0
    ) {

      membersList.innerHTML =
        '<div class="empty">' +
        'No members found.' +
        '</div>';

      return;

    }


    members.forEach(
      function(member) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "member-card";


        card.onclick =
          function() {

            window.location.href =
              "member.html?id=" +
              member.id;

          };


        const photo =
          document.createElement(
            "img"
          );


        photo.className =
          "member-photo";


        photo.alt =
          "Member Photo";


        if (
          member.photo_url
        ) {

          photo.src =
            member.photo_url;

        } else {

          photo.src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="100"
                   height="100">
                <rect width="100%"
                      height="100%"
                      fill="#eeeeee"/>
                <text x="50%"
                      y="50%"
                      dominant-baseline="middle"
                      text-anchor="middle"
                      font-size="12"
                      fill="#777">
                  No Photo
                </text>
              </svg>
            `);

        }


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "member-info";


        const id =
          document.createElement(
            "div"
          );


        id.className =
          "member-id";


        id.textContent =
          member.member_id || "";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "member-name";


        name.textContent =
          member.full_name || "";


        const type =
          document.createElement(
            "div"
          );


        type.className =
          "member-type";


        type.textContent =
          member.member_type || "";


        const phone =
          document.createElement(
            "div"
          );


        phone.className =
          "member-phone";


        phone.textContent =
          member.phone_whatsapp || "";


        info.appendChild(id);
        info.appendChild(name);
        info.appendChild(type);
        info.appendChild(phone);


        card.appendChild(photo);
        card.appendChild(info);


        membersList.appendChild(card);

      }
    );

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  function filterMembers() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!search) {

      displayMembers(
        allMembers
      );

      return;

    }


    const filtered =
      allMembers.filter(
        function(member) {

          const name =
            (
              member.full_name ||
              ""
            )
            .toLowerCase();


          const memberId =
            (
              member.member_id ||
              ""
            )
            .toLowerCase();


          return (
            name.includes(search) ||
            memberId.includes(search)
          );

        }
      );


    displayMembers(
      filtered
    );

  }


  /* =========================================================
     LOAD MEMBERS
  ========================================================= */

  async function loadMembers() {

    const user =
      await checkUser();


    if (!user) return;


    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("members")
        .select(`
          id,
          member_id,
          member_type,
          full_name,
          nic_number,
          date_of_birth,
          gender,
          phone_whatsapp,
          address,
          marital_status,
          date_of_salvation,
          photo_url,
          additional_notes
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(error);


        errorBox.innerHTML =
          '<div class="error">' +
          'Error: ' +
          error.message +
          '</div>';


        membersList.innerHTML =
          "";


        return;

      }


      allMembers =
        data || [];


      displayMembers(
        allMembers
      );


    } catch (error) {

      console.error(error);


      errorBox.innerHTML =
        '<div class="error">' +
        'Error loading members.' +
        '</div>';

    }

  }


  /* =========================================================
     IMAGE → DATA URL
  ========================================================= */

  async function imageToDataURL(
    url
  ) {

    try {

      const response =
        await fetch(
          url,
          {
            mode: "cors"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Image loading failed"
        );

      }


      const blob =
        await response.blob();


      return await new Promise(
        function(resolve, reject) {

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            blob
          );

        }
      );


    } catch (error) {

      console.error(
        "Image error:",
        error
      );


      return null;

    }

  }


  /* =========================================================
     GET IMAGE FORMAT
  ========================================================= */

  function getImageFormat(
    dataURL
  ) {

    if (!dataURL) {

      return "JPEG";

    }


    if (
      dataURL.startsWith(
        "data:image/png"
      )
    ) {

      return "PNG";

    }


    if (
      dataURL.startsWith(
        "data:image/webp"
      )
    ) {

      return "WEBP";

    }


    if (
      dataURL.startsWith(
        "data:image/gif"
      )
    ) {

      return "GIF";

    }


    return "JPEG";

  }


  /* =========================================================
     ADD PAGE FOOTER
  ========================================================= */

  function addFooter(
    pdf,
    pageNumber,
    totalPages
  ) {

    const pageWidth =
      pdf.internal.pageSize.getWidth();

    const pageHeight =
      pdf.internal.pageSize.getHeight();

    const margin = 18;


    pdf.setDrawColor(
      210,
      210,
      210
    );


    pdf.line(
      margin,
      pageHeight - 19,
      pageWidth - margin,
      pageHeight - 19
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(7.5);


    pdf.setTextColor(
      100,
      100,
      100
    );


    pdf.text(
      "COC Members - Church Of Christ Sri Lanka",
      margin,
      pageHeight - 12
    );


    pdf.text(
      "Page " +
      pageNumber +
      " of " +
      totalPages,
      pageWidth - margin,
      pageHeight - 12,
      {
        align: "right"
      }
    );


    const today =
      new Date();


    const generatedDate =
      String(
        today.getDate()
      )
      .padStart(2, "0") +
      "/" +
      String(
        today.getMonth() + 1
      )
      .padStart(2, "0") +
      "/" +
      today.getFullYear();


    pdf.text(
      "Generated: " +
      generatedDate,
      pageWidth / 2,
      pageHeight - 12,
      {
        align: "center"
      }
    );

  }


  /* =========================================================
     ADD ONE MEMBER TO PDF
  ========================================================= */

  async function addMemberToPDF(
    pdf,
    member,
    profileNumber,
    totalProfiles
  ) {

    const pageWidth =
      pdf.internal.pageSize.getWidth();


    const pageHeight =
      pdf.internal.pageSize.getHeight();


    const margin = 18;


    /* -------------------------------------------------------
       HEADER
    ------------------------------------------------------- */

    pdf.setFillColor(
      23,
      77,
      60
    );


    pdf.rect(
      0,
      0,
      pageWidth,
      37,
      "F"
    );


    pdf.setTextColor(
      255,
      255,
      255
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(20);


    pdf.text(
      "COC MEMBERS",
      pageWidth / 2,
      14,
      {
        align: "center"
      }
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(9.5);


    pdf.text(
      "Church Of Christ Sri Lanka",
      pageWidth / 2,
      21,
      {
        align: "center"
      }
    );


    pdf.text(
      "Members Registration",
      pageWidth / 2,
      27,
      {
        align: "center"
      }
    );


    /* -------------------------------------------------------
       PROFILE NUMBER
    ------------------------------------------------------- */

    let currentY = 45;


    pdf.setTextColor(
      100,
      100,
      100
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(8);


    pdf.text(
      "Member Profile " +
      profileNumber,
      pageWidth - margin,
      currentY,
      {
        align: "right"
      }
    );


    currentY += 7;


    /* -------------------------------------------------------
       PHOTO
    ------------------------------------------------------- */

    if (
      member.photo_url
    ) {

      const photoData =
        await imageToDataURL(
          member.photo_url
        );


      if (photoData) {

        try {

          const imageFormat =
            getImageFormat(
              photoData
            );


          pdf.addImage(
            photoData,
            imageFormat,
            pageWidth / 2 - 23,
            currentY,
            46,
            46
          );


          currentY += 53;

        } catch (error) {

          console.error(
            "PDF image error:",
            error
          );

        }

      }

    }


    /* -------------------------------------------------------
       NAME
    ------------------------------------------------------- */

    pdf.setTextColor(
      23,
      77,
      60
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(17);


    const memberName =
      showValue(
        member.full_name
      );


    const nameLines =
      pdf.splitTextToSize(
        memberName,
        pageWidth - margin * 2
      );


    pdf.text(
      nameLines,
      pageWidth / 2,
      currentY,
      {
        align: "center"
      }
    );


    currentY +=
      nameLines.length * 6 + 2;


    /* -------------------------------------------------------
       MEMBER ID + TYPE
    ------------------------------------------------------- */

    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(10);


    pdf.setTextColor(
      70,
      70,
      70
    );


    pdf.text(
      showValue(
        member.member_id
      ) +
      "  •  " +
      showValue(
        member.member_type
      ),
      pageWidth / 2,
      currentY,
      {
        align: "center"
      }
    );


    currentY += 11;


    /* -------------------------------------------------------
       INFORMATION HEADER
    ------------------------------------------------------- */

    pdf.setFillColor(
      23,
      77,
      60
    );


    pdf.roundedRect(
      margin,
      currentY,
      pageWidth - margin * 2,
      9,
      2,
      2,
      "F"
    );


    pdf.setTextColor(
      255,
      255,
      255
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(10);


    pdf.text(
      "MEMBER INFORMATION",
      margin + 5,
      currentY + 6
    );


    currentY += 13;


    /* -------------------------------------------------------
       MEMBER DETAILS
    ------------------------------------------------------- */

    const details = [

      [
        "NIC Number",
        showValue(
          member.nic_number
        )
      ],

      [
        "Date of Birth",
        formatDate(
          member.date_of_birth
        )
      ],

      [
        "Gender",
        showValue(
          member.gender
        )
      ],

      [
        "Phone / WhatsApp",
        showValue(
          member.phone_whatsapp
        )
      ],

      [
        "Address",
        showValue(
          member.address
        )
      ],

      [
        "Marital Status",
        showValue(
          member.marital_status
        )
      ],

      [
        "Date of Salvation",
        formatDate(
          member.date_of_salvation
        )
      ]

    ];


    details.forEach(
      function(item) {

        const label =
          item[0];


        const value =
          item[1];


        const labelX =
          margin + 5;


        const valueX =
          margin + 53;


        const maxWidth =
          pageWidth -
          valueX -
          margin -
          5;


        const lines =
          pdf.splitTextToSize(
            value,
            maxWidth
          );


        const rowHeight =
          Math.max(
            11,
            lines.length * 4.8 + 6
          );


        /* Row background */

        pdf.setFillColor(
          248,
          247,
          243
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth - margin * 2,
          rowHeight,
          2,
          2,
          "F"
        );


        /* Label */

        pdf.setFont(
          "helvetica",
          "bold"
        );


        pdf.setFontSize(8.5);


        pdf.setTextColor(
          23,
          77,
          60
        );


        pdf.text(
          label,
          labelX,
          currentY + 7
        );


        /* Value */

        pdf.setFont(
          "helvetica",
          "normal"
        );


        pdf.setTextColor(
          34,
          34,
          34
        );


        pdf.text(
          lines,
          valueX,
          currentY + 7
        );


        currentY +=
          rowHeight + 3;

      }
    );


    /* -------------------------------------------------------
       NOTES HEADER
    ------------------------------------------------------- */

    currentY += 2;


    pdf.setFillColor(
      23,
      77,
      60
    );


    pdf.roundedRect(
      margin,
      currentY,
      pageWidth - margin * 2,
      9,
      2,
      2,
      "F"
    );


    pdf.setTextColor(
      255,
      255,
      255
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(10);


    pdf.text(
      "ADDITIONAL NOTES",
      margin + 5,
      currentY + 6
    );


    currentY += 13;


    /* -------------------------------------------------------
       NOTES BOX
    ------------------------------------------------------- */

    const notes =
      showValue(
        member.additional_notes
      );


    const noteLines =
      pdf.splitTextToSize(
        notes,
        pageWidth -
        margin * 2 -
        10
      );


    const noteHeight =
      Math.max(
        16,
        noteLines.length * 4.8 + 10
      );


    /* Prevent notes from entering footer */

    const availableHeight =
      pageHeight -
      currentY -
      27;


    const finalNoteHeight =
      Math.min(
        noteHeight,
        Math.max(
          16,
          availableHeight
        )
      );


    pdf.setFillColor(
      250,
      249,
      246
    );


    pdf.roundedRect(
      margin,
      currentY,
      pageWidth - margin * 2,
      finalNoteHeight,
      2,
      2,
      "F"
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(9);


    pdf.setTextColor(
      34,
      34,
      34
    );


    let visibleNoteLines =
      noteLines;


    const maxNoteLines =
      Math.max(
        1,
        Math.floor(
          (finalNoteHeight - 7) /
          4.8
        )
      );


    if (
      visibleNoteLines.length >
      maxNoteLines
    ) {

      visibleNoteLines =
        visibleNoteLines.slice(
          0,
          maxNoteLines
        );


      if (
        visibleNoteLines.length > 0
      ) {

        let lastLine =
          visibleNoteLines[
            visibleNoteLines.length - 1
          ];


        if (
          lastLine.length > 3
        ) {

          lastLine =
            lastLine.substring(
              0,
              Math.max(
                1,
                lastLine.length - 3
              )
            ) +
            "...";


          visibleNoteLines[
            visibleNoteLines.length - 1
          ] =
            lastLine;

        }

      }

    }


    pdf.text(
      visibleNoteLines,
      margin + 5,
      currentY + 7
    );


    /* -------------------------------------------------------
       FOOTER
    ------------------------------------------------------- */

    addFooter(
      pdf,
      profileNumber,
      totalProfiles
    );

  }


  /* =========================================================
     DOWNLOAD ALL MEMBERS PDF
  ========================================================= */

  async function downloadAllMembersPDF() {

    if (
      !allMembers ||
      allMembers.length === 0
    ) {

      alert(
        "There are no members to export."
      );

      return;

    }


    pdfAllButton.disabled =
      true;


    pdfAllButton.textContent =
      "⏳ Creating PDF...";


    errorBox.innerHTML =
      '<div class="success">' +
      'Creating All Members PDF. Please wait...' +
      '</div>';


    try {

      const {
        jsPDF
      } =
      window.jspdf;


      if (!jsPDF) {

        throw new Error(
          "PDF library could not be loaded."
        );

      }


      const pdf =
        new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });


      const totalProfiles =
        allMembers.length;


      for (
        let i = 0;
        i < totalProfiles;
        i++
      ) {

        if (i > 0) {

          pdf.addPage();

        }


        errorBox.innerHTML =
          '<div class="success">' +
          'Creating PDF: Member ' +
          (i + 1) +
          ' of ' +
          totalProfiles +
          '...' +
          '</div>';


        await addMemberToPDF(
          pdf,
          allMembers[i],
          i + 1,
          totalProfiles
        );

      }


      pdf.save(
        "COC_Members_All_Members.pdf"
      );


      errorBox.innerHTML =
        '<div class="success">' +
        'All Members PDF downloaded successfully.' +
        '</div>';


    } catch (error) {

      console.error(
        "PDF Error:",
        error
      );


      errorBox.innerHTML =
        '<div class="error">' +
        'PDF creation failed: ' +
        error.message +
        '</div>';

    }


    pdfAllButton.disabled =
      false;


    pdfAllButton.textContent =
      "📚 Download All Members PDF";

  }


  /* =========================================================
     EVENTS
  ========================================================= */

  searchInput.addEventListener(
    "input",
    filterMembers
  );


  pdfAllButton.addEventListener(
    "click",
    downloadAllMembersPDF
  );


  /* =========================================================
     START
  ========================================================= */

  loadMembers();

</script>

</body>
</html>
