<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members List - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      color: #183b2b;
    }

    .header {
      background: #183b2b;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 27px;
    }

    .header p {
      margin: 4px 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .search-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .search-box input:focus {
      outline: none;
      border-color: #183b2b;
    }

    .top-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .top-buttons button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .member-count {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .member-card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .member-id {
      display: inline-block;
      background: #e8eee9;
      color: #183b2b;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .member-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #183b2b;
    }

    .member-info {
      color: #555;
      font-size: 14px;
      line-height: 1.7;
    }

    .view-btn {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: #183b2b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      background: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 15px;
      color: #666;
    }

    .loading {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .back-home {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Member Details */

    .details {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .details h2 {
      margin-top: 0;
      text-align: center;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .detail-label {
      font-weight: bold;
      color: #183b2b;
      display: block;
      margin-bottom: 4px;
    }

    .detail-value {
      color: #555;
      word-break: break-word;
    }

    .close-details {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #777;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="logo">✔️</div>

    <h1>COC Members</h1>

    <p>Church Of Christ Sri Lanka</p>

    <p>Members Registration</p>

  </div>


  <div class="container">

    <div class="top-buttons">

      <button type="button" onclick="loadMembers()">
        🔄 Refresh
      </button>

      <button type="button" onclick="goHome()">
        🏠 Home
      </button>

    </div>


    <div class="search-box">

      <label for="search">
        Search Members
      </label>

      <input
        id="search"
        type="search"
        placeholder="Search by Name or Member ID..."
        oninput="searchMembers()"
      >

    </div>


    <div id="memberCount" class="member-count">
      Loading Members...
    </div>


    <div id="details" class="details">

      <h2>Member Details</h2>

      <div id="detailsContent"></div>

      <button
        class="close-details"
        type="button"
        onclick="closeDetails()"
      >
        CLOSE
      </button>

    </div>


    <div id="membersContainer">

      <div class="loading">
        Loading members...
      </div>

    </div>


    <button
      class="back-home"
      type="button"
      onclick="goHome()"
    >
      BACK TO HOME
    </button>

  </div>


  <script>

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    let allMembers = [];


    /* =========================
       CHECK LOGIN
       ========================= */

    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {

        window.location.href =
          "index.html";

        return false;
      }

      return true;
    }


    /* =========================
       LOAD MEMBERS
       ========================= */

    async function loadMembers() {

      const container =
        document.getElementById("membersContainer");

      const count =
        document.getElementById("memberCount");


      container.innerHTML =
        '<div class="loading">Loading members...</div>';

      count.textContent =
        "Loading Members...";


      const loggedIn =
        await checkLogin();

      if (!loggedIn) {
        return;
      }


      const { data, error } =
        await supabaseClient
          .from("members")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "LOAD ERROR:",
          error
        );

        container.innerHTML =
          '<div class="error">' +
          "Error: " +
          error.message +
          "</div>";

        count.textContent =
          "Unable to load members";

        return;
      }


      allMembers = data || [];


      displayMembers(allMembers);

    }


    /* =========================
       DISPLAY MEMBERS
       ========================= */

    function displayMembers(members) {

      const container =
        document.getElementById("membersContainer");

      const count =
        document.getElementById("memberCount");


      count.textContent =
        "Total Members: " + members.length;


      if (!members.length) {

        container.innerHTML =
          '<div class="empty">' +
          "No members found." +
          "</div>";

        return;
      }


      container.innerHTML = "";


      members.forEach(function(member) {

        const card =
          document.createElement("div");

        card.className =
          "member-card";


        const id =
          member.member_id || "N/A";

        const name =
          member.full_name || "No Name";

        const type =
          member.member_type || "Not specified";

        const gender =
          member.gender || "Not specified";

        const phone =
          member.phone_whatsapp || "Not specified";


        card.innerHTML =

          '<div class="member-id">' +
          escapeHtml(id) +
          '</div>' +

          '<div class="member-name">' +
          escapeHtml(name) +
          '</div>' +

          '<div class="member-info">' +
          "Member Type: " +
          escapeHtml(type) +
          "<br>" +
          "Gender: " +
          escapeHtml(gender) +
          "<br>" +
          "Phone / WhatsApp: " +
          escapeHtml(phone) +
          "</div>" +

          '<button class="view-btn" type="button">' +
          "VIEW DETAILS" +
          "</button>";


        card
          .querySelector(".view-btn")
          .addEventListener(
            "click",
            function() {
              showDetails(member);
            }
          );


        container.appendChild(card);

      });

    }


    /* =========================
       SEARCH
       ========================= */

    function searchMembers() {

      const search =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();


      if (!search) {

        displayMembers(allMembers);

        return;
      }


      const filtered =
        allMembers.filter(function(member) {

          const name =
            (member.full_name || "")
              .toLowerCase();

          const id =
            (member.member_id || "")
              .toLowerCase();


          return (
            name.includes(search) ||
            id.includes(search)
          );

        });


      displayMembers(filtered);

    }


    /* =========================
       SHOW DETAILS
       ========================= */

    function showDetails(member) {

      const details =
        document.getElementById("details");

      const content =
        document.getElementById("detailsContent");


      content.innerHTML =

        detailRow(
          "Member ID",
          member.member_id
        ) +

        detailRow(
          "Full Name",
          member.full_name
        ) +

        detailRow(
          "Date of Birth",
          formatDate(member.date_of_birth)
        ) +

        detailRow(
          "Gender",
          member.gender
        ) +

        detailRow(
          "Phone / WhatsApp",
          member.phone_whatsapp
        ) +

        detailRow(
          "Address",
          member.address
        ) +

        detailRow(
          "Marital Status",
          member.marital_status
        ) +

        detailRow(
          "Church Joining Date",
          formatDate(member.church_joining_date)
        ) +

        detailRow(
          "Date of Salvation",
          formatDate(member.date_of_salvation)
        ) +

        detailRow(
          "Member Type",
          member.member_type
        ) +

        detailRow(
          "Additional Notes",
          member.additional_notes
        );


      details.style.display =
        "block";


      details.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    function detailRow(label, value) {

      return (

        '<div class="detail-row">' +

        '<span class="detail-label">' +
        escapeHtml(label) +
        '</span>' +

        '<span class="detail-value">' +
        escapeHtml(
          value || "Not provided"
        ) +
        '</span>' +

        '</div>'

      );

    }


    /* =========================
       FORMAT DATE
       ========================= */

    function formatDate(date) {

      if (!date) {
        return "Not provided";
      }

      const parts =
        date.split("-");

      if (parts.length === 3) {

        return (
          parts[2] +
          " / " +
          parts[1] +
          " / " +
          parts[0]
        );

      }

      return date;

    }


    /* =========================
       SECURITY
       ========================= */

    function escapeHtml(value) {

      if (value === null ||
          value === undefined) {

        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       CLOSE DETAILS
       ========================= */

    function closeDetails() {

      document
        .getElementById("details")
        .style.display = "none";

    }


    /* =========================
       HOME
       ========================= */

    function goHome() {

      window.location.href =
        "home.html";

    }


    /* =========================
       START
       ========================= */

    loadMembers();

  </script>

</body>
</html>
