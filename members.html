<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #c59b45;
      --secondary-color: #8b6f1d;
      --accent-color: #d4af37;
      --background-color: #f5f3ee;
      --card-color: #ffffff;
      --text-color: #222222;
      --button-text-color: #ffffff;

      --border-color: rgba(139, 111, 29, 0.18);
      --muted-color: #777777;
      --danger-color: #b42318;
      --success-color: #176b36;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background:
        var(--background-color);
      color:
        var(--text-color);
      min-height: 100vh;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
      color:
        var(--button-text-color);
      padding:
        34px 20px 38px;
      text-align: center;
      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.14);
    }

    .header::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      top: -125px;
      left: -75px;
      background:
        rgba(255, 255, 255, 0.09);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      bottom: -190px;
      right: -75px;
      background:
        rgba(255, 255, 255, 0.08);
    }

    .header-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: auto;
    }

    .logo-wrap {
      width: 94px;
      height: 94px;
      margin: 0 auto 15px;
      border-radius: 24px;
      padding: 8px;
      background:
        rgba(255, 255, 255, 0.15);
      border:
        1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.15);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      background: #ffffff;
    }

    .header h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.94;
      line-height: 1.4;
    }

    .header .subtitle {
      font-size: 13px;
      opacity: 0.84;
      margin-top: 3px;
    }

    /* =========================================================
       CONTAINER
    ========================================================= */

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 18px 40px;
    }

    /* =========================================================
       BACK BUTTON
    ========================================================= */

    .back-btn {
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      border:
        1px solid var(--border-color);
      border-radius: 13px;
      background:
        var(--card-color);
      color:
        var(--secondary-color);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 17px;
      cursor: pointer;
      transition:
        0.2s ease;
      box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.09);
    }

    /* =========================================================
       MAIN CARD
    ========================================================= */

    .card {
      background:
        var(--card-color);
      padding: 27px;
      border-radius: 22px;
      border:
        1px solid var(--border-color);
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.08);
      margin-bottom: 15px;
    }

    .card-heading {
      margin-bottom: 20px;
    }

    .card-heading h2 {
      margin: 0;
      color:
        var(--text-color);
      font-size: 26px;
      font-weight: 800;
    }

    .card-heading p {
      margin: 7px 0 0;
      color:
        var(--muted-color);
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-wrap {
      position: relative;
      margin-bottom: 13px;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.65;
      pointer-events: none;
    }

    .search {
      width: 100%;
      min-height: 52px;
      padding:
        14px 16px 14px 46px;
      border:
        1px solid var(--border-color);
      border-radius: 13px;
      background:
        var(--background-color);
      color:
        var(--text-color);
      font-size: 15px;
      outline: none;
      transition:
        0.2s ease;
    }

    .search::placeholder {
      color:
        var(--muted-color);
    }

    .search:focus {
      background:
        var(--card-color);
      border-color:
        var(--primary-color);
      box-shadow:
        0 0 0 4px
        color-mix(
          in srgb,
          var(--primary-color) 16%,
          transparent
        );
    }

    /* =========================================================
       PDF BUTTONS
    ========================================================= */

    .pdf-all-btn {
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      border: none;
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          var(--primary-color),
          var(--accent-color)
        );
      color:
        var(--button-text-color);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow:
        0 7px 18px
        color-mix(
          in srgb,
          var(--primary-color) 28%,
          transparent
        );
      transition:
        0.2s ease;
    }

    .pdf-all-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 10px 23px
        color-mix(
          in srgb,
          var(--primary-color) 34%,
          transparent
        );
    }

    .pdf-all-btn:active {
      transform: translateY(0);
    }

    .pdf-all-btn:disabled {
      background:
        #aaa;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================================
       MESSAGES
    ========================================================= */

    .error {
      background:
        #f8dddd;
      color:
        var(--danger-color);
      padding: 13px 14px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      border:
        1px solid rgba(180, 35, 24, 0.15);
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background:
        #dff2e5;
      color:
        var(--success-color);
      padding: 13px 14px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      border:
        1px solid rgba(23, 107, 54, 0.15);
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================================================
       MEMBER LIST
    ========================================================= */

    #membersList {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 16px;
      border:
        1px solid var(--border-color);
      border-radius: 17px;
      cursor: pointer;
      background:
        var(--card-color);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
      overflow: hidden;
    }

    .member-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background:
        linear-gradient(
          180deg,
          var(--primary-color),
          var(--accent-color)
        );
      opacity: 0.85;
    }

    .member-card:hover {
      transform:
        translateY(-2px);
      border-color:
        color-mix(
          in srgb,
          var(--primary-color) 42%,
          transparent
        );
      box-shadow:
        0 9px 25px rgba(0, 0, 0, 0.09);
    }

    .member-photo {
      width: 78px;
      height: 78px;
      border-radius: 18px;
      object-fit: cover;
      border:
        3px solid
        color-mix(
          in srgb,
          var(--accent-color) 72%,
          white
        );
      background:
        var(--background-color);
      flex-shrink: 0;
      box-shadow:
        0 4px 13px rgba(0, 0, 0, 0.10);
    }

    .member-info {
      flex: 1;
      min-width: 0;
      padding-top: 1px;
    }

    .member-field {
      margin-bottom: 5px;
      font-size: 13.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .member-field-label {
      font-weight: 700;
      color:
        var(--secondary-color);
    }

    .member-field-value {
      color:
        var(--text-color);
    }

    .member-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
      color:
        var(--text-color);
      line-height: 1.3;
    }

    /* =========================================================
       MEMBER ID SPECIAL STYLE
    ========================================================= */

    .member-id-badge {
      display: inline-block;
      margin-top: 3px;
      padding: 4px 8px;
      border-radius: 7px;
      background:
        color-mix(
          in srgb,
          var(--primary-color) 12%,
          transparent
        );
      color:
        var(--secondary-color);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    /* =========================================================
       EMPTY / LOADING
    ========================================================= */

    .empty {
      text-align: center;
      padding: 45px 15px;
      color:
        var(--muted-color);
      background:
        var(--background-color);
      border:
        1px dashed var(--border-color);
      border-radius: 15px;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 45px 15px;
      color:
        var(--muted-color);
      background:
        var(--background-color);
      border-radius: 15px;
      font-size: 14px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .header {
        padding:
          27px 15px 31px;
      }

      .logo-wrap {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        padding: 7px;
        margin-bottom: 12px;
      }

      .header h1 {
        font-size: 23px;
      }

      .header p {
        font-size: 13px;
      }

      .header .subtitle {
        font-size: 12px;
      }

      .container {
        padding:
          15px 12px 30px;
      }

      .back-btn {
        min-height: 46px;
        margin-bottom: 13px;
      }

      .card {
        padding: 19px 15px;
        border-radius: 17px;
      }

      .card-heading {
        margin-bottom: 17px;
      }

      .card-heading h2 {
        font-size: 22px;
      }

      .card-heading p {
        font-size: 13px;
      }

      .search {
        min-height: 49px;
        font-size: 14px;
      }

      .pdf-all-btn {
        min-height: 49px;
        font-size: 14px;
      }

      .member-card {
        gap: 12px;
        padding: 13px;
        border-radius: 15px;
      }

      .member-photo {
        width: 66px;
        height: 66px;
        border-radius: 15px;
      }

      .member-name {
        font-size: 16px;
      }

      .member-field {
        font-size: 12.5px;
      }

    }

    @media (max-width: 390px) {

      .member-card {
        gap: 10px;
        padding: 11px;
      }

      .member-photo {
        width: 59px;
        height: 59px;
      }

      .member-name {
        font-size: 15px;
      }

      .member-field {
        font-size: 12px;
      }

    }
  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
  ========================================================= -->

  <div class="header">

    <div class="header-content">

      <div
        class="logo-wrap"
        id="logoWrap"
      >
        <img
          id="appLogo"
          src=""
          alt="App Logo"
        >
      </div>

      <h1 id="appName">
        COC Members
      </h1>

      <p id="churchName">
        Church Of Christ Sri Lanka
      </p>

      <p
        id="subtitle"
        class="subtitle"
      >
        Members Registration
      </p>

    </div>

  </div>


  <!-- =========================================================
       MAIN
  ========================================================= -->

  <div class="container">

    <button
      class="back-btn"
      onclick="window.location.href='home.html'"
    >
      ← Back to Dashboard
    </button>


    <div class="card">

      <div class="card-heading">

        <h2>
          Members
        </h2>

        <p>
          Search and view registered church members.
        </p>

      </div>


      <!-- SEARCH -->

      <div class="search-wrap">

        <span class="search-icon">
          🔍
        </span>

        <input
          type="text"
          id="searchInput"
          class="search"
          placeholder="Search members..."
          autocomplete="off"
        >

      </div>


      <!-- PDF DOWNLOAD -->

      <button
        id="pdfAllButton"
        class="pdf-all-btn"
      >
        📚 Download All Members PDF
      </button>


      <!-- PDF SHARE -->

      <button
        id="pdfShareButton"
        class="pdf-all-btn"
      >
        📤 Share All Members PDF
      </button>


      <!-- ERROR / SUCCESS -->

      <div id="errorBox"></div>


      <!-- MEMBERS -->

      <div id="membersList">

        <div class="loading">
          Loading members...
        </div>

      </div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const membersList =
    document.getElementById(
      "membersList"
    );

  const searchInput =
    document.getElementById(
      "searchInput"
    );

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  const pdfAllButton =
    document.getElementById(
      "pdfAllButton"
    );

  const pdfShareButton =
    document.getElementById(
      "pdfShareButton"
    );

  const logoWrap =
    document.getElementById(
      "logoWrap"
    );

  const appLogo =
    document.getElementById(
      "appLogo"
    );


  /* =========================================================
     GLOBAL DATA
  ========================================================= */

  let allMembers = [];

  let memberListFields = [];

  let appSettings = {};


  /* =========================================================
     FIELD → DATABASE COLUMN
  ========================================================= */

  const fieldDatabaseMap = {

    member_id:
      "member_id",

    member_type:
      "member_type",

    full_name:
      "full_name",

    nic_number:
      "nic_number",

    date_of_birth:
      "date_of_birth",

    gender:
      "gender",

    phone_whatsapp:
      "phone_whatsapp",

    address:
      "address",

    marital_status:
      "marital_status",

    date_of_salvation:
      "date_of_salvation",

    member_photo:
      "photo_url",

    additional_notes:
      "additional_notes"

  };


  /* =========================================================
     CHECK LOGIN
  ========================================================= */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    return data.user;

  }


  /* =========================================================
     LOAD APP SETTINGS
  ========================================================= */

  async function loadAppSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_settings")
        .select(`
          app_name,
          church_name,
          subtitle,
          logo_url,
          primary_color,
          secondary_color,
          accent_color,
          background_color,
          card_color,
          text_color,
          button_text_color
        `)
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(
        "App settings error:",
        error
      );

      return;

    }


    appSettings =
      data || {};


    /* APP TEXT */

    document.getElementById(
      "appName"
    ).textContent =
      appSettings.app_name ||
      "COC Members";


    document.getElementById(
      "churchName"
    ).textContent =
      appSettings.church_name ||
      "Church Of Christ Sri Lanka";


    document.getElementById(
      "subtitle"
    ).textContent =
      appSettings.subtitle ||
      "Members Registration";


    /* LOGO */

    if (
      appSettings.logo_url
    ) {

      appLogo.src =
        appSettings.logo_url;

      logoWrap.style.display =
        "flex";

    } else {

      logoWrap.style.display =
        "none";

    }


    /* COLOUR SETTINGS */

    applyTheme();

  }


  /* =========================================================
     APPLY THEME
  ========================================================= */

  function applyTheme() {

    const root =
      document.documentElement;


    root.style.setProperty(
      "--primary-color",
      appSettings.primary_color ||
      "#c59b45"
    );


    root.style.setProperty(
      "--secondary-color",
      appSettings.secondary_color ||
      "#8b6f1d"
    );


    root.style.setProperty(
      "--accent-color",
      appSettings.accent_color ||
      "#d4af37"
    );


    root.style.setProperty(
      "--background-color",
      appSettings.background_color ||
      "#f5f3ee"
    );


    root.style.setProperty(
      "--card-color",
      appSettings.card_color ||
      "#ffffff"
    );


    root.style.setProperty(
      "--text-color",
      appSettings.text_color ||
      "#222222"
    );


    root.style.setProperty(
      "--button-text-color",
      appSettings.button_text_color ||
      "#ffffff"
    );

  }


  /* =========================================================
     LOAD MEMBERS LIST SETTINGS
  ========================================================= */

  async function loadMemberListFields() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("member_list_fields")
        .select(`
          id,
          field_key,
          field_label,
          is_visible,
          is_searchable,
          display_order,
          show_in_pdf
        `)
        .order(
          "display_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Member list fields error:",
        error
      );

      throw error;

    }


    memberListFields =
      data || [];

  }


  /* =========================================================
     GET VISIBLE FIELDS
  ========================================================= */

  function getVisibleFields() {

    return memberListFields
      .filter(
        function(field) {

          return (
            field.is_visible === true
          );

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(
              a.display_order || 0
            ) -
            Number(
              b.display_order || 0
            )
          );

        }
      );

  }


  /* =========================================================
     GET SEARCHABLE FIELDS
  ========================================================= */

  function getSearchableFields() {

    return memberListFields
      .filter(
        function(field) {

          return (
            field.is_searchable === true
          );

        }
      );

  }


  /* =========================================================
     GET PDF FIELDS
  ========================================================= */

  function getPdfFields() {

    return memberListFields
      .filter(
        function(field) {

          return (
            field.show_in_pdf === true
          );

        }
      )
      .sort(
        function(a, b) {

          return (
            Number(
              a.display_order || 0
            ) -
            Number(
              b.display_order || 0
            )
          );

        }
      );

  }


  /* =========================================================
     SHOW VALUE
  ========================================================= */

  function showValue(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "Not provided";

    }


    return String(value);

  }


  /* =========================================================
     FORMAT DATE
  ========================================================= */

  function formatDate(date) {

    if (!date) {

      return "Not provided";

    }


    const parts =
      String(date).split("-");


    if (
      parts.length !== 3
    ) {

      return String(date);

    }


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  /* =========================================================
     GET DISPLAY VALUE
  ========================================================= */

  function getFieldValue(
    member,
    fieldKey
  ) {

    const column =
      fieldDatabaseMap[fieldKey];


    if (!column) {

      return "";

    }


    const value =
      member[column];


    if (
      fieldKey ===
        "date_of_birth" ||
      fieldKey ===
        "date_of_salvation"
    ) {

      return formatDate(value);

    }


    return showValue(value);

  }


  /* =========================================================
     DISPLAY MEMBERS
  ========================================================= */

  function displayMembers(
    members
  ) {

    membersList.innerHTML =
      "";


    if (
      !members ||
      members.length === 0
    ) {

      membersList.innerHTML =
        '<div class="empty">' +
        'No members found.' +
        '</div>';

      return;

    }


    const visibleFields =
      getVisibleFields();


    members.forEach(
      function(member) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "member-card";


        card.onclick =
          function() {

            window.location.href =
              "member.html?id=" +
              encodeURIComponent(
                member.id
              );

          };


        /* =====================================================
           PHOTO
        ===================================================== */

        const photoField =
          memberListFields.find(
            function(field) {

              return (
                field.field_key ===
                "member_photo"
              );

            }
          );


        const showPhoto =
          photoField
            ? photoField.is_visible === true
            : true;


        if (showPhoto) {

          const photo =
            document.createElement(
              "img"
            );


          photo.className =
            "member-photo";


          photo.alt =
            "Member Photo";


          if (
            member.photo_url
          ) {

            photo.src =
              member.photo_url;

          } else {

            photo.src =
              "data:image/svg+xml;charset=UTF-8," +
              encodeURIComponent(`
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="100"
                  height="100"
                >
                  <rect
                    width="100%"
                    height="100%"
                    fill="#eeeeee"
                  />
                  <text
                    x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-size="12"
                    fill="#777"
                  >
                    No Photo
                  </text>
                </svg>
              `);

          }


          card.appendChild(
            photo
          );

        }


        /* =====================================================
           MEMBER INFORMATION
        ===================================================== */

        const info =
          document.createElement(
            "div"
          );


        info.className =
          "member-info";


        visibleFields.forEach(
          function(field) {

            if (
              field.field_key ===
              "member_photo"
            ) {

              return;

            }


            const value =
              getFieldValue(
                member,
                field.field_key
              );


            const fieldDiv =
              document.createElement(
                "div"
              );


            fieldDiv.className =
              "member-field";


            /* FULL NAME */

            if (
              field.field_key ===
              "full_name"
            ) {

              fieldDiv.classList.add(
                "member-name"
              );


              fieldDiv.textContent =
                value;


            }

            /* MEMBER ID */

            else if (
              field.field_key ===
              "member_id"
            ) {

              const badge =
                document.createElement(
                  "span"
                );


              badge.className =
                "member-id-badge";


              badge.textContent =
                value;


              fieldDiv.appendChild(
                badge
              );

            }

            /* OTHER FIELDS */

            else {

              const label =
                document.createElement(
                  "span"
                );


              label.className =
                "member-field-label";


              label.textContent =
                field.field_label +
                ": ";


              const valueSpan =
                document.createElement(
                  "span"
                );


              valueSpan.className =
                "member-field-value";


              valueSpan.textContent =
                value;


              fieldDiv.appendChild(
                label
              );


              fieldDiv.appendChild(
                valueSpan
              );

            }


            info.appendChild(
              fieldDiv
            );

          }
        );


        card.appendChild(
          info
        );


        membersList.appendChild(
          card
        );

      }
    );

  }


  /* =========================================================
     SEARCH PLACEHOLDER
  ========================================================= */

  function updateSearchPlaceholder() {

    const searchable =
      getSearchableFields();


    if (
      searchable.length === 0
    ) {

      searchInput.placeholder =
        "Search members...";

      return;

    }


    const labels =
      searchable
        .map(
          function(field) {

            return field.field_label;

          }
        )
        .slice(
          0,
          4
        );


    searchInput.placeholder =
      "Search by " +
      labels.join(", ") +
      "...";

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  function filterMembers() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!search) {

      displayMembers(
        allMembers
      );

      return;

    }


    const searchableFields =
      getSearchableFields();


    const filtered =
      allMembers.filter(
        function(member) {

          return searchableFields.some(
            function(field) {

              const value =
                getFieldValue(
                  member,
                  field.field_key
                );


              return String(value)
                .toLowerCase()
                .includes(search);

            }
          );

        }
      );


    displayMembers(
      filtered
    );

  }

  /* =========================================================
     IMAGE → DATA URL
  ========================================================= */

  async function imageToDataURL(
    url
  ) {

    try {

      const response =
        await fetch(
          url,
          {
            mode: "cors"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Image loading failed"
        );

      }


      const blob =
        await response.blob();


      return await new Promise(
        function(
          resolve,
          reject
        ) {

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            blob
          );

        }
      );


    } catch (error) {

      console.error(
        "Image error:",
        error
      );


      return null;

    }

  }


  /* =========================================================
     GET IMAGE FORMAT
  ========================================================= */

  function getImageFormat(
    dataURL
  ) {

    if (!dataURL) {

      return "JPEG";

    }


    if (
      dataURL.startsWith(
        "data:image/png"
      )
    ) {

      return "PNG";

    }


    if (
      dataURL.startsWith(
        "data:image/webp"
      )
    ) {

      return "WEBP";

    }


    if (
      dataURL.startsWith(
        "data:image/gif"
      )
    ) {

      return "GIF";

    }


    return "JPEG";

  }


  /* =========================================================
     CAPACITOR / NATIVE APP HELPERS
  ========================================================= */

  function isNativeApp() {

    return !!(
      window.Capacitor &&
      typeof window.Capacitor.isNativePlatform ===
        "function" &&
      window.Capacitor.isNativePlatform()
    );

  }


  function getNativePlugin(
    name
  ) {

    if (
      !window.Capacitor ||
      !window.Capacitor.Plugins
    ) {

      return null;

    }


    return (
      window.Capacitor.Plugins[name] ||
      null
    );

  }


  /* =========================================================
     BLOB → BASE64
  ========================================================= */

  async function blobToBase64(
    blob
  ) {

    return await new Promise(
      function(
        resolve,
        reject
      ) {

        const reader =
          new FileReader();


        reader.onloadend =
          function() {

            try {

              const result =
                reader.result;


              if (
                typeof result !==
                "string"
              ) {

                reject(
                  new Error(
                    "Could not convert PDF to Base64."
                  )
                );

                return;

              }


              const base64 =
                result.split(",")[1];


              resolve(
                base64
              );


            } catch (error) {

              reject(
                error
              );

            }

          };


        reader.onerror =
          function() {

            reject(
              new Error(
                "Could not read PDF file."
              )
            );

          };


        reader.readAsDataURL(
          blob
        );

      }
    );

  }


  /* =========================================================
     SAVE PDF TO DEVICE
  ========================================================= */

  async function savePDFToDevice(
    pdf,
    fileName
  ) {

    /* =====================================================
       ANDROID / CAPACITOR
    ===================================================== */

    if (
      isNativeApp()
    ) {

      const Filesystem =
        getNativePlugin(
          "Filesystem"
        );


      if (!Filesystem) {

        throw new Error(
          "Filesystem plugin is not available in the APK."
        );

      }


      const pdfBlob =
        pdf.output(
          "blob"
        );


      const base64 =
        await blobToBase64(
          pdfBlob
        );


      await Filesystem.writeFile({

        path:
          fileName,

        data:
          base64,

        directory:
          "DOCUMENTS",

        recursive:
          true

      });


      return true;

    }


    /* =====================================================
       BROWSER FALLBACK
    ===================================================== */

    pdf.save(
      fileName
    );


    return true;

  }


  /* =========================================================
     SHARE PDF
  ========================================================= */

  async function sharePDFFile(
    pdf,
    fileName
  ) {

    /* =====================================================
       ANDROID / CAPACITOR
    ===================================================== */

    if (
      isNativeApp()
    ) {

      const Filesystem =
        getNativePlugin(
          "Filesystem"
        );


      const Share =
        getNativePlugin(
          "Share"
        );


      if (!Filesystem) {

        throw new Error(
          "Filesystem plugin is not available in the APK."
        );

      }


      if (!Share) {

        throw new Error(
          "Share plugin is not available in the APK."
        );

      }


      const pdfBlob =
        pdf.output(
          "blob"
        );


      const base64 =
        await blobToBase64(
          pdfBlob
        );


      /*
        Save a copy in CACHE for Android sharing.
      */

      await Filesystem.writeFile({

        path:
          fileName,

        data:
          base64,

        directory:
          "CACHE",

        recursive:
          true

      });


      const uriResult =
        await Filesystem.getUri({

          directory:
            "CACHE",

          path:
            fileName

        });


      await Share.share({

        title:
          "COC Members PDF",

        text:
          "COC Members - All Members",

        url:
          uriResult.uri,

        dialogTitle:
          "Share COC Members PDF"

      });


      return true;

    }


    /* =====================================================
       BROWSER FALLBACK
    ===================================================== */

    const blob =
      pdf.output(
        "blob"
      );


    const file =
      new File(
        [blob],
        fileName,
        {
          type:
            "application/pdf"
        }
      );


    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:
          [file]
      })
    ) {

      await navigator.share({

        title:
          "COC Members PDF",

        text:
          "COC Members - All Members",

        files:
          [file]

      });


      return true;

    }


    /*
      Browser does not support file sharing.
      Use normal browser download.
    */

    pdf.save(
      fileName
    );


    return true;

  }

    member,
    profileNumber,
    totalProfiles
  ) {

    );

    );

      "normal"

      9.5
    );

      "Church Of Christ Sri Lanka",
      pageWidth / 2,
      21,
      {
        align:
          "center"
      }
    );


    pdf.text(
      appSettings.subtitle ||
      "Members Registration",
      pageWidth / 2,
      27,
      {
        align:
          "center"
      }
    );


    /* =====================================================
       PROFILE NUMBER
    ===================================================== */

    let currentY =
      45;


    pdf.setTextColor(
      100,
      100,
      100
    );


    pdf.setFont(
      "helvetica",
      "normal"
    );


    pdf.setFontSize(
      8
    );


    pdf.text(
      "Member Profile " +
      profileNumber,
      pageWidth - margin,
      currentY,
      {
        align:
          "right"
      }
    );


    currentY += 7;


    /* =====================================================
       PHOTO
    ===================================================== */

    const photoField =
      memberListFields.find(
        function(field) {

          return (
            field.field_key ===
            "member_photo"
          );

        }
      );


    const showPhotoInPdf =
      photoField
        ? photoField.show_in_pdf === true
        : true;


    if (
      showPhotoInPdf &&
      member.photo_url
    ) {

      const photoData =
        await imageToDataURL(
          member.photo_url
        );


      if (photoData) {

        try {

          const imageFormat =
            getImageFormat(
              photoData
            );


          pdf.addImage(
            photoData,
            imageFormat,
            pageWidth / 2 - 23,
            currentY,
            46,
            46
          );


          currentY += 53;


        } catch (error) {

          console.error(
            "PDF image error:",
            error
          );

        }

      }

    }


    /* =====================================================
       NAME
    ===================================================== */

    const nameField =
      memberListFields.find(
        function(field) {

          return (
            field.field_key ===
            "full_name"
          );

        }
      );


    const nameLabel =
      nameField
        ? nameField.field_label
        : "Full Name";


    const memberName =
      getFieldValue(
        member,
        "full_name"
      );


    pdf.setTextColor(
      139,
      111,
      29
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(
      17
    );


    const nameLines =
      pdf.splitTextToSize(
        memberName,
        pageWidth -
        margin * 2
      );


    pdf.text(
      nameLines,
      pageWidth / 2,
      currentY,
      {
        align:
          "center"
      }
    );


    currentY +=
      nameLines.length *
      6 +
      2;


    /* =====================================================
       MEMBER DETAILS HEADER
    ===================================================== */

    const pdfFields =
      getPdfFields();


    pdf.setFillColor(
      197,
      155,
      69
    );


    pdf.roundedRect(
      margin,
      currentY,
      pageWidth -
        margin * 2,
      9,
      2,
      2,
      "F"
    );


    pdf.setTextColor(
      255,
      255,
      255
    );


    pdf.setFont(
      "helvetica",
      "bold"
    );


    pdf.setFontSize(
      10
    );


    pdf.text(
      "MEMBER INFORMATION",
      margin + 5,
      currentY + 6
    );


    currentY += 13;


    /* =====================================================
       PDF FIELDS
    ===================================================== */

    pdfFields.forEach(
      function(field) {

        if (
          field.field_key ===
          "full_name"
        ) {

          return;

        }


        if (
          field.field_key ===
          "member_photo"
        ) {

          return;

        }


        const label =
          field.field_label ||
          field.field_key;


        const value =
          getFieldValue(
            member,
            field.field_key
          );


        const labelX =
          margin + 5;


        const valueX =
          margin + 53;


        const maxWidth =
          pageWidth -
          valueX -
          margin -
          5;


        const lines =
          pdf.splitTextToSize(
            value,
            maxWidth
          );


        const rowHeight =
          Math.max(
            11,
            lines.length *
              4.8 +
              6
          );


        /* ROW */

        pdf.setFillColor(
          248,
          247,
          243
        );


        pdf.roundedRect(
          margin,
          currentY,
          pageWidth -
            margin * 2,
          rowHeight,
          2,
          2,
          "F"
        );


        /* LABEL */

        pdf.setFont(
          "helvetica",
          "bold"
        );


        pdf.setFontSize(
          8.5
        );


        pdf.setTextColor(
          139,
          111,
          29
        );


        pdf.text(
          label,
          labelX,
          currentY + 7
        );


        /* VALUE */

        pdf.setFont(
          "helvetica",
          "normal"
        );


        pdf.setTextColor(
          34,
          34,
          34
        );


        pdf.text(
          lines,
          valueX,
          currentY + 7
        );


        currentY +=
          rowHeight +
          3;

      }
    );


    /* =====================================================
       NOTES
    ===================================================== */

    const notesField =
      memberListFields.find(
        function(field) {

          return (
            field.field_key ===
            "additional_notes"
          );

        }
      );


    if (
      notesField &&
      notesField.show_in_pdf === true
    ) {

      currentY += 2;


      pdf.setFillColor(
        197,
        155,
        69
      );


      pdf.roundedRect(
        margin,
        currentY,
        pageWidth -
          margin * 2,
        9,
        2,
        2,
        "F"
      );


      pdf.setTextColor(
        255,
        255,
        255
      );


      pdf.setFont(
        "helvetica",
        "bold"
      );


      pdf.setFontSize(
        10
      );


      pdf.text(
        notesField.field_label ||
        "Additional Notes",
        margin + 5,
        currentY + 6
      );


      currentY += 13;


      const notes =
        getFieldValue(
          member,
          "additional_notes"
        );


      const noteLines =
        pdf.splitTextToSize(
          notes,
          pageWidth -
            margin * 2 -
            10
        );


      const noteHeight =
        Math.max(
          16,
          noteLines.length *
            4.8 +
            10
        );


      const availableHeight =
        pageHeight -
        currentY -
        27;


      const finalNoteHeight =
        Math.min(
          noteHeight,
          Math.max(
            16,
            availableHeight
          )
        );


      pdf.setFillColor(
        250,
        249,
        246
      );


      pdf.roundedRect(
        margin,
        currentY,
        pageWidth -
          margin * 2,
        finalNoteHeight,
        2,
        2,
        "F"
      );


      pdf.setFont(
        "helvetica",
        "normal"
      );


      pdf.setFontSize(
        9
      );


      pdf.setTextColor(
        34,
        34,
        34
      );


      let visibleNoteLines =
        noteLines;


      const maxNoteLines =
        Math.max(
          1,
          Math.floor(
            (finalNoteHeight - 7) /
            4.8
          )
        );


      if (
        visibleNoteLines.length >
        maxNoteLines
      ) {

        visibleNoteLines =
          visibleNoteLines.slice(
            0,
            maxNoteLines
          );


        if (
          visibleNoteLines.length >
          0
        ) {

          let lastLine =
            visibleNoteLines[
              visibleNoteLines.length - 1
            ];


          if (
            lastLine.length > 3
          ) {

            lastLine =
              lastLine.substring(
                0,
                Math.max(
                  1,
                  lastLine.length - 3
                )
              ) +
              "...";


            visibleNoteLines[
              visibleNoteLines.length - 1
            ] =
              lastLine;

          }

        }

      }


      pdf.text(
        visibleNoteLines,
        margin + 5,
        currentY + 7
      );

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    addFooter(
      pdf,
      profileNumber,
      totalProfiles
    );

  }


  /* =========================================================
     CREATE ALL MEMBERS PDF
  ========================================================= */

  async function createAllMembersPDF() {

    const {
      jsPDF
    } =
      window.jspdf;


    if (!jsPDF) {

      throw new Error(
        "PDF library could not be loaded."
      );

    }


    const pdf =
      new jsPDF({

        orientation:
          "portrait",

        unit:
          "mm",

        format:
          "a4"

      });


    const totalProfiles =
      allMembers.length;


    for (
      let i = 0;
      i < totalProfiles;
      i++
    ) {

      if (i > 0) {

        pdf.addPage();

      }


      errorBox.innerHTML =
        '<div class="success">' +
        'Creating PDF: Member ' +
        (i + 1) +
        ' of ' +
        totalProfiles +
        '...' +
        '</div>';


      await addMemberToPDF(
        pdf,
        allMembers[i],
        i + 1,
        totalProfiles
      );

    }


    return pdf;

  }


  /* =========================================================
     DOWNLOAD ALL MEMBERS PDF
  ========================================================= */

  async function downloadAllMembersPDF() {

    if (
      !allMembers ||
      allMembers.length === 0
    ) {

      alert(
        "There are no members to export."
      );

      return;

    }


    pdfAllButton.disabled =
      true;


    pdfShareButton.disabled =
      true;


    pdfAllButton.textContent =
      "⏳ Creating PDF...";


    errorBox.innerHTML =
      '<div class="success">' +
      'Creating All Members PDF. Please wait...' +
      '</div>';


    try {

      const pdf =
        await createAllMembersPDF();


      await savePDFToDevice(
        pdf,
        "COC_Members_All_Members.pdf"
      );


      errorBox.innerHTML =
        '<div class="success">' +
        (
          isNativeApp()
            ? "All Members PDF saved successfully to your device."
            : "All Members PDF downloaded successfully."
        ) +
        '</div>';


    } catch (error) {

      console.error(
        "PDF Error:",
        error
      );


      errorBox.innerHTML =
        '<div class="error">' +
        'PDF creation/download failed: ' +
        error.message +
        '</div>';

    }


    pdfAllButton.disabled =
      false;


    pdfShareButton.disabled =
      false;


    pdfAllButton.textContent =
      "📚 Download All Members PDF";

  }


  /* =========================================================
     SHARE ALL MEMBERS PDF
  ========================================================= */

  async function shareAllMembersPDF() {

    if (
      !allMembers ||
      allMembers.length === 0
    ) {

      alert(
        "There are no members to export."
      );

      return;

    }


    pdfShareButton.disabled =
      true;


    pdfAllButton.disabled =
      true;


    pdfShareButton.textContent =
      "⏳ Creating PDF...";


    errorBox.innerHTML =
      '<div class="success">' +
      'Creating All Members PDF for sharing. Please wait...' +
      '</div>';


    try {

      const pdf =
        await createAllMembersPDF();


      await sharePDFFile(
        pdf,
        "COC_Members_All_Members.pdf"
      );


      errorBox.innerHTML =
        '<div class="success">' +
        'All Members PDF is ready to share.' +
        '</div>';


    } catch (error) {

      console.error(
        "PDF Share Error:",
        error
      );


      /*
        User cancelling Android share dialog
        should not be treated as a serious error.
      */

      if (
        error &&
        (
          error.message ===
            "Share canceled" ||
          error.message ===
            "User canceled"
        )
      ) {

        errorBox.innerHTML =
          '<div class="success">' +
          'PDF sharing was canceled.' +
          '</div>';

      } else {

        errorBox.innerHTML =
          '<div class="error">' +
          'PDF sharing failed: ' +
          error.message +
          '</div>';

      }

    }


    pdfShareButton.disabled =
      false;


    pdfAllButton.disabled =
      false;


    pdfShareButton.textContent =
      "📤 Share All Members PDF";

  }


  /* =========================================================
     EVENTS
  ========================================================= */

  searchInput.addEventListener(
    "input",
    filterMembers
  );


  pdfAllButton.addEventListener(
    "click",
    downloadAllMembersPDF
  );


  pdfShareButton.addEventListener(
    "click",
    shareAllMembersPDF
  );


  /* =========================================================
     LOGO ERROR HANDLING
  ========================================================= */

  appLogo.addEventListener(
    "error",
    function() {

      logoWrap.style.display =
        "none";

    }
  );


  /* =========================================================
     START
  ========================================================= */

  async function initialize() {

    try {

      const user =
        await checkUser();


      if (!user) return;


      await loadAppSettings();

      await loadMemberListFields();

      await loadMembers();


    } catch (error) {

      console.error(
        "Initialization error:",
        error
      );


      errorBox.innerHTML =
        '<div class="error">' +
        'Failed to load Members List settings: ' +
        error.message +
        '</div>';

    }

  }


  initialize();

</script>

</body>
</html>
