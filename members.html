<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members List - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      color: #183b2b;
    }

    .header {
      background: #183b2b;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 27px;
    }

    .header p {
      margin: 4px 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .search-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .search-box input:focus {
      outline: none;
      border-color: #183b2b;
    }

    .top-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .top-buttons button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .member-count {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .member-card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 13px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .member-id {
      display: inline-block;
      background: #e8eee9;
      color: #183b2b;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .member-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #183b2b;
    }

    .member-info {
      color: #555;
      font-size: 14px;
      line-height: 1.7;
    }

    .view-btn,
    .edit-btn,
    .delete-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 9px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .view-btn {
      background: #183b2b;
    }

    .edit-btn {
      background: #b8860b;
    }

    .delete-btn {
      background: #8b2f2f;
    }

    .empty {
      background: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 15px;
      color: #666;
    }

    .loading {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .back-home {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .details,
    .edit-panel {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .details h2,
    .edit-panel h2 {
      margin-top: 0;
      text-align: center;
    }

    .detail-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .detail-label {
      font-weight: bold;
      color: #183b2b;
      display: block;
      margin-bottom: 4px;
    }

    .detail-value {
      color: #555;
      word-break: break-word;
    }

    .close-details,
    .save-edit,
    .cancel-edit {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close-details,
    .cancel-edit {
      background: #777;
    }

    .save-edit {
      background: #b8860b;
    }

    .edit-group {
      margin-bottom: 14px;
    }

    .edit-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .edit-group input,
    .edit-group select,
    .edit-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .edit-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .readonly {
      background: #eeeeee;
      color: #777;
    }

    #editMessage {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">✔️</div>
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">

    <div class="top-buttons">
      <button type="button" onclick="loadMembers()">
        🔄 Refresh
      </button>

      <button type="button" onclick="goHome()">
        🏠 Home
      </button>
    </div>

    <div class="search-box">
      <label for="search">Search Members</label>

      <input
        id="search"
        type="search"
        placeholder="Search by Name or Member ID..."
        oninput="searchMembers()"
      >
    </div>

    <div id="memberCount" class="member-count">
      Loading Members...
    </div>

    <!-- MEMBER DETAILS -->

    <div id="details" class="details">

      <h2>Member Details</h2>

      <div id="detailsContent"></div>

      <button
        class="close-details"
        type="button"
        onclick="closeDetails()"
      >
        CLOSE
      </button>

    </div>

    <!-- EDIT MEMBER -->

    <div id="editPanel" class="edit-panel">

      <h2>Edit Member</h2>

      <div class="edit-group">
        <label>Member ID</label>

        <input
          id="editMemberId"
          class="readonly"
          type="text"
          readonly
        >
      </div>

      <div class="edit-group">
        <label>Full Name</label>

        <input
          id="editFullName"
          type="text"
          placeholder="Enter Full Name"
        >
      </div>

      <div class="edit-group">
        <label>Date of Birth</label>

        <input
          id="editDob"
          type="date"
        >
      </div>

      <div class="edit-group">
        <label>Gender</label>

        <select id="editGender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="edit-group">
        <label>Phone / WhatsApp</label>

        <input
          id="editPhone"
          type="text"
          placeholder="Enter Phone / WhatsApp Number"
        >
      </div>

      <div class="edit-group">
        <label>Address</label>

        <textarea
          id="editAddress"
          placeholder="Enter Address"
        ></textarea>
      </div>

      <div class="edit-group">
        <label>Marital Status</label>

        <select id="editMarital">
          <option value="">Select Marital Status</option>
          <option value="Single">Single</option>
          <option value="Married">Married</option>
          <option value="Divorced">Divorced</option>
          <option value="Widowed">Widowed</option>
        </select>
      </div>

      <div class="edit-group">
        <label>Church Joining Date</label>

        <input
          id="editJoiningDate"
          type="date"
        >
      </div>

      <div class="edit-group">
        <label>Date of Salvation</label>

        <input
          id="editSalvationDate"
          type="date"
        >
      </div>

      <div class="edit-group">
        <label>Member Type</label>

        <select id="editMemberType">
          <option value="">Select Member Type</option>
          <option value="Pastor">Pastor</option>
          <option value="Brother">Brother</option>
          <option value="Sister">Sister</option>
        </select>
      </div>

      <div class="edit-group">
        <label>Additional Notes</label>

        <textarea
          id="editNotes"
          placeholder="Enter additional notes..."
        ></textarea>
      </div>

      <button
        class="save-edit"
        type="button"
        onclick="saveEdit()"
      >
        SAVE CHANGES
      </button>

      <button
        class="cancel-edit"
        type="button"
        onclick="closeEdit()"
      >
        CANCEL
      </button>

      <div id="editMessage"></div>

    </div>

    <div id="membersContainer">

      <div class="loading">
        Loading members...
      </div>

    </div>

    <button
      class="back-home"
      type="button"
      onclick="goHome()"
    >
      BACK TO HOME
    </button>

  </div>

  <script>

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    let allMembers = [];
    let editingMemberId = null;


    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {

        window.location.href = "index.html";

        return false;
      }

      return true;
    }


    async function loadMembers() {

      const container =
        document.getElementById("membersContainer");

      const count =
        document.getElementById("memberCount");

      container.innerHTML =
        '<div class="loading">Loading members...</div>';

      count.textContent =
        "Loading Members...";

      const loggedIn =
        await checkLogin();

      if (!loggedIn) {
        return;
      }

      const { data, error } =
        await supabaseClient
          .from("members")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (error) {

        console.error("LOAD ERROR:", error);

        container.innerHTML =
          '<div class="error">' +
          "Error: " +
          error.message +
          "</div>";

        count.textContent =
          "Unable to load members";

        return;
      }

      allMembers = data || [];

      displayMembers(allMembers);
    }


    function displayMembers(members) {

      const container =
        document.getElementById("membersContainer");

      const count =
        document.getElementById("memberCount");

      count.textContent =
        "Total Members: " + members.length;

      if (!members.length) {

        container.innerHTML =
          '<div class="empty">No members found.</div>';

        return;
      }

      container.innerHTML = "";

      members.forEach(function(member) {

        const card =
          document.createElement("div");

        card.className =
          "member-card";

        const id =
          member.member_id || "N/A";

        const name =
          member.full_name || "No Name";

        const type =
          member.member_type || "Not specified";

        const gender =
          member.gender || "Not specified";

        const phone =
          member.phone_whatsapp || "Not specified";

        card.innerHTML =

          '<div class="member-id">' +
          escapeHtml(id) +
          '</div>' +

          '<div class="member-name">' +
          escapeHtml(name) +
          '</div>' +

          '<div class="member-info">' +
          "Member Type: " +
          escapeHtml(type) +
          "<br>" +
          "Gender: " +
          escapeHtml(gender) +
          "<br>" +
          "Phone / WhatsApp: " +
          escapeHtml(phone) +
          "</div>" +

          '<button class="view-btn" type="button">' +
          "VIEW DETAILS" +
          "</button>" +

          '<button class="edit-btn" type="button">' +
          "✏️ EDIT MEMBER" +
          "</button>" +

          '<button class="delete-btn" type="button">' +
          "🗑️ DELETE MEMBER" +
          "</button>";

        card
          .querySelector(".view-btn")
          .addEventListener(
            "click",
            function() {
              showDetails(member);
            }
          );

        card
          .querySelector(".edit-btn")
          .addEventListener(
            "click",
            function() {
              openEdit(member);
            }
          );

        card
          .querySelector(".delete-btn")
          .addEventListener(
            "click",
            function() {
              deleteMember(member);
            }
          );

        container.appendChild(card);

      });

    }


    function searchMembers() {

      const search =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      if (!search) {

        displayMembers(allMembers);

        return;
      }

      const filtered =
        allMembers.filter(function(member) {

          const name =
            (member.full_name || "")
              .toLowerCase();

          const id =
            (member.member_id || "")
              .toLowerCase();

          return (
            name.includes(search) ||
            id.includes(search)
          );

        });

      displayMembers(filtered);

    }


    function showDetails(member) {

      const details =
        document.getElementById("details");

      const content =
        document.getElementById("detailsContent");

      content.innerHTML =

        detailRow("Member ID", member.member_id) +

        detailRow("Full Name", member.full_name) +

        detailRow(
          "Date of Birth",
          formatDate(member.date_of_birth)
        ) +

        detailRow("Gender", member.gender) +

        detailRow(
          "Phone / WhatsApp",
          member.phone_whatsapp
        ) +

        detailRow("Address", member.address) +

        detailRow(
          "Marital Status",
          member.marital_status
        ) +

        detailRow(
          "Church Joining Date",
          formatDate(member.church_joining_date)
        ) +

        detailRow(
          "Date of Salvation",
          formatDate(member.date_of_salvation)
        ) +

        detailRow(
          "Member Type",
          member.member_type
        ) +

        detailRow(
          "Additional Notes",
          member.additional_notes
        );

      details.style.display =
        "block";

      details.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    function detailRow(label, value) {

      return (

        '<div class="detail-row">' +

        '<span class="detail-label">' +
        escapeHtml(label) +
        '</span>' +

        '<span class="detail-value">' +
        escapeHtml(
          value || "Not provided"
        ) +
        '</span>' +

        '</div>'

      );

    }


    function openEdit(member) {

      editingMemberId =
        member.id;

      document.getElementById("editMemberId").value =
        member.member_id || "";

      document.getElementById("editFullName").value =
        member.full_name || "";

      document.getElementById("editDob").value =
        member.date_of_birth || "";

      document.getElementById("editGender").value =
        member.gender || "";

      document.getElementById("editPhone").value =
        member.phone_whatsapp || "";

      document.getElementById("editAddress").value =
        member.address || "";

      document.getElementById("editMarital").value =
        member.marital_status || "";

      document.getElementById("editJoiningDate").value =
        member.church_joining_date || "";

      document.getElementById("editSalvationDate").value =
        member.date_of_salvation || "";

      document.getElementById("editMemberType").value =
        member.member_type || "";

      document.getElementById("editNotes").value =
        member.additional_notes || "";

      document.getElementById("editMessage").textContent =
        "";

      document.getElementById("details").style.display =
        "none";

      document.getElementById("editPanel").style.display =
        "block";

      document.getElementById("editPanel").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    async function saveEdit() {

      if (!editingMemberId) {
        return;
      }

      const fullName =
        document
          .getElementById("editFullName")
          .value
          .trim();

      if (!fullName) {

        document.getElementById("editMessage").textContent =
          "Full Name is required.";

        return;
      }

      const editMessage =
        document.getElementById("editMessage");

      editMessage.textContent =
        "Saving changes...";

      const { error } =
        await supabaseClient
          .from("members")
          .update({

            full_name:
              fullName,

            date_of_birth:
              document.getElementById("editDob").value || null,

            gender:
              document.getElementById("editGender").value || null,

            phone_whatsapp:
              document.getElementById("editPhone").value.trim() || null,

            address:
              document.getElementById("editAddress").value.trim() || null,

            marital_status:
              document.getElementById("editMarital").value || null,

            church_joining_date:
              document.getElementById("editJoiningDate").value || null,

            date_of_salvation:
              document.getElementById("editSalvationDate").value || null,

            member_type:
              document.getElementById("editMemberType").value || null,

            additional_notes:
              document.getElementById("editNotes").value.trim() || null,

            updated_at:
              new Date().toISOString()

          })

          .eq("id", editingMemberId);


      if (error) {

        console.error("UPDATE ERROR:", error);

        editMessage.textContent =
          "Error: " + error.message;

        return;
      }

      editMessage.textContent =
        "Member Updated Successfully";

      editingMemberId =
        null;

      await loadMembers();

      setTimeout(function() {

        closeEdit();

      }, 700);

    }


    async function deleteMember(member) {

      const confirmed =
        confirm(
          "Are you sure you want to delete " +
          (member.full_name || "this member") +
          "?\n\nMember ID: " +
          (member.member_id || "N/A")
        );

      if (!confirmed) {
        return;
      }

      const { error } =
        await supabaseClient
          .from("members")
          .delete()
          .eq("id", member.id);

      if (error) {

        console.error("DELETE ERROR:", error);

        alert(
          "Unable to delete member.\n\n" +
          error.message
        );

        return;
      }

      alert(
        "Member Deleted Successfully"
      );

      closeDetails();
      closeEdit();

      await loadMembers();

    }


    function closeEdit() {

      document.getElementById("editPanel").style.display =
        "none";

      editingMemberId =
        null;

    }


    function formatDate(date) {

      if (!date) {
        return "Not provided";
      }

      const parts =
        date.split("-");

      if (parts.length === 3) {

        return (
          parts[2] +
          " / " +
          parts[1] +
          " / " +
          parts[0]
        );

      }

      return date;

    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function closeDetails() {

      document.getElementById("details").style.display =
        "none";

    }


    function goHome() {

      window.location.href =
        "home.html";

    }


    loadMembers();

  </script>

</body>
</html>
