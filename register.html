<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register New Member - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #c59b45;
      --secondary-color: #8b6f1d;
      --accent-color: #d4af37;
      --background-color: #f5f3ee;
      --card-color: #ffffff;
      --text-color: #222222;
      --button-text-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
    }

    .header {
      background: var(--primary-color);
      color: var(--button-text-color);
      padding: 20px;
      text-align: center;
    }

    .header img {
      max-width: 220px;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: var(--card-color);
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: var(--text-color);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: var(--text-color);
    }

    .required-star {
      color: #c00000;
      margin-left: 3px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: var(--card-color);
      color: var(--text-color);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(197,155,69,0.15);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[readonly] {
      background: var(--background-color);
      color: var(--secondary-color);
      font-weight: bold;
    }

    /* DATE INPUTS */

    .date-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 8px;
    }

    .date-inputs input {
      text-align: center;
    }

    .date-inputs input::placeholder {
      color: #888;
    }

    .date-help {
      font-size: 12px;
      color: var(--secondary-color);
      margin-top: 6px;
    }

    /* PHOTO */

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .photo-buttons button {
      flex: 1;
      width: auto;
      margin-top: 0;
      background: var(--secondary-color);
    }

    .photo-buttons button:hover {
      background: var(--accent-color);
    }

    .photo-preview {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ccc;
      display: none;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: var(--primary-color);
      color: var(--button-text-color);
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--accent-color);
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      background: var(--secondary-color);
      margin-bottom: 15px;
    }

    .back-btn:hover {
      background: var(--accent-color);
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: bold;
      white-space: pre-line;
    }

    .success {
      background: #dff3e7;
      color: #176b3a;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
    }

    .hidden-file {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: var(--secondary-color);
    }

    .loading-spinner {
      display: inline-block;
      margin-right: 7px;
    }

    .empty-form {
      text-align: center;
      padding: 25px;
      color: var(--secondary-color);
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .date-inputs {
        grid-template-columns: 1fr 1fr 1.4fr;
      }

      .photo-buttons {
        flex-direction: column;
      }

    }

  </style>
</head>

<body>

  <div class="header">

    <img
      id="headerLogo"
      src=""
      alt="COC Members Logo"
      style="display:none;"
    >

    <h1 id="headerAppName">
      COC Members
    </h1>

    <p id="headerChurchName">
      Church Of Christ Sri Lanka
    </p>

    <p id="headerSubtitle">
      Members Registration
    </p>

  </div>


  <div class="container">

    <button
      type="button"
      class="back-btn"
      onclick="window.location.href='home.html'"
    >
      ← Back to Dashboard
    </button>


    <div class="card">

      <h2 id="formTitle">
        Register New Member
      </h2>


      <form
        id="memberForm"
        style="display:none;"
      >

        <div id="dynamicFieldsContainer"></div>


        <button
          type="submit"
          id="saveButton"
        >
          SAVE MEMBER
        </button>

      </form>


      <div
        id="loadingForm"
        class="loading"
      >
        <span class="loading-spinner">⏳</span>
        Loading registration form...
      </div>


      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     DEFAULT THEME
  ========================================================= */

  const DEFAULT_THEME = {

    primary_color:
      "#c59b45",

    secondary_color:
      "#8b6f1d",

    accent_color:
      "#d4af37",

    background_color:
      "#f5f3ee",

    card_color:
      "#ffffff",

    text_color:
      "#222222",

    button_text_color:
      "#ffffff"

  };


  /* =========================================================
     GLOBAL VARIABLES
  ========================================================= */

  let currentUser = null;

  let formFields = [];

  let appConfig = [];

  let selectedPhotoFile = null;


  /* =========================================================
     DOM ELEMENTS
  ========================================================= */

  const form =
    document.getElementById(
      "memberForm"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  const loadingForm =
    document.getElementById(
      "loadingForm"
    );


  const dynamicFieldsContainer =
    document.getElementById(
      "dynamicFieldsContainer"
    );


  /* =========================================================
     APPLY THEME
  ========================================================= */

  function applyTheme(theme) {

    const root =
      document.documentElement;


    root.style.setProperty(
      "--primary-color",
      theme.primary_color
    );


    root.style.setProperty(
      "--secondary-color",
      theme.secondary_color
    );


    root.style.setProperty(
      "--accent-color",
      theme.accent_color
    );


    root.style.setProperty(
      "--background-color",
      theme.background_color
    );


    root.style.setProperty(
      "--card-color",
      theme.card_color
    );


    root.style.setProperty(
      "--text-color",
      theme.text_color
    );


    root.style.setProperty(
      "--button-text-color",
      theme.button_text_color
    );


    console.log(
      "REGISTER THEME APPLIED:",
      theme
    );

  }


  /* =========================================================
     LOAD COLOUR SETTINGS
  ========================================================= */

  async function loadThemeSettings() {

    let finalTheme = {
      ...DEFAULT_THEME
    };


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("app_settings")
          .select(
            `
              primary_color,
              secondary_color,
              accent_color,
              background_color,
              card_color,
              text_color,
              button_text_color
            `
          )
          .limit(1)
          .maybeSingle();


      if (error) {

        console.error(
          "Theme Settings Error:",
          error
        );


        applyTheme(
          finalTheme
        );


        return;

      }


      if (data) {

        if (data.primary_color) {

          finalTheme.primary_color =
            data.primary_color;

        }


        if (data.secondary_color) {

          finalTheme.secondary_color =
            data.secondary_color;

        }


        if (data.accent_color) {

          finalTheme.accent_color =
            data.accent_color;

        }


        if (data.background_color) {

          finalTheme.background_color =
            data.background_color;

        }


        if (data.card_color) {

          finalTheme.card_color =
            data.card_color;

        }


        if (data.text_color) {

          finalTheme.text_color =
            data.text_color;

        }


        if (data.button_text_color) {

          finalTheme.button_text_color =
            data.button_text_color;

        }

      }


    } catch (error) {

      console.error(
        "Theme Loading Exception:",
        error
      );

    }


    applyTheme(
      finalTheme
    );

  }


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }


  function clearMessage() {

    message.textContent =
      "";

    message.className =
      "message";

    message.style.display =
      "none";

  }


  /* =========================================================
     ESCAPE HTML
  ========================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================================================
     GET CURRENT USER
  ========================================================= */

  async function getCurrentUser() {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    currentUser =
      data.user;


    return data.user;

  }


  /* =========================================================
     LOAD APP SETTINGS
  ========================================================= */

  async function loadAppSettings() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_settings")
        .select(
          "app_name, church_name, subtitle, logo_url"
        )
        .limit(1)
        .maybeSingle();


    if (error) {

      console.error(
        "App Settings Error:",
        error
      );

      return;

    }


    if (!data) return;


    document.getElementById(
      "headerAppName"
    ).textContent =
      data.app_name ||
      "COC Members";


    document.getElementById(
      "headerChurchName"
    ).textContent =
      data.church_name ||
      "Church Of Christ Sri Lanka";


    document.getElementById(
      "headerSubtitle"
    ).textContent =
      data.subtitle ||
      "Members Registration";


    if (data.logo_url) {

      const logo =
        document.getElementById(
          "headerLogo"
        );


      logo.onload =
        function() {

          logo.style.display =
            "inline-block";

        };


      logo.onerror =
        function() {

          logo.style.display =
            "none";

        };


      const separator =
        data.logo_url.includes("?")
          ? "&"
          : "?";


      logo.src =
        data.logo_url +
        separator +
        "v=" +
        Date.now();

    }

  }


  /* =========================================================
     LOAD APP CONFIG
  ========================================================= */

  async function loadAppConfig() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("app_config")
        .select(
          "setting_key, setting_value, setting_type, is_active"
        );


    if (error) {

      console.error(
        "App Config Error:",
        error
      );

      return;

    }


    appConfig =
      data || [];

  }


  /* =========================================================
     GET APP CONFIG VALUE
  ========================================================= */

  function getConfigValue(
    key,
    defaultValue = ""
  ) {

    const item =
      appConfig.find(
        config =>
          config.setting_key === key &&
          config.is_active === true
      );


    if (!item) {

      return defaultValue;

    }


    return item.setting_value ??
      defaultValue;

  }


  /* =========================================================
     LOAD FORM FIELDS
  ========================================================= */

  async function loadFormFields() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("form_fields")
        .select(`
          id,
          field_key,
          field_label,
          field_type,
          is_visible,
          is_required,
          display_order,
          options
        `)
        .order(
          "display_order",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Form Fields Error:",
        error
      );

      throw new Error(
        "Failed to load registration form settings: " +
        error.message
      );

    }


    formFields =
      data || [];


    renderDynamicForm();

  }


  /* =========================================================
     RENDER DYNAMIC FORM
  ========================================================= */

  function renderDynamicForm() {

    dynamicFieldsContainer.innerHTML =
      "";


    const visibleFields =
      formFields
        .filter(
          field =>
            field.is_visible === true ||
            field.field_type === "automatic"
        )
        .sort(
          (a, b) =>
            Number(a.display_order) -
            Number(b.display_order)
        );


    if (!visibleFields.length) {

      dynamicFieldsContainer.innerHTML = `
        <div class="empty-form">
          No registration fields are currently enabled.
        </div>
      `;

      form.style.display =
        "block";

      loadingForm.style.display =
        "none";

      return;

    }


    visibleFields.forEach(
      field => {

        const element =
          createFieldElement(
            field
          );


        if (element) {

          dynamicFieldsContainer
            .appendChild(
              element
            );

        }

      }
    );


    form.style.display =
      "block";

    loadingForm.style.display =
      "none";


    initializePhotoInputs();

  }


  /* =========================================================
     CREATE FIELD ELEMENT
  ========================================================= */

  function createFieldElement(
    field
  ) {

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "field";


    wrapper.dataset.fieldKey =
      field.field_key;


    const label =
      escapeHtml(
        field.field_label
      );


    const required =
      field.is_required === true;


    const requiredMark =
      required
        ? '<span class="required-star">*</span>'
        : "";


    /* -------------------------------------------------------
       MEMBER ID
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "member_id"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
        </label>

        <input
          type="text"
          id="memberId"
          placeholder="Automatic"
          readonly
        >

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       MEMBER TYPE
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "member_type"
    ) {

      wrapper.innerHTML = `

        <label for="memberType">
          ${label}
          ${requiredMark}
        </label>

        <select
          id="memberType"
          ${required ? "required" : ""}
        >
          ${createOptions(
            field.options,
            "Select..."
          )}
        </select>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       FULL NAME
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "full_name"
    ) {

      wrapper.innerHTML = `

        <label for="fullName">
          ${label}
          ${requiredMark}
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter ${escapeHtml(field.field_label)}"
          ${required ? "required" : ""}
        >

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       NIC NUMBER
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "nic_number"
    ) {

      wrapper.innerHTML = `

        <label for="nicNumber">
          ${label}
          ${requiredMark}
        </label>

        <input
          type="text"
          id="nicNumber"
          placeholder="Enter ${escapeHtml(field.field_label)}"
          ${required ? "required" : ""}
        >

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       DATE OF BIRTH
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "date_of_birth"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
          ${requiredMark}
        </label>

        <div class="date-inputs">

          <input
            type="text"
            id="dobDay"
            placeholder="DD"
            inputmode="numeric"
            maxlength="2"
            ${required ? "required" : ""}
          >

          <input
            type="text"
            id="dobMonth"
            placeholder="MM"
            inputmode="numeric"
            maxlength="2"
            ${required ? "required" : ""}
          >

          <input
            type="text"
            id="dobYear"
            placeholder="YYYY"
            inputmode="numeric"
            maxlength="4"
            ${required ? "required" : ""}
          >

        </div>

        <div class="date-help">
          Enter as DD / MM / YYYY
        </div>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       GENDER
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "gender"
    ) {

      wrapper.innerHTML = `

        <label for="gender">
          ${label}
          ${requiredMark}
        </label>

        <select
          id="gender"
          ${required ? "required" : ""}
        >
          ${createOptions(
            field.options,
            "Select..."
          )}
        </select>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       PHONE / WHATSAPP
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "phone_whatsapp"
    ) {

      wrapper.innerHTML = `

        <label for="phoneWhatsapp">
          ${label}
          ${requiredMark}
        </label>

        <input
          type="tel"
          id="phoneWhatsapp"
          placeholder="Enter ${escapeHtml(field.field_label)}"
          ${required ? "required" : ""}
        >

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       ADDRESS
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "address"
    ) {

      wrapper.innerHTML = `

        <label for="address">
          ${label}
          ${requiredMark}
        </label>

        <textarea
          id="address"
          placeholder="Enter ${escapeHtml(field.field_label)}"
          ${required ? "required" : ""}
        ></textarea>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       MARITAL STATUS
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "marital_status"
    ) {

      wrapper.innerHTML = `

        <label for="maritalStatus">
          ${label}
          ${requiredMark}
        </label>

        <select
          id="maritalStatus"
          ${required ? "required" : ""}
        >
          ${createOptions(
            field.options,
            "Select..."
          )}
        </select>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       DATE OF SALVATION
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "date_of_salvation"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
          ${requiredMark}
        </label>

        <div class="date-inputs">

          <input
            type="text"
            id="salvationDay"
            placeholder="DD"
            inputmode="numeric"
            maxlength="2"
            ${required ? "required" : ""}
          >

          <input
            type="text"
            id="salvationMonth"
            placeholder="MM"
            inputmode="numeric"
            maxlength="2"
            ${required ? "required" : ""}
          >

          <input
            type="text"
            id="salvationYear"
            placeholder="YYYY"
            inputmode="numeric"
            maxlength="4"
            ${required ? "required" : ""}
          >

        </div>

        <div class="date-help">
          Enter as DD / MM / YYYY
        </div>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       MEMBER PHOTO
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "member_photo"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
          ${requiredMark}
        </label>

        <div class="photo-buttons">

          <button
            type="button"
            onclick="openCamera()"
          >
            📷 Take Photo
          </button>

          <button
            type="button"
            onclick="openGallery()"
          >
            🖼️ Gallery
          </button>

        </div>


        <input
          type="file"
          id="cameraInput"
          class="hidden-file"
          accept="image/*"
          capture="environment"
          ${required ? "required" : ""}
        >


        <input
          type="file"
          id="galleryInput"
          class="hidden-file"
          accept="image/*"
        >


        <img
          id="photoPreview"
          class="photo-preview"
          alt="Member Photo Preview"
        >

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       ADDITIONAL NOTES
    ------------------------------------------------------- */

    if (
      field.field_key ===
      "additional_notes"
    ) {

      wrapper.innerHTML = `

        <label for="additionalNotes">
          ${label}
          ${requiredMark}
        </label>

        <textarea
          id="additionalNotes"
          placeholder="Enter additional notes..."
          ${required ? "required" : ""}
        ></textarea>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       FALLBACK TEXTAREA
    ------------------------------------------------------- */

    if (
      field.field_type ===
      "textarea"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
          ${requiredMark}
        </label>

        <textarea
          id="${escapeHtml(field.field_key)}"
          ${required ? "required" : ""}
        ></textarea>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       FALLBACK SELECT
    ------------------------------------------------------- */

    if (
      field.field_type ===
      "select"
    ) {

      wrapper.innerHTML = `

        <label>
          ${label}
          ${requiredMark}
        </label>

        <select
          id="${escapeHtml(field.field_key)}"
          ${required ? "required" : ""}
        >
          ${createOptions(
            field.options,
            "Select..."
          )}
        </select>

      `;


      return wrapper;

    }


    /* -------------------------------------------------------
       FALLBACK INPUT
    ------------------------------------------------------- */

    wrapper.innerHTML = `

      <label>
        ${label}
        ${requiredMark}
      </label>

      <input
        type="text"
        id="${escapeHtml(field.field_key)}"
        ${required ? "required" : ""}
      >

    `;


    return wrapper;

  }


  /* =========================================================
     CREATE DROPDOWN OPTIONS
  ========================================================= */

  function createOptions(
    options,
    placeholder
  ) {

    let html = `
      <option value="">
        ${escapeHtml(placeholder)}
      </option>
    `;


    if (
      Array.isArray(options)
    ) {

      options.forEach(
        option => {

          const value =
            String(
              option
            );


          html += `
            <option value="${escapeHtml(value)}">
              ${escapeHtml(value)}
            </option>
          `;

        }
      );

    }


    return html;

  }


  /* =========================================================
     PHOTO INPUTS
  ========================================================= */

  function initializePhotoInputs() {

    const cameraInput =
      document.getElementById(
        "cameraInput"
      );


    const galleryInput =
      document.getElementById(
        "galleryInput"
      );


    if (cameraInput) {

      cameraInput.addEventListener(
        "change",
        function() {

          if (
            this.files &&
            this.files[0]
          ) {

            showPhoto(
              this.files[0]
            );

          }

        }
      );

    }


    if (galleryInput) {

      galleryInput.addEventListener(
        "change",
        function() {

          if (
            this.files &&
            this.files[0]
          ) {

            showPhoto(
              this.files[0]
            );

          }

        }
      );

    }

  }


  /* =========================================================
     OPEN CAMERA
  ========================================================= */

  function openCamera() {

    const input =
      document.getElementById(
        "cameraInput"
      );


    if (input) {

      input.click();

    }

  }


  /* =========================================================
     OPEN GALLERY
  ========================================================= */

  function openGallery() {

    const input =
      document.getElementById(
        "galleryInput"
      );


    if (input) {

      input.click();

    }

  /* =========================================================
     SHOW PHOTO
  ========================================================= */

  function showPhoto(
    file
  ) {

    if (!file) return;


    selectedPhotoFile =
      file;


    const preview =
      document.getElementById(
        "photoPreview"
      );


    if (!preview) return;


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        preview.src =
          event.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(
      file
    );

  }


  /* =========================================================
     DATE VALIDATION
  ========================================================= */

  function getDateFromInputs(
    dayId,
    monthId,
    yearId,
    fieldName,
    isRequired = false
  ) {

    const dayElement =
      document.getElementById(
        dayId
      );


    const monthElement =
      document.getElementById(
        monthId
      );


    const yearElement =
      document.getElementById(
        yearId
      );


    if (
      !dayElement ||
      !monthElement ||
      !yearElement
    ) {

      return null;

    }


    const day =
      dayElement.value.trim();


    const month =
      monthElement.value.trim();


    const year =
      yearElement.value.trim();


    if (
      day === "" &&
      month === "" &&
      year === ""
    ) {

      if (isRequired) {

        throw new Error(
          fieldName +
          ": Please enter DD, MM and YYYY."
        );

      }


      return null;

    }


    if (
      day === "" ||
      month === "" ||
      year === ""
    ) {

      throw new Error(
        fieldName +
        ": Please enter DD, MM and YYYY."
      );

    }


    const dayNumber =
      Number(day);


    const monthNumber =
      Number(month);


    const yearNumber =
      Number(year);


    if (
      !Number.isInteger(dayNumber) ||
      !Number.isInteger(monthNumber) ||
      !Number.isInteger(yearNumber)
    ) {

      throw new Error(
        fieldName +
        ": Please enter numbers only."
      );

    }


    if (
      monthNumber < 1 ||
      monthNumber > 12
    ) {

      throw new Error(
        fieldName +
        ": Month must be between 01 and 12."
      );

    }


    if (
      dayNumber < 1 ||
      dayNumber > 31
    ) {

      throw new Error(
        fieldName +
        ": Day must be between 01 and 31."
      );

    }


    if (
      yearNumber < 1000 ||
      yearNumber > 9999
    ) {

      throw new Error(
        fieldName +
        ": Please enter a valid 4-digit year."
      );

    }


    const testDate =
      new Date(
        yearNumber,
        monthNumber - 1,
        dayNumber
      );


    if (
      testDate.getFullYear() !==
        yearNumber ||
      testDate.getMonth() !==
        monthNumber - 1 ||
      testDate.getDate() !==
        dayNumber
    ) {

      throw new Error(
        fieldName +
        ": Invalid date."
      );

    }


    return (
      String(yearNumber) +
      "-" +
      String(monthNumber)
        .padStart(2, "0") +
      "-" +
      String(dayNumber)
        .padStart(2, "0")
    );

  }


  /* =========================================================
     UPLOAD MEMBER PHOTO
  ========================================================= */

  async function uploadMemberPhoto(
    user,
    file
  ) {

    if (!file) {

      return null;

    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      throw new Error(
        "Please select an image file."
      );

    }


    if (
      file.size >
      5 * 1024 * 1024
    ) {

      throw new Error(
        "Photo is too large. Please select a photo smaller than 5 MB."
      );

    }


    let extension =
      "jpg";


    if (
      file.type ===
      "image/png"
    ) {

      extension =
        "png";

    }

    else if (
      file.type ===
      "image/webp"
    ) {

      extension =
        "webp";

    }

    else if (
      file.type ===
      "image/jpeg"
    ) {

      extension =
        "jpg";

    }


    const filePath =
      user.id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from("member-photos")
        .upload(
          filePath,
          file,
          {
            cacheControl:
              "3600",
            upsert:
              false,
            contentType:
              file.type
          }
        );


    if (error) {

      console.error(
        "Photo Upload Error:",
        error
      );

      throw new Error(
        "Photo upload failed: " +
        error.message
      );

    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from("member-photos")
        .getPublicUrl(
          filePath
        );


    if (
      !data ||
      !data.publicUrl
    ) {

      throw new Error(
        "Could not create photo URL."
      );

    }


    return {

      path:
        filePath,

      url:
        data.publicUrl

    };

  }


  /* =========================================================
     GET FIELD
  ========================================================= */

  function getField(
    key
  ) {

    return formFields.find(
      field =>
        field.field_key === key
    );

  }


  /* =========================================================
     GET FIELD REQUIRED
  ========================================================= */

  function isFieldRequired(
    key
  ) {

    const field =
      getField(key);


    return !!(
      field &&
      field.is_required === true
    );

  }


  /* =========================================================
     GET FIELD VALUE
  ========================================================= */

  function getInputValue(
    id
  ) {

    const element =
      document.getElementById(
        id
      );


    if (!element) {

      return "";

    }


    return element.value.trim();

  }


  /* =========================================================
     FORM SUBMIT
  ========================================================= */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      clearMessage();


      saveButton.disabled =
        true;


      saveButton.textContent =
        "SAVING...";


      let uploadedPhoto =
        null;


      try {

        const user =
          await getCurrentUser();


        if (!user) {

          return;

        }


        /* -----------------------------------------------
           GET VALUES
        ------------------------------------------------ */

        const memberType =
          getInputValue(
            "memberType"
          );


        const fullName =
          getInputValue(
            "fullName"
          );


        const nicNumber =
          getInputValue(
            "nicNumber"
          );


        const gender =
          getInputValue(
            "gender"
          );


        const phoneWhatsapp =
          getInputValue(
            "phoneWhatsapp"
          );


        const address =
          getInputValue(
            "address"
          );


        const maritalStatus =
          getInputValue(
            "maritalStatus"
          );


        const additionalNotes =
          getInputValue(
            "additionalNotes"
          );


        /* -----------------------------------------------
           DATES
        ------------------------------------------------ */

        const dateOfBirth =
          getDateFromInputs(
            "dobDay",
            "dobMonth",
            "dobYear",
            "Date of Birth",
            isFieldRequired(
              "date_of_birth"
            )
          );


        const dateOfSalvation =
          getDateFromInputs(
            "salvationDay",
            "salvationMonth",
            "salvationYear",
            "Date of Salvation",
            isFieldRequired(
              "date_of_salvation"
            )
          );


        /* -----------------------------------------------
           PHOTO
        ------------------------------------------------ */

        const photoField =
          getField(
            "member_photo"
          );


        const photoRequired =
          !!(
            photoField &&
            photoField.is_required === true
          );


        if (
          photoRequired &&
          !selectedPhotoFile
        ) {

          throw new Error(
            "Member Photo: Please select a photo."
          );

        }


        if (selectedPhotoFile) {

          saveButton.textContent =
            "UPLOADING PHOTO...";


          uploadedPhoto =
            await uploadMemberPhoto(
              user,
              selectedPhotoFile
            );

        }


        /* -----------------------------------------------
           MEMBER DATA
        ------------------------------------------------ */

        const memberData = {

          /*
            Member ID is automatically
            generated by the database.
          */

          member_type:
            memberType || null,

          full_name:
            fullName || null,

          nic_number:
            nicNumber || null,

          date_of_birth:
            dateOfBirth,

          gender:
            gender || null,

          phone_whatsapp:
            phoneWhatsapp || null,

          address:
            address || null,

          marital_status:
            maritalStatus || null,

          date_of_salvation:
            dateOfSalvation,

          photo_url:
            uploadedPhoto
              ? uploadedPhoto.url
              : null,

          additional_notes:
            additionalNotes || null,

          created_by:
            user.id

        };


        /* -----------------------------------------------
           INSERT MEMBER
        ------------------------------------------------ */

        saveButton.textContent =
          "SAVING MEMBER...";


        const {
          data,
          error
        } =
          await supabaseClient
            .from("members")
            .insert(
              memberData
            )
            .select()
            .single();


        if (error) {

          console.error(
            "Database Error:",
            error
          );


          if (uploadedPhoto) {

            await supabaseClient
              .storage
              .from("member-photos")
              .remove([
                uploadedPhoto.path
              ]);

          }


          throw error;

        }


        /* -----------------------------------------------
           SUCCESS
        ------------------------------------------------ */

        showMessage(
          "Member Registered Successfully\n" +
          "Member ID: " +
          data.member_id,
          "success"
        );


        form.reset();


        selectedPhotoFile =
          null;


        const photoPreview =
          document.getElementById(
            "photoPreview"
          );


        if (photoPreview) {

          photoPreview.src =
            "";

          photoPreview.style.display =
            "none";

        }


        const memberIdInput =
          document.getElementById(
            "memberId"
          );


        if (memberIdInput) {

          memberIdInput.value =
            data.member_id || "";

        }


      } catch (error) {

        console.error(
          "Registration Error:",
          error
        );


        showMessage(
          "Error: " +
          error.message,
          "error"
        );


      } finally {

        saveButton.disabled =
          false;


        saveButton.textContent =
          "SAVE MEMBER";

      }

    }
  );


  /* =========================================================
     INITIALIZE
  ========================================================= */

  async function initialize() {

    try {

      /*
        Load theme first so the page
        immediately uses saved colours.
      */

      await loadThemeSettings();


      const user =
        await getCurrentUser();


      if (!user) {

        return;

      }


      await loadAppSettings();


      await loadAppConfig();


      await loadFormFields();


    } catch (error) {

      console.error(
        "Initialization Error:",
        error
      );


      loadingForm.style.display =
        "none";


      showMessage(
        error.message,
        "error"
      );

    }

  }


  initialize();

</script>
