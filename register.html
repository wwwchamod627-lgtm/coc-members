<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Member - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[readonly] {
      background: #eee;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .photo-buttons button {
      flex: 1;
      width: auto;
      background: #174d3c;
    }

    .photo-preview {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ccc;
      display: none;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #174d3c;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      background: #777;
      margin-bottom: 15px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #dff3e7;
      color: #176b3a;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
    }

    .hidden-file {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">

    <button class="back-btn" onclick="window.location.href='home.html'">
      ← Back to Dashboard
    </button>

    <div class="card">

      <h2>Register New Member</h2>

      <form id="memberForm">

        <!-- 1. Member ID -->
        <div class="field">
          <label>Member ID</label>
          <input
            type="text"
            id="memberId"
            placeholder="Automatic"
            readonly
          >
        </div>

        <!-- 2. Member Type -->
        <div class="field">
          <label>Member Type</label>
          <select id="memberType" required>
            <option value="">Select...</option>
            <option value="Pastor">Pastor</option>
            <option value="Brother">Brother</option>
            <option value="Sister">Sister</option>
          </select>
        </div>

        <!-- 3. Full Name -->
        <div class="field">
          <label>Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter Full Name"
            required
          >
        </div>

        <!-- 4. NIC Number -->
        <div class="field">
          <label>NIC Number</label>
          <input
            type="text"
            id="nicNumber"
            placeholder="Enter NIC Number (Optional)"
          >
        </div>

        <!-- 5. Date of Birth -->
        <div class="field">
          <label>Date of Birth</label>
          <input
            type="date"
            id="dateOfBirth"
          >
        </div>

        <!-- 6. Gender -->
        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <!-- 7. Phone / WhatsApp -->
        <div class="field">
          <label>Phone / WhatsApp</label>
          <input
            type="tel"
            id="phoneWhatsapp"
            placeholder="Enter Phone / WhatsApp Number"
          >
        </div>

        <!-- 8. Address -->
        <div class="field">
          <label>Address</label>
          <textarea
            id="address"
            placeholder="Enter Address"
          ></textarea>
        </div>

        <!-- 9. Marital Status -->
        <div class="field">
          <label>Marital Status</label>
          <select id="maritalStatus">
            <option value="">Select...</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
        </div>

        <!-- 10. Date of Salvation -->
        <div class="field">
          <label>Date of Salvation</label>
          <input
            type="date"
            id="dateOfSalvation"
          >
        </div>

        <!-- 11. Member Photo -->
        <div class="field">
          <label>Member Photo</label>

          <div class="photo-buttons">

            <button type="button" onclick="openCamera()">
              📷 Take Photo
            </button>

            <button type="button" onclick="openGallery()">
              🖼️ Gallery
            </button>

          </div>

          <input
            type="file"
            id="cameraInput"
            class="hidden-file"
            accept="image/*"
            capture="environment"
          >

          <input
            type="file"
            id="galleryInput"
            class="hidden-file"
            accept="image/*"
          >

          <img
            id="photoPreview"
            class="photo-preview"
            alt="Member Photo Preview"
          >
        </div>

        <!-- 12. Additional Notes -->
        <div class="field">
          <label>Additional Notes</label>
          <textarea
            id="additionalNotes"
            placeholder="Enter additional notes..."
          ></textarea>
        </div>

        <button type="submit" id="saveButton">
          SAVE MEMBER
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>
  </div>

<script>

  const SUPABASE_URL =
    "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  const form =
    document.getElementById("memberForm");

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");

  const cameraInput =
    document.getElementById("cameraInput");

  const galleryInput =
    document.getElementById("galleryInput");

  const photoPreview =
    document.getElementById("photoPreview");


  function openCamera() {
    cameraInput.click();
  }


  function openGallery() {
    galleryInput.click();
  }


  function showPhoto(file) {

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

      photoPreview.src =
        event.target.result;

      photoPreview.style.display =
        "block";

    };

    reader.readAsDataURL(file);
  }


  cameraInput.addEventListener(
    "change",
    function() {

      if (this.files &&
          this.files[0]) {

        showPhoto(this.files[0]);

      }

    }
  );


  galleryInput.addEventListener(
    "change",
    function() {

      if (this.files &&
          this.files[0]) {

        showPhoto(this.files[0]);

      }

    }
  );


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }


  function clearMessage() {

    message.textContent = "";

    message.style.display =
      "none";

  }


  async function getCurrentUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {

      window.location.href =
        "index.html";

      return null;

    }

    return data.user;

  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();

      saveButton.disabled = true;

      saveButton.textContent =
        "SAVING...";


      try {

        const user =
          await getCurrentUser();

        if (!user) return;


        const memberType =
          document.getElementById(
            "memberType"
          ).value;

        const fullName =
          document.getElementById(
            "fullName"
          ).value.trim();

        const nicNumber =
          document.getElementById(
            "nicNumber"
          ).value.trim();

        const dateOfBirth =
          document.getElementById(
            "dateOfBirth"
          ).value || null;

        const gender =
          document.getElementById(
            "gender"
          ).value;

        const phoneWhatsapp =
          document.getElementById(
            "phoneWhatsapp"
          ).value.trim();

        const address =
          document.getElementById(
            "address"
          ).value.trim();

        const maritalStatus =
          document.getElementById(
            "maritalStatus"
          ).value;

        const dateOfSalvation =
          document.getElementById(
            "dateOfSalvation"
          ).value || null;

        const additionalNotes =
          document.getElementById(
            "additionalNotes"
          ).value.trim();


        const memberData = {

          member_id: undefined,

          member_type:
            memberType,

          full_name:
            fullName,

          nic_number:
            nicNumber || null,

          date_of_birth:
            dateOfBirth,

          gender:
            gender,

          phone_whatsapp:
            phoneWhatsapp,

          address:
            address,

          marital_status:
            maritalStatus,

          date_of_salvation:
            dateOfSalvation,

          additional_notes:
            additionalNotes,

          created_by:
            user.id

        };


        const {
          data,
          error
        } =
          await supabaseClient
            .from("members")
            .insert(memberData)
            .select()
            .single();


        if (error) {

          console.error(error);

          throw error;

        }


        showMessage(
          "Member Registered Successfully\nMember ID: " +
          data.member_id,
          "success"
        );


        form.reset();

        photoPreview.src = "";

        photoPreview.style.display =
          "none";


        document.getElementById(
          "memberId"
        ).value =
          data.member_id;


      } catch (error) {

        console.error(
          "Registration Error:",
          error
        );

        showMessage(
          "Error: " +
          error.message,
          "error"
        );

      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "SAVE MEMBER";

      }

    }
  );


  getCurrentUser();

</script>

</body>
</html>
