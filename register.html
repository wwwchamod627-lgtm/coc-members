<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Member - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e8;
      font-family: Arial, sans-serif;
      color: #183b2b;
    }

    .header {
      background: #183b2b;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 27px;
    }

    .header p {
      margin: 4px 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
      color: #333;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #183b2b;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .member-id {
      background: #eeeeee;
      color: #555;
      font-weight: bold;
    }

    .photo-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .photo-buttons button {
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #e8eee9;
      color: #183b2b;
      font-weight: bold;
      cursor: pointer;
    }

    #photoInput {
      display: none;
    }

    #photoPreview {
      display: none;
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin: 15px auto 0;
      border: 2px solid #183b2b;
    }

    .save-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #183b2b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #777;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 24px;
    }

    .success {
      color: #187a3b;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">✔️</div>
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">
    <div class="card">

      <h2>Register New Member</h2>

      <label for="memberId">Member ID</label>
      <input
        id="memberId"
        class="member-id"
        type="text"
        value="Automatic"
        readonly
      >

      <label for="fullName">Full Name</label>
      <input
        id="fullName"
        type="text"
        placeholder="Enter Full Name"
      >

      <label for="dateOfBirth">Date of Birth</label>
      <input
        id="dateOfBirth"
        type="date"
      >

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="phone">Phone / WhatsApp</label>
      <input
        id="phone"
        type="tel"
        placeholder="Enter Phone / WhatsApp Number"
      >

      <label for="address">Address</label>
      <input
        id="address"
        type="text"
        placeholder="Enter Address"
      >

      <label for="maritalStatus">Marital Status</label>
      <select id="maritalStatus">
        <option value="">Select Marital Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Divorced">Divorced</option>
        <option value="Widowed">Widowed</option>
      </select>

      <label for="churchJoiningDate">Church Joining Date</label>
      <input
        id="churchJoiningDate"
        type="date"
      >

      <label for="dateOfSalvation">Date of Salvation</label>
      <input
        id="dateOfSalvation"
        type="date"
      >

      <label for="memberType">Member Type</label>
      <select id="memberType">
        <option value="">Select Member Type</option>
        <option value="Pastor">Pastor</option>
        <option value="Brother">Brother</option>
        <option value="Sister">Sister</option>
      </select>

      <label>Member Photo</label>

      <div class="photo-buttons">
        <button type="button" onclick="takePhoto()">
          📷 Take Photo
        </button>

        <button type="button" onclick="choosePhoto()">
          🖼️ Choose from Gallery
        </button>
      </div>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <img
        id="photoPreview"
        alt="Member Photo Preview"
      >

      <label for="additionalNotes">Additional Notes</label>

      <textarea
        id="additionalNotes"
        placeholder="Enter additional notes..."
      ></textarea>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
        onclick="saveMember()"
      >
        SAVE MEMBER
      </button>

      <button
        class="back-btn"
        type="button"
        onclick="goBack()"
      >
        BACK TO HOME
      </button>

      <div id="message"></div>

    </div>
  </div>


  <script>

    const SUPABASE_URL =
      "https://djxpqggcpaofkpvcqgvd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        window.location.href = "index.html";
        return;
      }
    }


    function choosePhoto() {

      const input =
        document.getElementById("photoInput");

      input.removeAttribute("capture");
      input.click();
    }


    function takePhoto() {

      const input =
        document.getElementById("photoInput");

      input.setAttribute("capture", "environment");
      input.click();
    }


    document
      .getElementById("photoInput")
      .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) {
          return;
        }

        const preview =
          document.getElementById("photoPreview");

        preview.src =
          URL.createObjectURL(file);

        preview.style.display = "block";
      });


    async function saveMember() {

      const saveBtn =
        document.getElementById("saveBtn");

      const message =
        document.getElementById("message");


      message.textContent = "";
      message.className = "";


      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();


      if (sessionError || !sessionData.session) {

        message.textContent =
          "Your session has expired. Please login again.";

        message.className = "error";

        return;
      }


      const fullName =
        document.getElementById("fullName").value.trim();

      const dateOfBirth =
        document.getElementById("dateOfBirth").value;

      const gender =
        document.getElementById("gender").value;

      const phone =
        document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();

      const maritalStatus =
        document.getElementById("maritalStatus").value;

      const churchJoiningDate =
        document.getElementById("churchJoiningDate").value;

      const dateOfSalvation =
        document.getElementById("dateOfSalvation").value;

      const memberType =
        document.getElementById("memberType").value;

      const additionalNotes =
        document.getElementById("additionalNotes").value.trim();


      if (!fullName) {

        message.textContent =
          "Please enter the Full Name.";

        message.className = "error";

        return;
      }


      saveBtn.disabled = true;
      saveBtn.textContent = "SAVING...";


      const { data, error } =
        await supabaseClient
          .from("members")
          .insert([
            {
              full_name: fullName,
              date_of_birth: dateOfBirth || null,
              gender: gender || null,
              phone_whatsapp: phone || null,
              address: address || null,
              marital_status: maritalStatus || null,
              church_joining_date: churchJoiningDate || null,
              date_of_salvation: dateOfSalvation || null,
              member_type: memberType || null,
              additional_notes: additionalNotes || null,
              created_by: sessionData.session.user.id
            }
          ])
          .select()
          .single();


      if (error) {

        console.error("SAVE ERROR:", error);

        message.textContent =
          "Error: " + error.message;

        message.className = "error";

        saveBtn.disabled = false;
        saveBtn.textContent = "SAVE MEMBER";

        return;
      }


      message.innerHTML =
        "Member Registered Successfully<br>" +
        "Member ID: <strong>" +
        data.member_id +
        "</strong>";

      message.className = "success";

      saveBtn.textContent = "MEMBER SAVED";


      document.getElementById("fullName").value = "";
      document.getElementById("dateOfBirth").value = "";
      document.getElementById("gender").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("address").value = "";
      document.getElementById("maritalStatus").value = "";
      document.getElementById("churchJoiningDate").value = "";
      document.getElementById("dateOfSalvation").value = "";
      document.getElementById("memberType").value = "";
      document.getElementById("additionalNotes").value = "";
      document.getElementById("photoInput").value = "";
      document.getElementById("photoPreview").style.display = "none";
    }


    function goBack() {
      window.location.href = "home.html";
    }


    checkLogin();

  </script>

</body>
</html>
