<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register New Member - COC Members</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .header {
      background: #174d3c;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[readonly] {
      background: #eee;
    }

    .photo-preview {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ccc;
      display: none;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #174d3c;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .back-btn {
      background: #777;
      margin-bottom: 15px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #dff3e7;
      color: #176b3a;
    }

    .error {
      background: #f8dddd;
      color: #a00000;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>COC Members</h1>
    <p>Church Of Christ Sri Lanka</p>
    <p>Members Registration</p>
  </div>

  <div class="container">

    <button class="back-btn" onclick="window.location.href='home.html'">
      ← Back to Dashboard
    </button>

    <div class="card">

      <h2>Register New Member</h2>

      <form id="memberForm">

        <div class="field">
          <label>Member ID</label>
          <input
            type="text"
            id="memberId"
            placeholder="Automatic"
            readonly
          >
        </div>

        <div class="field">
          <label>Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter Full Name"
            required
          >
        </div>

        <div class="field">
          <label>Date of Birth</label>
          <input
            type="date"
            id="dateOfBirth"
          >
        </div>

        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select...</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="field">
          <label>Phone / WhatsApp</label>
          <input
            type="tel"
            id="phoneWhatsapp"
            placeholder="Enter Phone / WhatsApp Number"
          >
        </div>

        <div class="field">
          <label>Address</label>
          <textarea
            id="address"
            placeholder="Enter Address"
          ></textarea>
        </div>

        <div class="field">
          <label>Marital Status</label>
          <select id="maritalStatus">
            <option value="">Select...</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
        </div>

        <div class="field">
          <label>Church Joining Date</label>
          <input
            type="date"
            id="churchJoiningDate"
          >
        </div>

        <div class="field">
          <label>Date of Salvation</label>
          <input
            type="date"
            id="dateOfSalvation"
          >
        </div>

        <div class="field">
          <label>Member Type</label>
          <select id="memberType">
            <option value="">Select...</option>
            <option value="Pastor">Pastor</option>
            <option value="Brother">Brother</option>
            <option value="Sister">Sister</option>
          </select>
        </div>

        <div class="field">
          <label>Member Photo</label>
          <input
            type="file"
            id="memberPhoto"
            accept="image/*"
            capture="environment"
          >
          <img
            id="photoPreview"
            class="photo-preview"
            alt="Member Photo Preview"
          >
        </div>

        <div class="field">
          <label>Additional Notes</label>
          <textarea
            id="additionalNotes"
            placeholder="Enter additional notes..."
          ></textarea>
        </div>

        <button type="submit" id="saveButton">
          SAVE MEMBER
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>
  </div>

<script>
  const SUPABASE_URL = "https://djxpqggcpaofkpvcqgvd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CNFFKEPixquJzd83jnyNEw_lAsIvU_c";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("memberForm");
  const saveButton = document.getElementById("saveButton");
  const message = document.getElementById("message");
  const photoInput = document.getElementById("memberPhoto");
  const photoPreview = document.getElementById("photoPreview");

  let selectedPhoto = null;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
  }

  function clearMessage() {
    message.textContent = "";
    message.style.display = "none";
  }

  photoInput.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) {
      selectedPhoto = null;
      photoPreview.style.display = "none";
      return;
    }

    selectedPhoto = file;

    const reader = new FileReader();

    reader.onload = function (event) {
      photoPreview.src = event.target.result;
      photoPreview.style.display = "block";
    };

    reader.readAsDataURL(file);
  });

  async function checkLogin() {
    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {
      window.location.href = "index.html";
      return null;
    }

    return session;
  }

  async function getCurrentUser() {
    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error) {
      return null;
    }

    return user;
  }

  checkLogin();

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    clearMessage();

    saveButton.disabled = true;
    saveButton.textContent = "SAVING...";

    try {
      const user = await getCurrentUser();

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const fullName =
        document.getElementById("fullName").value.trim();

      const dateOfBirth =
        document.getElementById("dateOfBirth").value || null;

      const gender =
        document.getElementById("gender").value || null;

      const phoneWhatsapp =
        document.getElementById("phoneWhatsapp").value.trim() || null;

      const address =
        document.getElementById("address").value.trim() || null;

      const maritalStatus =
        document.getElementById("maritalStatus").value || null;

      const churchJoiningDate =
        document.getElementById("churchJoiningDate").value || null;

      const dateOfSalvation =
        document.getElementById("dateOfSalvation").value || null;

      const memberType =
        document.getElementById("memberType").value || null;

      const additionalNotes =
        document.getElementById("additionalNotes").value.trim() || null;

      if (!fullName) {
        throw new Error("Please enter Full Name.");
      }

      const memberData = {
        full_name: fullName,
        date_of_birth: dateOfBirth,
        gender: gender,
        phone_whatsapp: phoneWhatsapp,
        address: address,
        marital_status: maritalStatus,
        church_joining_date: churchJoiningDate,
        "date of salvation": dateOfSalvation,
        member_type: memberType,
        additional_notes: additionalNotes,
        created_by: user.id
      };

      /*
        Member ID is NOT included here.
        Supabase automatically generates it using the database sequence.
      */

      const {
        data,
        error
      } = await supabaseClient
        .from("members")
        .insert([memberData])
        .select("id, member_id, full_name")
        .single();

      if (error) {
        throw error;
      }

      document.getElementById("memberId").value =
        data.member_id || "";

      showMessage(
        "Member Registered Successfully — Member ID: " +
        data.member_id,
        "success"
      );

      form.reset();

      document.getElementById("memberId").value =
        data.member_id || "";

      photoPreview.style.display = "none";
      photoPreview.src = "";
      selectedPhoto = null;

    } catch (error) {

      console.error(error);

      showMessage(
        "Error: " + (error.message || "Failed to register member."),
        "error"
      );

    } finally {

      saveButton.disabled = false;
      saveButton.textContent = "SAVE MEMBER";

    }
  });
</script>

</body>
</html>
